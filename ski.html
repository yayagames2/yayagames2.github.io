<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="lib/i18n.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Powder Rush</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#0c2a4a;--accent:#5ae0ff;--deep:#0a2a5a;--btn:linear-gradient(180deg,#5ae8ff,#1a7ad8);--btnsh:#0a3a7a;--panel:rgba(8,24,44,.82);--scr:transparent}
body{color:#fff;background:#0c2a4a}
.rb,.pill{color:#fff;background:rgba(8,24,44,.5);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px)}
#title{justify-content:flex-end;background:linear-gradient(180deg,rgba(6,20,40,0) 0%,rgba(6,20,40,0) 38%,rgba(6,20,40,.7) 55%,rgba(6,20,40,.92) 100%);overflow-y:auto}
#title .logo{pointer-events:none;position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;margin:0}
#title .logo .a{color:#fff;letter-spacing:6px;text-shadow:0 3px 0 #1a4a8a,0 0 18px rgba(90,220,255,.6)}
#title .logo .b{color:#fff;-webkit-text-stroke:3px #1a3a8a;text-shadow:0 6px 0 #0a2a6a,0 0 34px rgba(90,220,255,.55);font-size:clamp(48px,14vw,90px)}
.tpan{width:min(560px,100%);display:flex;flex-direction:column;gap:9px;align-items:stretch}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#modeSeg{grid-template-columns:repeat(6,1fr)}#modeSeg button small{display:none}#modeSeg button{font-size:12px}
.mts button.lk{opacity:.45}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{min-height:52px;border-radius:16px;background:rgba(255,255,255,.1);color:#fff;font-weight:900;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:2px solid transparent;padding:4px}
.seg button span{font-size:21px;line-height:1}
.seg button small{font-size:11px;opacity:.85;font-weight:700}
.seg button.on{background:linear-gradient(180deg,#5ae8ff,#1a7ad8);border-color:#d8f8ff;box-shadow:0 4px 0 #0a3a7a}
.mts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mts button{border-radius:16px;padding:7px 3px;background:rgba(255,255,255,.08);color:#fff;font-weight:900;font-size:12px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.mts button i{font-style:normal;font-size:24px}.mts button small{color:#ffd23a;font-size:11px;letter-spacing:1px}
.mts button.on{border-color:#5ae8ff;background:rgba(90,232,255,.18)}
.who{display:flex;gap:8px}
.who button{flex:1;display:flex;align-items:center;gap:8px;justify-content:center;height:52px;border-radius:16px;background:rgba(255,255,255,.08);color:#fff;font-weight:900;font-size:15px;border:2px solid transparent}
.who button.on{border-color:#ff7ad8;background:rgba(255,122,216,.18)}
.who .wd{flex:none;width:auto;padding:0 14px;background:linear-gradient(180deg,#ff8ad8,#c83aa8);border-color:#ffd0f0;box-shadow:0 4px 0 #7a1a6a}
.go2{height:60px;border-radius:999px;background:linear-gradient(180deg,#7aff5a,#22b81a);color:#fff;font-weight:900;font-size:22px;box-shadow:0 7px 0 #0f6a0a,0 14px 26px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.trow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#tHint{margin:0;font-weight:700;font-size:13px;opacity:.92;text-align:center}
/* wardrobe */
#wardS{position:fixed;left:0;right:0;bottom:0;z-index:16;background:rgba(8,20,40,.92);backdrop-filter:blur(10px);border-radius:24px 24px 0 0;padding:12px 12px max(12px,env(safe-area-inset-bottom));max-height:52vh;display:flex;flex-direction:column;gap:8px;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
#wardS .hd{display:flex;align-items:center;gap:8px}#wardS .hd b{flex:1;font-size:19px}
#wardS .x{width:44px;height:44px;border-radius:14px;background:linear-gradient(180deg,#7aff5a,#22b81a);font-weight:900;font-size:18px;color:#fff}
#wtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
#wtabs button{flex:none;height:38px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-weight:800;font-size:14px}
#wtabs button.on{background:#fff;color:#0a2a5a}
#wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;overflow-y:auto;padding:2px}
#wgrid button{border-radius:16px;background:rgba(255,255,255,.08);border:3px solid transparent;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-weight:800;font-size:11.5px}
#wgrid button .sw{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 2px rgba(255,255,255,.5);display:grid;place-items:center;font-size:24px}
#wgrid button.on{border-color:#5ae8ff;background:rgba(90,232,255,.2)}
body.ward #title .tpan,body.ward #title .logo{visibility:hidden}
/* hud */
#hud .pill b{font-size:16px;direction:ltr}
.trick{position:fixed;z-index:6;left:0;right:0;top:24%;text-align:center;pointer-events:none;font-weight:900;direction:ltr}
.trick div{font-size:28px;color:#fff;-webkit-text-stroke:1.5px #1a3a8a;text-shadow:0 4px 0 #1a3a8a,0 0 20px rgba(90,220,255,.7);animation:tpop 1.5s ease-out forwards;line-height:1.1}
.trick div small{display:block;font-size:20px;color:#ffe24a}
.trick div.bad{color:#ffc0b0;-webkit-text-stroke-color:#6a0a0a;text-shadow:0 4px 0 #6a0a0a}
@keyframes tpop{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.12);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.cd{position:fixed;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none}
.cd b{font-size:110px;font-weight:900;color:#fff;-webkit-text-stroke:4px #1a3a8a;text-shadow:0 8px 0 #1a3a8a;animation:cdp .9s ease-out forwards;direction:ltr}
@keyframes cdp{0%{transform:scale(2);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:0}}
#zones{position:fixed;inset:0;z-index:4;display:flex;touch-action:none}
#zones div{flex:1;position:relative}
#zones div i{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));font-style:normal;font-size:30px;font-weight:900;color:rgba(255,255,255,.55);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(10,30,60,.22);border:2px solid rgba(255,255,255,.3);transition:background .1s}
#zL i{left:max(18px,env(safe-area-inset-left))}#zR i{right:max(18px,env(safe-area-inset-right))}
#zones div.on i{background:rgba(90,232,255,.45);color:#fff}
.abtn{position:fixed;z-index:6;border-radius:50%;font-weight:900;color:#fff;touch-action:none;box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.55);user-select:none;-webkit-user-select:none;display:grid;place-items:center;line-height:1}
.abtn.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35);filter:brightness(1.2)}
.abtn small{display:block;font-size:10px;margin-top:2px}
#bJump{right:max(100px,calc(env(safe-area-inset-right) + 100px));bottom:max(20px,env(safe-area-inset-bottom));width:84px;height:84px;font-size:30px;background:radial-gradient(circle at 35% 30%,#8aff7a,#22b81a)}
#bFlip{right:max(100px,calc(env(safe-area-inset-right) + 100px));bottom:max(116px,calc(env(safe-area-inset-bottom) + 112px));width:70px;height:70px;font-size:26px;background:radial-gradient(circle at 35% 30%,#ffb08a,#e0501a)}
#bGrab{left:max(100px,calc(env(safe-area-inset-left) + 100px));bottom:max(20px,env(safe-area-inset-bottom));width:76px;height:76px;font-size:28px;background:radial-gradient(circle at 35% 30%,#ffe38a,#f0a014)}
.air #bJump{opacity:.35}
body:not(.air) #bFlip,body:not(.air) #bGrab{opacity:.35}
.spd{position:fixed;z-index:5;left:50%;transform:translateX(-50%);top:max(64px,calc(env(safe-area-inset-top) + 60px));text-align:center;font-weight:900;pointer-events:none;direction:ltr;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.spd b{font-size:26px;display:block;line-height:1}.spd small{font-size:11px;opacity:.85}
.gmsg{position:fixed;z-index:6;left:0;right:0;top:38%;text-align:center;font-weight:900;font-size:24px;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.prog{position:fixed;z-index:5;left:50%;transform:translateX(-50%);top:max(112px,calc(env(safe-area-inset-top) + 108px));width:min(220px,50vw);height:8px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden;direction:ltr}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ae8ff,#7aff5a)}
.res{list-style:none;padding:0;margin:8px 0;text-align:start}.res li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:12px;font-weight:800;background:#f2f7ff;margin-bottom:5px}
.card{background:#fff;color:#0a2a5a}
@media (orientation:landscape) and (max-height:620px){#title{flex-direction:row;justify-content:flex-end;align-items:center;background:linear-gradient(90deg,rgba(6,20,40,0) 30%,rgba(6,20,40,.82) 52%,rgba(6,20,40,.94))}#title .logo{right:auto;left:max(16px,env(safe-area-inset-left));top:auto;bottom:18px;text-align:start;width:auto}#title .logo .b{font-size:54px}.tpan{width:min(440px,56vw);gap:6px;max-height:100%;overflow-y:auto;padding:4px}.seg button{min-height:44px}.go2{height:50px}#wardS{left:auto;width:min(460px,60vw);max-height:80vh}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="top" id="hud" hidden>
  <button class="rb" id="pauseBtn">⏸</button>
  <div class="pill"><b id="h1"></b><small id="h1s"></small></div>
  <div class="sp"></div>
  <div class="pill"><b id="h2"></b><small id="h2s"></small></div>
</div>
<div class="prog" id="prog" hidden><b></b></div>
<div class="spd" id="spd" hidden><b id="spdTxt">0</b><small>km/h</small></div>
<div class="trick" id="trick"></div>
<div class="gmsg" id="gmsg"></div>
<div class="cd" id="cd"></div>
<div id="zones" hidden><div id="zL"><i>◀</i></div><div id="zR"><i>▶</i></div></div>
<button class="abtn" id="bJump" hidden>⤴<small></small></button>
<button class="abtn" id="bFlip" hidden>🔄</button>
<button class="abtn" id="bGrab" hidden>✋</button>
<div id="toast"></div>
<section class="scr" id="title" hidden>
  <button class="rb homeT" id="homeT" hidden></button>
  <h1 class="logo"><span class="a">POWDER</span><span class="b">RUSH</span></h1>
  <div class="tpan">
    <div class="who" id="who"></div>
    <div class="seg two" id="gearSeg"></div>
    <div class="seg" id="modeSeg"></div>
    <div class="mts" id="mts"></div>
    <p id="tHint"></p>
    <button class="go2" id="goBtn"></button>
    <div class="trow"><button class="chip" id="helpBtn"></button><button class="chip" id="qBtn"></button><button class="chip" id="sndChip"></button></div>
  </div>
</section>
<div id="wardS" hidden><div class="hd"><b id="wT"></b><button class="x" id="wX">✓</button></div><div id="wtabs"></div><div id="wgrid"></div></div>
<div class="sheet" id="endSheet" hidden><div class="card"><div id="eE" style="font-size:52px;line-height:1"></div><h3 id="eT"></h3><div class="stars" id="eStars"><i>⭐</i><i>⭐</i><i>⭐</i></div><ul class="res" id="eRes"></ul><div class="row"><button class="btn" id="eMenu"></button><button class="btn pri" id="eAgain"></button></div></div></div>
<div class="sheet" id="pauseSheet" hidden><div class="card"><h3 id="pT"></h3><div class="row"><button class="btn" id="pMenu"></button><button class="btn pri" id="pGo"></button></div></div></div>
<div class="sheet" id="helpSheet" hidden><div class="card" style="text-align:start"><div style="font-size:46px;text-align:center">🏂</div><h3 id="hT" style="text-align:center"></h3><div id="hB" style="font-weight:700;font-size:14px;line-height:1.55;color:#33405a"></div><button class="btn pri" id="hX" style="width:100%;margin-top:10px"></button></div></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="ski/game.js"></script>
</body>
</html>
