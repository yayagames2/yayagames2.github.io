<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="lib/i18n.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mud Rush</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#2a1c10;--accent:#ff8a1f;--deep:#5a3414;--btn:linear-gradient(180deg,#ffb23a,#f06a14);--btnsh:#8a3a0a;--panel:rgba(30,20,12,.86);--scr:transparent}
body{color:#fff;background:#2a1c10}
.rb,.pill{color:#fff;background:rgba(20,14,8,.55);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px)}
.logo .a{color:#ffd23a;text-shadow:0 3px 0 #6a3a0a,0 0 18px rgba(255,180,40,.45)}.logo .b{color:#fff;-webkit-text-stroke:3px #8a4a14;text-shadow:0 6px 0 #4a2408,0 0 30px rgba(255,120,30,.45)}
#title{justify-content:flex-end;background:linear-gradient(180deg,rgba(20,12,6,0) 0%,rgba(20,12,6,0) 26%,rgba(20,12,6,.78) 46%,rgba(20,12,6,.94) 100%)}
#title .homeT{z-index:3}
#title .logo{pointer-events:none;position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;margin:0;font-size:clamp(38px,10vw,64px)}
.tpan{width:min(560px,100%);display:flex;flex-direction:column;gap:10px;align-items:stretch}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{height:54px;border-radius:16px;background:rgba(255,255,255,.1);color:#fff;font-weight:900;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:2px solid transparent}
.seg button span{font-size:20px;line-height:1}
.seg button.on{background:linear-gradient(180deg,#ffb23a,#f06a14);border-color:#ffd88a;box-shadow:0 4px 0 #8a3a0a}
.trk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.trk button{border-radius:16px;padding:8px 4px;background:rgba(255,255,255,.08);color:#fff;font-weight:900;font-size:13px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.trk button i{font-style:normal;font-size:22px}.trk button small{color:#ffd23a;font-size:12px;letter-spacing:1px}
.trk button.on{border-color:#ffb23a;background:rgba(255,178,58,.16)}
.vsel{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:18px;padding:8px}
.vsel .ar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);font-size:20px;font-weight:900;color:#fff;flex:none}
.vmid{flex:1;text-align:center}.vmid b{font-size:19px}.vmid p{margin:1px 0 4px;font-size:12px;opacity:.85;font-weight:700}
.bars{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:11px;font-weight:800;text-align:start;align-items:center;direction:inherit}
.bars i{display:block;height:7px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}.bars i b{display:block;height:100%;background:linear-gradient(90deg,#ffd23a,#ff6a1f)}
.rid{display:flex;gap:6px;justify-content:center}
.rid button{flex:1;max-width:130px;height:48px;border-radius:14px;background:rgba(255,255,255,.08);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid transparent}
.rid button i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.rid button.on{border-color:#ffb23a;background:rgba(255,178,58,.16)}
.go2{height:62px;border-radius:999px;background:linear-gradient(180deg,#7aff5a,#22b81a);color:#fff;font-weight:900;font-size:22px;box-shadow:0 7px 0 #0f6a0a,0 14px 26px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.trow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#hud .pill b{font-size:16px}
.mini{position:fixed;z-index:5;top:max(64px,calc(env(safe-area-inset-top) + 62px));inset-inline-end:12px;width:104px;height:104px;border-radius:16px;background:rgba(20,14,8,.45);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15)}
.spd{position:fixed;z-index:5;left:50%;transform:translateX(-50%);top:max(10px,env(safe-area-inset-top));text-align:center;font-weight:900;pointer-events:none;direction:ltr;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.spd b{font-size:34px;display:block;line-height:1}.spd small{font-size:11px;opacity:.85}
.trick{position:fixed;z-index:6;left:0;right:0;top:30%;text-align:center;pointer-events:none;font-weight:900;direction:ltr}
.trick div{font-size:30px;color:#fff;-webkit-text-stroke:1.5px #8a3a0a;text-shadow:0 4px 0 #8a3a0a,0 0 20px rgba(255,180,40,.7);animation:tpop 1.3s ease-out forwards}
.trick div.bad{color:#ffb0a0;-webkit-text-stroke-color:#5a0a0a;text-shadow:0 4px 0 #5a0a0a}
@keyframes tpop{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.15);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.cd{position:fixed;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none}
.cd b{font-size:120px;font-weight:900;color:#fff;-webkit-text-stroke:4px #8a3a0a;text-shadow:0 8px 0 #8a3a0a;animation:cdp .9s ease-out forwards;direction:ltr}
@keyframes cdp{0%{transform:scale(2);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:0}}
.ctl{position:fixed;z-index:6;bottom:max(16px,calc(env(safe-area-inset-bottom) + 8px));display:flex;gap:12px;align-items:flex-end;direction:ltr}
.ctl button{border-radius:50%;font-weight:900;color:#fff;touch-action:none;box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.35);user-select:none;-webkit-user-select:none}
.ctl button.on{box-shadow:0 1px 0 rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.55);filter:brightness(1.25)}.ctl,.ctl button{touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}#tpad{position:fixed;inset:0;z-index:5;touch-action:none}
#cL{left:max(14px,env(safe-area-inset-left))}#cR{right:max(14px,env(safe-area-inset-right))}
.st{width:78px;height:78px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),rgba(255,255,255,.12));font-size:32px}
#bGas{width:84px;height:118px;border-radius:26px!important;background:linear-gradient(180deg,#7aff5a,#22b81a);font-size:30px}
#bBrk{width:66px;height:66px;background:radial-gradient(circle at 35% 30%,#ff8a7a,#d8241a);font-size:22px}
#bTrk{width:62px;height:62px;background:radial-gradient(circle at 35% 30%,#ffe38a,#f0a014);font-size:26px;position:absolute;bottom:128px;right:10px;opacity:.4;transition:opacity .15s}
#bTrk.live{opacity:1;animation:tg .5s ease-in-out infinite alternate}@keyframes tg{to{box-shadow:0 0 0 6px rgba(255,220,80,.4),0 0 24px #ffd23a}}
#bUse{position:fixed;z-index:6;right:max(18px,env(safe-area-inset-right));bottom:max(150px,calc(env(safe-area-inset-bottom) + 142px));width:74px;height:74px;border-radius:22px;font-size:34px;background:rgba(20,14,8,.6);border:3px solid rgba(255,255,255,.4);box-shadow:0 5px 0 rgba(0,0,0,.35);touch-action:none;color:#fff;opacity:.55}
#bUse.live{opacity:1;background:linear-gradient(180deg,#b87aff,#6a2ad8);border-color:#fff;animation:tg .5s ease-in-out infinite alternate}
#splat{position:fixed;inset:0;z-index:4;pointer-events:none}
.ww{position:fixed;z-index:6;top:22%;left:0;right:0;text-align:center;font-weight:900;font-size:26px;color:#ff5a3a;text-shadow:0 3px 0 #000;pointer-events:none}
.res{list-style:none;padding:0;margin:8px 0;text-align:start}.res li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:12px;font-weight:800}.res li.me{background:#fff2d8}.res li b{width:28px;font-size:18px}
.card{background:#fff;color:#2a1c10}
.chip svg{width:22px;height:22px;display:block}
@media (orientation:landscape) and (max-height:620px){#title{flex-direction:row;justify-content:flex-end;align-items:center;background:linear-gradient(90deg,rgba(20,12,6,0) 30%,rgba(20,12,6,.8) 52%,rgba(20,12,6,.94))}#title .logo{right:auto;left:max(16px,env(safe-area-inset-left));top:auto;bottom:18px;text-align:start;width:auto;font-size:44px}.tpan{width:min(430px,54vw);gap:7px;max-height:100%;overflow-y:auto;padding:4px}.seg button{height:46px}.go2{height:52px}.vsel{padding:5px}}
@media (orientation:landscape) and (max-height:620px){html[dir=rtl] #title{background:linear-gradient(270deg,rgba(20,12,6,0) 30%,rgba(20,12,6,.8) 52%,rgba(20,12,6,.94))}html[dir=rtl] #title .logo{left:auto;right:max(16px,env(safe-area-inset-right))}}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="splat"></canvas>
<div class="top" id="hud" hidden>
  <button class="rb" id="pauseBtn"></button>
  <div class="pill" id="pPos"><b id="posTxt"></b><small id="posSub"></small></div>
  <div class="pill"><b id="lapTxt" style="direction:ltr"></b><small id="lapSub"></small></div>
  <div class="sp"></div>
  <div class="pill"><b id="timeTxt" style="direction:ltr">0:00</b><small id="timeSub"></small></div>
  <button class="rb" id="rspBtn">🔄</button>
</div>
<canvas class="mini" id="mini" width="208" height="208" hidden></canvas>
<div id="tpad" hidden></div>
<div class="spd" id="spd" hidden><b id="spdTxt">0</b><small>km/h</small></div>
<div class="trick" id="trick"></div>
<div class="ww" id="ww" hidden></div>
<div class="cd" id="cd"></div>
<div class="ctl" id="cL" hidden><button class="st" id="bL">◀</button><button class="st" id="bR">▶</button></div>
<div class="ctl" id="cR" hidden><button id="bBrk">⏪</button><button id="bGas">⏩</button><button id="bTrk">⭐</button></div>
<button id="bUse" hidden>🎁</button>
<div id="toast"></div>
<section class="scr" id="title" hidden>
  <button class="rb homeT" id="homeT" hidden></button>
  <h1 class="logo"><span class="a">MUD</span><span class="b">RUSH</span></h1>
  <div class="tpan">
    <div class="seg" id="modes"></div>
    <div class="trk" id="trks"></div>
    <div class="vsel"><button class="ar" id="vPrev">◀</button><div class="vmid"><b id="vName"></b><p id="vDesc"></p><div class="bars" id="vBars"></div></div><button class="ar" id="vNext">▶</button></div>
    <div class="rid" id="rids"></div>
    <button class="go2" id="goBtn"></button>
    <div class="trow"><button class="chip" id="autoBtn"></button><button class="chip" id="qBtn"></button><button class="chip" id="sndBtn2"></button></div>
  </div>
</section>
<div class="sheet" id="endSheet" hidden><div class="card"><h3 id="eT"></h3><div class="stars" id="eStars"><i>⭐</i><i>⭐</i><i>⭐</i></div><p id="eP"></p><ul class="res" id="eRes"></ul><div class="row"><button class="btn" id="eMap"></button><button class="btn pri" id="eAgain"></button></div></div></div>
<div class="sheet" id="pauseSheet" hidden><div class="card"><h3 id="pT"></h3><div class="row"><button class="btn" id="pMap"></button><button class="btn" id="pRestart"></button><button class="btn pri" id="pGo"></button></div></div></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="mud/game.js"></script>
</body>
</html>
