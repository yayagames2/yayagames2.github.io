<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Slime Lab</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#c8f5e4;--accent:#2fc39a;--btn:linear-gradient(180deg,#5ae8b8,#1fb58a);--btnsh:#0f7a5a;--panel:rgba(255,255,255,.95)}
body{background:radial-gradient(circle at 50% 15%,#f4fffb,#c8f5e4 45%,#b8d8ff);color:#1f5a4a;overflow:hidden;transition:background .8s}
body.dark{background:radial-gradient(circle at 50% 30%,#2a2050,#0c0a1c 70%)}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle,rgba(255,255,255,.65) 2px,transparent 3px) 0 0/34px 34px;opacity:.5;pointer-events:none}
body.dark::before{opacity:.08}
#cv{position:fixed;inset:0;display:block;touch-action:none;z-index:1}
#toast{z-index:41}
#hud{position:fixed;z-index:3;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;gap:10px;align-items:center}
#stepT{flex:1;text-align:center;font-weight:900;font-size:20px;color:#1f7a5a;text-shadow:0 2px 0 #fff}
body.dark #stepT{color:#fff;text-shadow:0 2px 8px #000}
#panel{position:fixed;z-index:3;left:0;right:0;bottom:0;padding:12px 12px max(12px,env(safe-area-inset-bottom));background:rgba(255,255,255,.9);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(20,90,70,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#opts{max-width:560px;margin:0 auto}
.lbl{font-weight:900;font-size:14px;margin:2px 4px 4px;color:#1f7a5a}
.row2{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}.row2::-webkit-scrollbar{display:none}
.sw{flex:none;width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 8px rgba(20,90,70,.25)}
.sw.on{outline:3px solid #1f7a5a;transform:scale(1.1)}
.ch{flex:none;min-width:48px;height:48px;border-radius:16px;background:#eafff7;font-size:22px;box-shadow:0 3px 0 #b8e8d8;padding:0 10px;font-weight:800;color:#1f7a5a}
.ch.on{background:linear-gradient(180deg,#5ae8b8,#1fb58a);color:#fff;box-shadow:0 3px 0 #0f7a5a}
.ch small{display:block;font-size:11px;line-height:1}
.sep{flex:none;width:2px;background:#c8eee0;margin:6px 2px;border-radius:2px}
.meter{position:relative;height:30px;border-radius:15px;background:#e4f6ef;overflow:hidden;margin:2px 0 6px}
.meter i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#7ae8c8,#5ab8ff,#b88aff);transition:width .15s}
[dir=rtl] .meter i{inset:0 0 0 auto}
.meter span{position:relative;display:block;text-align:center;line-height:30px;font-weight:900;font-size:14px;color:#1f5a4a}
.hint{text-align:center;font-weight:800;padding:6px 4px 10px;color:#1f7a5a}.hint.hb{font-size:18px;padding:12px 4px 6px}
.nav1{display:flex;justify-content:center;margin-top:6px}.btn.big{height:56px;font-size:19px;padding:0 26px;flex:1;max-width:420px}
.btn.ready{animation:rdy 1s ease-in-out infinite}@keyframes rdy{50%{transform:scale(1.06)}}
.btn:disabled{opacity:.45}
#title{position:fixed;inset:0;z-index:5;overflow-y:auto;text-align:center;padding:max(14px,env(safe-area-inset-top)) 16px 30px}
#title .homeT{position:absolute;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px;z-index:2}
.logo{margin:56px 0 0;font-size:clamp(42px,12vw,68px);line-height:.95;pointer-events:none}
.logo .a{display:block;color:#2fc39a;-webkit-text-stroke:2px #fff;text-shadow:0 6px 0 #0f7a5a,0 10px 24px rgba(15,122,90,.4)}
.logo .b{display:block;color:#a86aff;-webkit-text-stroke:3px #fff;text-shadow:0 6px 0 #5a2ac8}
#demo{width:190px;height:150px;margin:6px auto -4px;display:block;animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px) scale(1.05,.95)}}
#tSub{max-width:420px;margin:6px auto 16px;font-weight:700}
#newBtn{height:64px;font-size:21px;padding:0 34px;animation:rdy 1.4s ease-in-out infinite}
#albumBtn{margin-top:12px;height:46px;background:#fff;color:#1f7a5a;box-shadow:0 4px 0 #b8e8d8;font-size:17px}
#shelfT{margin:24px 0 8px;color:#1f7a5a}
#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;max-width:560px;margin:0 auto;padding:12px;border-radius:22px;background:rgba(255,255,255,.5);box-shadow:inset 0 -8px 0 rgba(20,90,70,.15)}
.tc{aspect-ratio:1;border-radius:18px;background:rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(20,90,70,.18);padding:0}
.tc img{width:100%;height:100%;display:block}
.empty{grid-column:1/-1;font-weight:800;opacity:.8}
#flash{position:fixed;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none}
.tierB{position:fixed;z-index:9;left:0;right:0;top:14%;text-align:center;pointer-events:none;opacity:0;transform:scale(.3);transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .25s}
.tierB.on{opacity:1;transform:scale(1)}
.tierB b{display:inline-block;font-size:38px;font-weight:900;color:#fff;padding:6px 26px;border-radius:999px;background:var(--c);box-shadow:0 6px 0 rgba(0,0,0,.18),0 0 40px var(--c)}
.tierB.t4 b{background:linear-gradient(90deg,#ff4ab0,#ffb21f,#5ae0a0,#4ab0ff,#b05aff);animation:hue 2s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
.tierB span{display:block;margin-top:8px;font-size:22px;font-weight:900;color:#1f5a4a;text-shadow:0 2px 0 #fff}
body.dark .tierB span{color:#fff;text-shadow:0 2px 6px #000}
.tierB i{display:inline-block;margin-top:6px;font-style:normal;font-weight:900;font-size:16px;background:#ff3a6a;color:#fff;padding:3px 12px;border-radius:999px;animation:rdy .8s ease-in-out infinite}
#album{position:fixed;inset:0;z-index:12;overflow-y:auto;background:linear-gradient(180deg,#f4fffb,#dfe8ff);padding:max(12px,env(safe-area-inset-top)) 10px 30px}
.ahead{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto 8px}.ahead h3{margin:0;color:#1f7a5a;flex:1;text-align:center}.ahead .btn{width:46px;padding:0}
.agrid{max-width:640px;margin:0 auto}.arow{margin-bottom:10px;background:rgba(255,255,255,.6);border-radius:18px;padding:8px}
.tl{display:block;font-weight:900;margin:0 4px 6px;color:#1f5a4a}
.acs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.ac{position:relative;aspect-ratio:1;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;padding:0}.ac img{width:100%;height:100%;display:block}
.ac.lock{font-size:22px;color:rgba(30,90,70,.35);font-weight:900}
.ac small{position:absolute;bottom:2px;left:0;right:0;font-size:10px;font-weight:800;color:#1f5a4a}
.blink{animation:blk .8s ease-in-out infinite!important;box-shadow:0 0 0 4px #fff,0 0 24px 8px #ffd23a!important;position:relative;z-index:2}@keyframes blk{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.btn.blink::after{content:'👆';position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:30px;animation:pt .8s ease-in-out infinite}@keyframes pt{50%{transform:translate(-50%,-8px)}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden><button class="rb" id="backBtn"></button><div id="stepT"></div><button class="rb" id="sndBtn"></button></div>
<div id="panel" hidden><div id="opts"></div></div>
<div id="title" hidden><button class="rb homeT" id="homeT" hidden></button><h1 class="logo"><span class="a">SLIME</span><span class="b">LAB</span></h1><img id="demo" alt=""><p id="tSub"></p><button class="btn pri" id="newBtn"></button><div><button class="btn" id="albumBtn"></button></div><h3 id="shelfT"></h3><div id="shelf"></div></div>
<div id="flash"></div><div id="tierB" class="tierB"></div>
<div id="album" hidden></div>
<div id="toast"></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="slime/game.js"></script>
</body>
</html>
