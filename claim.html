<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Zone Claim</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#0e2a3a;--accent:#ffb21f;--deep:#0a4a6a;--btn:linear-gradient(180deg,#5ad8ff,#1a8ad8);--btnsh:#0a4a8a;--panel:rgba(12,30,48,.82);--scr:radial-gradient(circle at 50% 30%,rgba(20,60,90,.35),rgba(6,16,28,.9))}
body{color:#fff}
.rb,.pill{color:#fff;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px)}
.logo .a{color:#ffd23a;text-shadow:0 0 18px rgba(255,200,40,.5)}.logo .b{-webkit-text-stroke:3px #1a8ad8;text-shadow:0 6px 0 #0a4a6a,0 0 30px rgba(60,180,255,.5)}
.sub{color:#cfe8f4}
.bar{position:fixed;top:max(64px,calc(env(safe-area-inset-top) + 62px));left:50%;transform:translateX(-50%);width:min(360px,80vw);height:14px;border-radius:7px;background:rgba(0,0,0,.35);z-index:5;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5aff8a,#ffd23a);transition:width .3s}
.bar b{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 6px #fff}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:900;text-shadow:0 1px 2px #000;direction:ltr}
.pw{position:fixed;top:max(86px,calc(env(safe-area-inset-top) + 84px));left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:6px;pointer-events:none}
.pw span{padding:4px 10px;border-radius:999px;background:rgba(10,30,50,.75);border:1px solid rgba(255,255,255,.25);font-weight:800;font-size:12.5px}
.hint{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;font-weight:800;font-size:13px;opacity:.75;pointer-events:none;text-align:center;width:90vw}
.pop{position:fixed;z-index:7;pointer-events:none;font-weight:900;font-size:24px;direction:ltr;transform:translateX(-50%);animation:up 1.1s ease-out forwards;text-shadow:0 2px 0 #000,0 0 14px #ffd23a;color:#fff}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
.card{background:#fff}
</style>
</head>
<body>
<div id="stage"></div>
<div class="top" id="hud" hidden>
  <button class="rb" id="mapBtn"></button>
  <div class="pill"><b id="lvTxt"></b><small id="livesTxt"></small></div>
  <div class="sp"></div>
  <div class="pill"><b id="scoreTxt" style="direction:ltr">0</b><small id="lScore"></small></div>
  <button class="rb" id="sndBtn"></button>
</div>
<div class="bar" id="bar" hidden><i id="barI"></i><b id="barG"></b><span id="barT"></span></div>
<div class="pw" id="pw"></div>
<div class="hint" id="hint" hidden></div>
<div id="toast"></div>
<section class="scr" id="title" hidden>
  <button class="rb homeT" id="homeT" hidden></button>
  <h1 class="logo" style="margin-top:5vh"><span class="a">ZONE</span><span class="b">CLAIM</span></h1>
  <p class="sub" id="tSub"></p>
  <button class="big" id="playBtn"></button>
  <div class="lgrid" id="lgrid" style="grid-template-columns:repeat(5,1fr)"></div>
  <div class="chips"><button class="chip" id="qBtn"></button></div>
</section>
<div class="sheet" id="endSheet" hidden><div class="card"><h3 id="eT"></h3><div class="stars" id="eStars"><i>⭐</i><i>⭐</i><i>⭐</i></div><p id="eP"></p><div class="row"><button class="btn" id="eMap"></button><button class="btn" id="eAgain"></button><button class="btn pri" id="eNext"></button></div></div></div>
<div class="sheet" id="pauseSheet" hidden><div class="card"><h3 id="pT"></h3><div class="row"><button class="btn" id="pMap"></button><button class="btn pri" id="pGo"></button></div></div></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="claim/game.js"></script>
</body>
</html>
