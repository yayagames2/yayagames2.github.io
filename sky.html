<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="lib/i18n.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sky Dodge</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#0b0820;--accent:#2ff3ff;--deep:#6a1bff;--btn:linear-gradient(180deg,#ff3fd0,#7a1bff);--btnsh:#3d0a8a;--panel:rgba(20,14,50,.75);--scr:radial-gradient(circle at 50% 30%,rgba(60,20,120,.35),rgba(8,6,24,.92))}
body{color:#fff}
.rb{color:#fff;border:1px solid rgba(47,243,255,.35);backdrop-filter:blur(6px)}
.score{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none;direction:ltr}
.score b{display:block;font-size:44px;font-weight:900;text-shadow:0 0 18px #2ff3ff,0 0 4px #fff;letter-spacing:1px}
.score small{font-size:13px;font-weight:800;color:#ffd84a;text-shadow:0 0 10px #ffb800}
.pw{position:fixed;bottom:max(126px,calc(env(safe-area-inset-bottom) + 126px));left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px;pointer-events:none}
.pw span{padding:6px 12px;border-radius:999px;background:rgba(20,14,50,.7);border:1px solid rgba(255,255,255,.25);font-weight:800;font-size:13px}
.fire{position:fixed;inset-inline-end:16px;bottom:max(18px,env(safe-area-inset-bottom));z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;direction:ltr;right:16px;left:auto}
.fire button{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8af0,#ff2fb0 55%,#8a0a6a);color:#fff;font-weight:900;font-size:18px;letter-spacing:1px;box-shadow:0 0 24px rgba(255,47,176,.6),0 6px 0 #5a0646;touch-action:none;border:2px solid rgba(255,255,255,.5)}
.fire button:active{transform:translateY(4px);box-shadow:0 0 30px rgba(255,47,176,.9),0 2px 0 #5a0646}
.fire button.hot{filter:grayscale(.8)}
.heat{width:80px;height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}.heat i{display:block;height:100%;width:0;background:#2ff3ff}
.pop{direction:ltr;position:fixed;z-index:6;pointer-events:none;font-weight:900;font-size:20px;color:#fff;text-shadow:0 0 12px #ff3fd0;animation:up 1s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
@keyframes up{to{transform:translate(-50%,-60px);opacity:0}}
.stat{display:flex;gap:18px;justify-content:center;margin:14px 0 4px;font-weight:800}
.stat div{display:flex;flex-direction:column;align-items:center}.stat small{opacity:.7;font-size:12px}.stat b{font-size:22px}
.logo .b{-webkit-text-stroke:2px #ff3fd0;text-shadow:0 0 24px #ff3fd0,0 0 60px #7a1bff;color:#fff}
.logo .a{color:#2ff3ff;text-shadow:0 0 18px #2ff3ff}
.hangar{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:12px}
.sk{border-radius:18px;padding:10px 6px;background:#f3f0ff;border:3px solid transparent;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.sk i{width:48px;height:20px;border-radius:10px;display:block}
.sk[aria-pressed=true]{border-color:#7a1bff}
.sk.lock{opacity:.55}
.card{background:#fff}
</style>
</head>
<body>
<div id="stage"></div>
<div class="top" id="hud" hidden><button class="rb" id="pauseBtn"></button><div class="sp"></div><button class="rb" id="sndBtn"></button></div>
<div class="score" id="score" hidden><b id="dist">0</b><small id="coinsTxt">🪙 0</small></div>
<div class="pw" id="pw"></div>
<div class="fire" id="fireWrap" hidden><div class="heat"><i id="heatI"></i></div><button id="fireBtn">FIRE</button></div>
<div id="toast"></div>
<section class="scr" id="title" hidden>
  <button class="rb homeT" id="homeT" hidden></button>
  <h1 class="logo" style="margin-top:8vh"><span class="a">SKY</span><span class="b">DODGE</span></h1>
  <p class="sub" id="tSub"></p>
  <div class="stat"><div><small id="lBest"></small><b id="vBest">0</b></div><div><small id="lCoins"></small><b id="vCoins">0</b></div></div>
  <button class="big" id="playBtn"></button>
  <div class="chips"><button class="chip" id="hangarBtn"></button><button class="chip" id="qBtn"></button></div>
</section>
<div class="sheet" id="overSheet" hidden><div class="card"><h3 id="oT"></h3><div class="stat" style="color:#1c2240"><div><small id="oL1"></small><b id="oDist">0</b></div><div><small id="oL2"></small><b id="oCoins">0</b></div><div><small id="oL3"></small><b id="oBest">0</b></div></div><p id="oP"></p><div class="row"><button class="btn" id="oMenu"></button><button class="btn pri" id="oAgain"></button></div></div></div>
<div class="sheet" id="hangarSheet" hidden><div class="card"><h3 id="hT"></h3><p id="hP"></p><div class="hangar" id="hangar"></div><div class="row" style="margin-top:14px"><button class="btn" id="hClose"></button></div></div></div>
<div class="sheet" id="pauseSheet" hidden><div class="card"><h3 id="pT"></h3><div class="row" style="margin-top:14px"><button class="btn" id="pMenu"></button><button class="btn pri" id="pGo"></button></div></div></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="sky/game.js"></script>
</body>
</html>
