<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kibo Jungle</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#123a1e;--accent:#ffb21a;--deep:#3a1a06;--btn:linear-gradient(180deg,#ffcf3a,#ff8a1a);--btnsh:#8a3a00;--panel:rgba(20,40,16,.72);--scr:transparent}
body{background:#123a1e;color:#fff;overflow:hidden}
#hud{position:fixed;z-index:5;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;align-items:center;pointer-events:none;direction:ltr}
#hud>*{pointer-events:auto}
#hud .sp{flex:1}
.hp{height:40px;padding:0 11px;border-radius:14px;background:rgba(18,36,14,.62);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);display:flex;align-items:center;gap:5px;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hp.bump{animation:bump .25s ease-out}@keyframes bump{40%{transform:scale(1.18)}}
#qBtnG{width:40px;height:40px;border-radius:14px;background:rgba(18,36,14,.62);border:1px solid rgba(255,255,255,.18);font-size:18px;color:#fff;display:grid;place-items:center}
#bud{color:#d8ff6a}
#ctl{position:fixed;inset:0;z-index:4;pointer-events:none}
.joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);pointer-events:auto;touch-action:none}
.joy i{position:absolute;left:37px;top:37px;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.ab{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:0 6px 0 rgba(0,0,0,.3),0 10px 20px rgba(0,0,0,.3);border:3px solid rgba(255,255,255,.6)}
.ab small{display:block;font-size:11px;margin-top:-4px}
.ab.on{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
#bJ{right:max(18px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));width:96px;height:96px;background:radial-gradient(circle at 40% 30%,#7ae05a,#2a9a2a);font-size:34px;line-height:1}
#bS{right:max(122px,calc(env(safe-area-inset-right) + 122px));bottom:max(40px,calc(env(safe-area-inset-bottom) + 14px));width:76px;height:76px;background:radial-gradient(circle at 40% 30%,#ffcf4a,#e8781a);font-size:30px;line-height:1}
#tip{position:fixed;z-index:6;left:12px;right:12px;top:max(70px,calc(env(safe-area-inset-top) + 64px));text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#tip span{display:inline-block;background:rgba(255,255,255,.95);color:#2a3a12;font-weight:900;font-size:16px;padding:9px 16px;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.3);max-width:420px}
#tip.on{opacity:1}
#big{position:fixed;z-index:8;left:0;right:0;top:36%;text-align:center;pointer-events:none;font-weight:900;font-size:clamp(34px,11vw,70px);color:#fff;-webkit-text-stroke:2px #3a1a06;text-shadow:0 6px 0 #3a1a06,0 0 30px rgba(255,200,60,.7);opacity:0;transform:scale(.3);transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .2s}
#big.on{opacity:1;transform:scale(1)}#big small{display:block;font-size:18px;-webkit-text-stroke:0;text-shadow:0 2px 6px #000}
#title{justify-content:flex-start;background:linear-gradient(180deg,rgba(10,40,14,.35),rgba(6,24,8,.88) 62%)}
#title .logo .a{color:#ffcf3a;letter-spacing:6px;text-shadow:0 3px 0 #3a1a06}
#title .logo .b{-webkit-text-stroke:3px #2a5a10;color:#c8ff5a;text-shadow:0 6px 0 #1a3a06,0 14px 24px rgba(0,0,0,.4)}
.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(440px,100%);margin-top:14px}
.lvc{border-radius:18px;background:rgba(255,255,255,.95);color:#2a3a12;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:900;font-size:13px;box-shadow:0 6px 0 rgba(0,0,0,.25);border:3px solid transparent;position:relative}
.lvc i{font-style:normal;font-size:30px;line-height:1.15}.lvc small{font-size:12px;color:#e8a00a;letter-spacing:1px}
.lvc.on{border-color:#ffb21a;transform:translateY(-3px)}
.lvc.lock{background:rgba(255,255,255,.35);color:rgba(30,40,20,.6)}
.lvc .gm{position:absolute;top:3px;right:6px;font-size:14px}
.lvc .n{position:absolute;top:4px;left:8px;font-size:11px;color:#8a9a6a}
#goBtn{margin-top:16px}
.spc{flex:1;min-height:30vh}
#title{background:linear-gradient(180deg,rgba(10,40,14,.45),rgba(10,40,14,0) 30%,rgba(10,40,14,0) 52%,rgba(6,24,8,.85) 70%)!important}
#endS .card,#pauseS .card,#overS .card{background:linear-gradient(180deg,#fffdf0,#f2ffe0)}
.st{display:flex;justify-content:center;gap:14px;font-weight:900;font-size:20px;margin:6px 0 12px;direction:ltr;flex-wrap:wrap}
.gem{font-size:36px;animation:pop .5s ease-out}
#bossBar{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:max(112px,calc(env(safe-area-inset-top) + 108px));display:flex;align-items:center;gap:8px;direction:ltr;pointer-events:none}#bossBar b{font-size:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}#bossBar span{width:min(220px,50vw);height:16px;border-radius:9px;background:rgba(0,0,0,.45);border:2px solid #fff;overflow:hidden}#bossBar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3a3a,#ffb21a);transition:width .4s}
#flash{position:fixed;inset:0;z-index:7;pointer-events:none;background:#fff;opacity:0;transition:opacity .25s}
#hurt{position:fixed;inset:0;z-index:7;pointer-events:none;box-shadow:inset 0 0 120px rgba(255,40,40,.7);opacity:0;transition:opacity .3s}
@media (orientation:landscape) and (max-height:560px){.spc{min-height:0;flex:0}#title{background:linear-gradient(180deg,rgba(10,40,14,.35),rgba(6,24,8,.88) 62%)!important}.lvs{grid-template-columns:repeat(6,1fr);width:min(700px,100%)}#title .logo{margin-top:0!important}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud" hidden><button id="qBtnG" aria-label="pause">⏸</button><div class="hp" id="hF">🥭 <span id="nF">0</span></div><div class="hp" id="hC">📦 <span id="nC">0/0</span></div><div class="sp"></div><div class="hp" id="bud" hidden>✨</div><div class="hp" id="hL">❤️ <span id="nL">3</span></div></div>
<div id="ctl" hidden><div class="joy" id="joy"><i></i></div><button class="ab" id="bS">🌀<small></small></button><button class="ab" id="bJ">⤒<small></small></button></div>
<div id="bossBar" hidden><b>👑</b><span><i></i></span></div>
<div id="tip"><span></span></div>
<div id="big"></div>
<div id="flash"></div><div id="hurt"></div>
<div id="toast"></div>
<section class="scr" id="title" hidden>
  <button class="rb homeT" id="homeT" hidden></button>
  <h1 class="logo" style="margin-top:3vh"><span class="a">KIBO</span><span class="b">JUNGLE</span></h1>
  <p class="sub" id="tSub"></p>
  <div class="spc"></div>
  <div class="lvs" id="lvs"></div>
  <button class="big" id="goBtn"></button>
  <div class="chips"><button class="chip" id="qBtn"></button><button class="chip" id="sndChip"></button></div>
</section>
<div class="sheet" id="endS" hidden><div class="card"><h3 id="eT"></h3><div class="stars" id="eS"></div><div id="eG"></div><div class="st" id="eP"></div><div class="row"><button class="btn" id="eMenu"></button><button class="btn" id="eRe"></button><button class="btn pri" id="eNext"></button></div></div></div>
<div class="sheet" id="pauseS" hidden><div class="card"><h3 id="pT"></h3><p id="pP"></p><div class="row"><button class="btn" id="pMenu"></button><button class="btn" id="pRe"></button><button class="btn pri" id="pGo"></button></div></div></div>
<div class="sheet" id="overS" hidden><div class="card"><div style="font-size:54px">💫</div><h3 id="oT"></h3><p id="oP"></p><div class="row"><button class="btn" id="oMenu"></button><button class="btn pri" id="oRe"></button></div></div></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="kibo/game.js"></script>
</body>
</html>
