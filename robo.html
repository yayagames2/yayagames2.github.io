<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="lib/i18n.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kingdom Siege</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#1a1208;--accent:#ffd23a;--deep:#4a2a0a;--btn:linear-gradient(180deg,#ffd86a,#d8901a);--btnsh:#6a3a00;--panel:rgba(30,18,8,.75);--scr:transparent}
body{background:#1a1208;color:#fff;overflow:hidden}
.rb,.pill{color:#fff;background:rgba(30,18,8,.6);border:1px solid rgba(255,210,120,.3);backdrop-filter:blur(8px)}
#top{position:fixed;z-index:5;top:max(8px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;pointer-events:none}
#top .sb{display:flex;align-items:stretch;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5);font-weight:900;direction:ltr;pointer-events:auto}
.sb span{padding:5px 12px;font-size:19px;display:grid;place-items:center}
.sb .c0{background:linear-gradient(180deg,#2a8aff,#1a5ad8)}.sb .c1{background:linear-gradient(180deg,#ff4a5a,#c81a2a)}.sb .tm{background:#0a0e1c;min-width:70px;font-size:17px}
.sb .tm.x2{color:#ffd23a}
#quit{position:fixed;z-index:6;top:max(8px,env(safe-area-inset-top));inset-inline-start:10px;width:42px;height:42px}
.hand{position:fixed;z-index:6;left:0;right:0;bottom:0;padding:6px 8px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;pointer-events:none;background:linear-gradient(0deg,rgba(26,16,6,.94),rgba(26,16,6,.6) 70%,transparent)}
.hand.p1{bottom:auto;top:0;transform:rotate(180deg);padding-top:max(8px,env(safe-area-inset-top))}
.cards{display:flex;gap:6px;justify-content:center;align-items:flex-end;pointer-events:auto;direction:ltr}
.cd{position:relative;width:min(21vw,86px);aspect-ratio:3/4;border-radius:12px;background:radial-gradient(circle at 50% 35%,#f4e2b8,#c9a878 70%,#9a7a4a);border:3px solid #c9902a;touch-action:none;overflow:hidden;box-shadow:0 4px 0 #3a2208}
.cd img{position:absolute;inset:6% 4% 22%;width:92%;height:72%;object-fit:contain;pointer-events:none}
.cd .ic{position:absolute;inset:8% 0 26%;display:grid;place-items:center;font-size:min(9vw,38px);pointer-events:none}
.cd b{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:10.5px;font-weight:900;pointer-events:none;white-space:nowrap;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;background:linear-gradient(0deg,rgba(60,30,6,.85),transparent);padding-top:6px}
.cd i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#e0a01a);color:#4a2a00;font-style:normal;font-weight:900;font-size:13px;display:grid;place-items:center;box-shadow:0 0 0 2px #7a4a0a,0 2px 4px rgba(0,0,0,.5);pointer-events:none}
.cd .lv{position:absolute;top:3px;right:4px;font-size:9px;font-weight:900;color:#7a3a00;pointer-events:none}
.cd.poor{filter:grayscale(.85) brightness(.6)}
.cd.sel{border-color:#ffd23a;transform:translateY(-8px);box-shadow:0 0 14px #ffd23a}
.cd.nx{width:min(12vw,50px);opacity:.8}
.cd.nx b,.cd.nx i{display:none}
.en{height:16px;border-radius:9px;background:rgba(0,0,0,.6);border:1px solid rgba(255,200,90,.5);position:relative;overflow:hidden;max-width:420px;width:100%;margin:0 auto}
.en i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#ffb21a,#ffe25a);box-shadow:0 0 12px #ffb21a}
.en span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;direction:ltr;text-shadow:0 1px 2px #000}
.en .tk{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.25)}
#big{position:fixed;z-index:8;left:0;right:0;top:40%;text-align:center;pointer-events:none;font-weight:900;font-size:clamp(34px,11vw,72px);color:#fff;-webkit-text-stroke:2px #4a2a0a;text-shadow:0 6px 0 #4a2a0a,0 0 30px rgba(255,200,80,.7);opacity:0;transform:scale(.3);transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .2s;direction:ltr}
#big.on{opacity:1;transform:scale(1)}#big small{display:block;font-size:18px;-webkit-text-stroke:0;text-shadow:0 2px 6px #000}
#title{justify-content:flex-start;background:radial-gradient(circle at 50% 30%,rgba(120,80,20,.35),rgba(26,16,6,.94) 70%)}
#title .logo .a{color:#ffe27a;letter-spacing:5px;text-shadow:0 3px 0 #6a3a00,0 0 18px rgba(255,200,80,.6)}#title .logo .b{color:#fff;-webkit-text-stroke:3px #7a4a0a;text-shadow:0 6px 0 #4a2a0a,0 0 30px rgba(255,190,60,.5)}
.tbox{width:min(420px,100%);background:rgba(70,40,12,.55);border:1px solid rgba(255,210,120,.3);border-radius:20px;padding:12px;margin-top:12px}
.arena{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:900}.arena .ai{font-size:40px}.arena small{display:block;font-size:12px;opacity:.8;font-weight:700}
.tro{display:inline-block;padding:4px 14px;border-radius:999px;background:rgba(255,210,58,.15);color:#ffd23a;font-weight:900;margin-top:6px;direction:ltr}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:800;font-size:14px;color:#fff}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,#ffd86a,#d8901a);color:#3a1a00}
#goBtn{margin-top:14px;height:64px;font-size:23px;padding:0 44px;background:linear-gradient(180deg,#ffd23a,#ff8a1a);box-shadow:0 7px 0 #8a4a00,0 14px 26px rgba(0,0,0,.4);color:#3a1a00}
.deck{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px;direction:ltr}
.deck .cd{width:100%}
.deck .cd.lock{filter:grayscale(1) brightness(.45)}
.deck .cd .up{position:absolute;left:3px;right:3px;bottom:16px;font-size:10px;font-weight:900;background:#2ab84a;color:#fff;border-radius:6px;text-align:center;pointer-events:none}
.gears{display:inline-block;margin-inline-start:8px;padding:4px 12px;border-radius:999px;background:rgba(255,210,58,.15);color:#ffe27a;font-weight:900;direction:ltr}
#endS .card{background:#3a2410;color:#fff;border:1px solid rgba(255,210,120,.35)}#endS .card p{color:#ffe8bf}
.crowns{font-size:42px;letter-spacing:6px;margin:6px 0;direction:ltr}
#tip{position:fixed;z-index:7;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 158px);text-align:center;font-weight:800;font-size:14px;pointer-events:none;text-shadow:0 2px 6px #000}
#ghost{position:fixed;z-index:9;pointer-events:none;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px dashed #fff;display:grid;place-items:center;font-size:26px}
#ghost.bad{border-color:#ff4a5a;opacity:.6}
.deck .cd .pr{position:absolute;left:4px;right:4px;bottom:17px;height:11px;border-radius:6px;background:rgba(40,20,4,.7);overflow:hidden;pointer-events:none}
.deck .cd .pr em{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3ab8ff,#7ae0ff)}
.deck .cd .pr u{position:absolute;inset:0;text-decoration:none;font-size:8.5px;font-weight:900;color:#fff;display:grid;place-items:center;text-shadow:0 1px 1px #000}
.deck .cd.canup{animation:upg 1s infinite;border-color:#3aff7a}.deck .cd.canup .pr em{background:linear-gradient(90deg,#2ad86a,#9aff7a)}
@keyframes upg{50%{box-shadow:0 0 16px #3aff7a,0 4px 0 #3a2208}}
.cd.r1{border-color:#e0a01a}.cd.r2{border-color:#b04aff;box-shadow:0 4px 0 #3a1a5a,0 0 10px rgba(176,74,255,.5)}
#chestS{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 45%,rgba(120,70,10,.9),rgba(14,8,2,.97) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;text-align:center;padding:20px}
#chestS h2{margin:0;font-size:28px;font-weight:900;color:#ffe27a;text-shadow:0 3px 0 #6a3a00}
#chestS .hint{font-weight:800;opacity:.85;font-size:15px}
.rays{position:absolute;width:520px;height:520px;left:50%;top:45%;margin:-260px 0 0 -260px;background:repeating-conic-gradient(rgba(255,220,120,.16) 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite;pointer-events:none;border-radius:50%;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.chest{position:relative;width:170px;height:140px;cursor:pointer;filter:drop-shadow(0 12px 18px rgba(0,0,0,.6))}
.chest .base{position:absolute;bottom:0;left:0;right:0;height:78px;background:linear-gradient(#b06a2a,#6a3a14);border:5px solid var(--band,#3a1e08);border-radius:12px}
.chest .lid{position:absolute;top:6px;left:-4px;right:-4px;height:64px;background:linear-gradient(#d08a3e,#8a4a1a);border:5px solid var(--band,#3a1e08);border-radius:60px 60px 10px 10px;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.chest .base::before,.chest .lid::before{content:'';position:absolute;top:0;bottom:0;left:22%;width:12px;background:var(--gold,#ffcf3a)}.chest .base::after,.chest .lid::after{content:'';position:absolute;top:0;bottom:0;right:22%;width:12px;background:var(--gold,#ffcf3a)}
.chest .lock{position:absolute;left:50%;top:58px;width:30px;height:34px;margin-left:-15px;background:linear-gradient(#ffe27a,#d8901a);border:3px solid #6a3a00;border-radius:6px;z-index:2}
.chest.silver{--band:#4a5466;--gold:#dfe6f0}.chest.gold{--band:#7a4a00;--gold:#fff3a0}.chest.gold .base,.chest.gold .lid{background:linear-gradient(#ffd23a,#c88a10)}
.chest.shake{animation:shk .35s infinite}@keyframes shk{25%{transform:rotate(-6deg) scale(1.04)}75%{transform:rotate(6deg) scale(1.04)}}
.chest.open .lid{transform:translateY(-46px) rotate(-28deg)}.chest.open .lock{opacity:0}
.rw{width:150px;aspect-ratio:3/4;border-radius:16px;background:radial-gradient(circle at 50% 35%,#f4e2b8,#c9a878 70%,#9a7a4a);border:4px solid #c9902a;position:relative;animation:pop .45s cubic-bezier(.3,1.6,.5,1);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.rw.r1{border-color:#e0a01a}.rw.r2{border-color:#b04aff;box-shadow:0 0 30px #b04aff}
.rw img{position:absolute;inset:6% 6% 24%;width:88%;height:70%;object-fit:contain}.rw .ic{position:absolute;inset:10% 0 30%;display:grid;place-items:center;font-size:64px}
.rw b{position:absolute;left:0;right:0;bottom:8px;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 3px #000}
.rw .cnt{position:absolute;top:-16px;right:-16px;background:linear-gradient(#5aff8a,#1ab84a);color:#fff;font-weight:900;font-size:24px;border-radius:999px;padding:4px 12px;border:3px solid #0a5a2a;text-shadow:0 2px 0 #0a5a2a}
@keyframes pop{0%{transform:scale(.2) rotateY(90deg)}100%{transform:scale(1) rotateY(0)}}
.rwbar{width:170px;height:16px;border-radius:9px;background:rgba(0,0,0,.5);overflow:hidden;position:relative;margin-top:4px}.rwbar em{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3ab8ff,#7ae0ff);transition:width .8s}.rwbar u{position:absolute;inset:0;text-decoration:none;font-size:11px;font-weight:900;display:grid;place-items:center;text-shadow:0 1px 2px #000}
.rwbar.full em{background:linear-gradient(90deg,#2ad86a,#9aff7a)}
#eChest{height:62px;font-size:22px;padding:0 30px;background:linear-gradient(180deg,#ffd23a,#ff8a1a);box-shadow:0 6px 0 #8a4a00;color:#3a1a00;animation:upg 1s infinite;margin-bottom:10px}
</style>
</head>
<body>
<div id="stage"></div>
<button class="rb" id="quit" hidden></button>
<div id="top" hidden><div class="sb"><span class="c0" id="cr0">👑 0</span><span class="tm" id="tm">3:00</span><span class="c1" id="cr1">0 👑</span></div></div>
<div class="hand" id="h0" hidden><div class="cards" id="cards0"></div><div class="en" id="en0"><i></i><span></span></div></div>
<div class="hand p1" id="h1" hidden><div class="cards" id="cards1"></div><div class="en" id="en1"><i></i><span></span></div></div>
<div id="tip"></div>
<div id="ghost" hidden></div>
<div id="big"></div>
<div id="toast"></div>
<section class="scr" id="title" hidden>
  <button class="rb homeT" id="homeT" hidden></button>
  <h1 class="logo" style="margin-top:4vh"><span class="a">KINGDOM</span><span class="b">SIEGE</span></h1>
  <div class="tbox"><div class="arena"><span class="ai" id="arIc"></span><div><span id="arN"></span><small id="arS"></small></div></div><div><span class="tro" id="troT"></span><span class="gears" id="gearT"></span></div>
    <div class="seg" id="modeSeg"><button data-m="cpu"></button><button data-m="2p"></button></div>
    <div class="seg" id="diffSeg"><button data-d="easy"></button><button data-d="normal"></button><button data-d="hard"></button></div>
    <button class="btn pri" id="goBtn"></button></div>
  <div class="tbox"><b id="deckT"></b><div class="deck" id="deck"></div></div>
  <div class="chips"><button class="chip" id="qBtn"></button><button class="chip" id="sndChip"></button></div>
</section>
<div class="sheet" id="endS" hidden><div class="card"><h3 id="eT"></h3><div class="crowns" id="eC"></div><p id="eP"></p><button class="btn" id="eChest" hidden></button><div class="row"><button class="btn" id="eMenu"></button><button class="btn pri" id="eAgain"></button></div></div></div>
<div id="chestS" hidden><div class="rays"></div><h2 id="chT"></h2><div id="chBox"></div><div class="hint" id="chH"></div></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="robo/game.js"></script>
</body>
</html>
