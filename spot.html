<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="lib/i18n.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Spot It</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#ffe9c8;--accent:#ff7a1f;--deep:#2a6fd6;--btn:linear-gradient(180deg,#ffa53a,#ff6a1f);--btnsh:#b8460c;--scr:linear-gradient(180deg,rgba(255,233,200,.6),rgba(255,206,150,.94))}
body{background:#ffe9c8}
.sub{color:#5a3a1a}
.tabs{background:rgba(255,255,255,.55)}.tabs button{color:#5a3a1a}
#views{position:fixed;inset:0;pointer-events:none}
.mk{position:fixed;border:4px solid #ffcf1a;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 18px rgba(255,207,26,.9);pointer-events:none;animation:mk .4s ease-out;z-index:4}
.mk.hint{border-color:#3aa0ff;box-shadow:0 0 0 3px rgba(0,0,0,.2),0 0 18px rgba(58,160,255,.9);animation:hp 1s ease-in-out infinite}
.mk.miss{border-color:#ff3b4e;box-shadow:0 0 0 3px rgba(0,0,0,.2)}
@keyframes mk{from{transform:scale(2);opacity:0}}
@keyframes hp{50%{transform:scale(1.2)}}
.x{position:fixed;z-index:4;font-size:42px;font-weight:900;color:#ff3b4e;text-shadow:0 2px 0 #fff;pointer-events:none;animation:xf .7s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes xf{to{opacity:0;transform:translate(-50%,-80%) scale(1.3)}}
.bar{position:fixed;left:12px;right:12px;top:max(64px,calc(env(safe-area-inset-top) + 62px));height:10px;border-radius:5px;background:rgba(0,0,0,.15);z-index:5;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2fd36a,#ffd23a);border-radius:5px;transition:width .3s}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(0,0,0,.15);display:block}
.dots i.on{background:#2fd36a;box-shadow:0 0 6px #2fd36a}
.tag{position:fixed;z-index:4;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-weight:800;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="views"></div>
<div class="top" id="hud" hidden>
  <button class="rb" id="mapBtn"></button>
  <div class="pill"><b id="lvName"></b><small class="dots" id="dots"></small></div>
  <div class="sp"></div>
  <div class="pill"><b id="timeTxt">0:00</b></div>
  <button class="rb" id="hintBtn">🔍<span class="n" id="hintN">2</span></button>
  <button class="rb" id="sndBtn"></button>
</div>
<div class="bar" id="bar" hidden><i id="barI"></i></div>
<div id="toast"></div>
<section class="scr" id="title" hidden>
  <button class="rb homeT" id="homeT" hidden></button>
  <h1 class="logo"><span class="a">SPOT</span><span class="b">IT 3D</span></h1>
  <p class="sub" id="tSub"></p>
  <div class="tabs" id="tabs"></div>
  <div class="lgrid" id="lgrid" style="grid-template-columns:repeat(3,1fr)"></div>
  <div class="chips"><button class="chip" id="qBtn"></button></div>
</section>
<div class="sheet" id="winSheet" hidden><div class="card"><h3 id="wT"></h3><div class="stars" id="wStars"><i>⭐</i><i>⭐</i><i>⭐</i></div><p id="wP"></p><div class="row"><button class="btn" id="wMap"></button><button class="btn" id="wAgain"></button><button class="btn pri" id="wNext"></button></div></div></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="spot/game.js"></script>
</body>
</html>
