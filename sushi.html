<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sushi Swirl</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#ffe8d8;--accent:#ff6a3a;--deep:#7a2a1a;--btn:linear-gradient(180deg,#ff8a5a,#e8402a);--btnsh:#8a2a14;--panel:rgba(255,255,255,.95)}
body{background:radial-gradient(circle at 50% 0%,#ffd6c0,#f4a888 55%,#c86a5a);color:#5a2a1a}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 22px,rgba(0,0,0,.035) 22px 26px);pointer-events:none}
#cv{position:fixed;inset:0;display:block;touch-action:none;z-index:0}
.sheet{z-index:40!important}#toast{z-index:41}
#hud{position:fixed;z-index:3;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;gap:10px;align-items:flex-start}
.rb{color:#7a2a1a;background:rgba(255,255,255,.92);box-shadow:0 4px 0 rgba(120,40,20,.25)}
.mv{width:70px;height:70px;border-radius:22px;background:linear-gradient(180deg,#fff,#ffe8d8);box-shadow:0 5px 0 rgba(120,40,20,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.mv b{font-size:30px;line-height:1;color:#e8402a}.mv small{font-size:11px;font-weight:800}
.mid{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.goals{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.gl{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.9);border-radius:14px;padding:2px 8px 2px 4px;font-weight:900;font-size:16px;box-shadow:0 3px 0 rgba(120,40,20,.2)}
.gl img{width:30px;height:30px}.gl b{font-size:20px}.gl.ok{background:#c8ffb0}
.bar{position:relative;height:14px;border-radius:7px;background:rgba(80,20,10,.25);margin:4px 6px 0}
.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#ffd23a,#ff6a3a);transition:width .3s}
.bar span{position:absolute;top:-6px;transform:translateX(50%);font-size:18px;filter:grayscale(1) opacity(.5)}.bar span.on{filter:none}
.sc{font-weight:900;text-align:center;font-size:13px;direction:ltr}
#words{position:fixed;z-index:4;left:0;right:0;top:40%;text-align:center;pointer-events:none}
.word{font-size:46px;font-weight:900;-webkit-text-stroke:2px #7a2a1a;text-shadow:0 5px 0 #7a2a1a,0 0 30px rgba(255,255,255,.7);animation:wp 1.1s ease-out forwards}
@keyframes wp{0%{transform:scale(.2) rotate(-12deg);opacity:0}18%{transform:scale(1.25) rotate(4deg);opacity:1}32%{transform:scale(1) rotate(0)}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
#map{position:fixed;inset:0;z-index:5;overflow-y:auto;background:linear-gradient(180deg,#7ad0ff,#bfe8ff 30%,#ffe0ec 70%,#ffd0b8)}
#mapIn{position:relative;margin:0 auto}
.path{position:absolute;inset:0}.path path{fill:none;stroke:rgba(255,255,255,.85);stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 22}
.node{position:absolute;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffb8a0 60%,#e8604a);color:#5a1a0a;font-weight:900;font-size:22px;box-shadow:0 6px 0 #a83a2a,0 10px 20px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid #fff;z-index:2}
.node small{font-size:11px;color:#ffb000;letter-spacing:-1px;text-shadow:0 1px 0 #7a3a0a}.node.lock{background:#d8d0d8;box-shadow:0 6px 0 #9a909a;color:#7a707a}
.node.cur{animation:nb 1s ease-in-out infinite}@keyframes nb{50%{transform:translate(-50%,-50%) scale(1.12)}}
.dec{position:absolute;font-size:30px;font-style:normal;opacity:.55;pointer-events:none}
.mapHead{position:sticky;top:0;z-index:4;text-align:center;padding:max(10px,env(safe-area-inset-top)) 10px 6px;background:linear-gradient(180deg,rgba(122,208,255,.95),rgba(122,208,255,0))}
.mapHead .homeT{position:absolute;top:max(10px,env(safe-area-inset-top));inset-inline-start:12px}
.logo{margin:4px 0 0;font-size:clamp(34px,10vw,56px)}.logo .a{color:#ff5a3a;text-shadow:0 4px 0 #7a1a0a}.logo .b{color:#fff;-webkit-text-stroke:3px #7a1a0a;text-shadow:0 5px 0 #7a1a0a}
.card{background:#fff}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
  <button class="rb" id="pauseBtn"></button>
  <div class="mid"><div class="goals" id="goals"></div><div class="bar"><i id="barI"></i><span id="s1">⭐</span><span id="s2">⭐</span><span id="s3">⭐</span></div><div class="sc"><span id="lvTxt"></span> · <b id="scoreTxt">0</b></div></div>
  <div class="mv"><b id="movesTxt">0</b><small id="movesL"></small></div>
  <button class="rb" id="sndBtn"></button>
</div>
<div id="words"></div>
<div id="toast"></div>
<div id="map" hidden><div class="mapHead"><button class="rb homeT" id="homeT" hidden></button><h1 class="logo"><span class="a">SUSHI</span><span class="b">SWIRL</span></h1></div><div id="mapIn"></div></div>
<div class="sheet" id="endSheet" hidden><div class="card"><h3 id="eT"></h3><div class="stars" id="eStars"><i>⭐</i><i>⭐</i><i>⭐</i></div><p id="eP"></p><div class="row"><button class="btn" id="eMap"></button><button class="btn" id="eAgain"></button><button class="btn pri" id="eNext"></button></div></div></div>
<div class="sheet" id="pauseSheet" hidden><div class="card"><h3 id="pT"></h3><div class="row"><button class="btn" id="pMap"></button><button class="btn" id="pRe"></button><button class="btn pri" id="pGo"></button></div></div></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="sushi/game.js"></script>
</body>
</html>
