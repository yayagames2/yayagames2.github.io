<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="lib/i18n.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Swirl Shop</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#ffe3ec;--accent:#ff5fa2;--deep:#8a2a5a;--btn:linear-gradient(180deg,#ff8ac0,#f0508e);--btnsh:#a8285e;--panel:rgba(255,255,255,.95);--scr:linear-gradient(180deg,rgba(255,227,236,.55),rgba(255,227,236,0) 22%,rgba(255,227,236,0) 52%,rgba(255,214,230,.95) 64%)}
body{background:#ffe3ec;color:#6a2048;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.top .pill b{color:#a8285e}.top .pill small{color:#c8508a;font-weight:800}
#stepP{flex:1;align-items:center;text-align:center}
#panel{position:fixed;z-index:6;left:0;right:0;bottom:0;padding:10px 10px max(10px,env(safe-area-inset-bottom));background:rgba(255,255,255,.93);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(150,40,90,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#opts{max-width:600px;margin:0 auto}
.lbl{font-weight:900;font-size:14px;margin:0 4px 4px;color:#a8285e;display:flex;align-items:center;gap:6px}
.lbl i{font-style:normal;display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.row2{display:flex;gap:7px;overflow-x:auto;padding:3px 3px 9px;scrollbar-width:none}.row2::-webkit-scrollbar{display:none}
.ch{flex:none;width:64px;min-height:72px;border-radius:18px;background:#fff3f8;box-shadow:0 3px 0 #f6c6da;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;color:#8a2a5a}
.ch img{width:40px;height:40px;display:block;pointer-events:none}
.ch small{font-size:10.5px;font-weight:800;line-height:1.05;text-align:center;pointer-events:none}
.ch.on{background:linear-gradient(180deg,#ffb0d4,#ff6aa8);color:#fff;box-shadow:0 3px 0 #b8306a;transform:translateY(-2px)}
.ch.want::before{content:"⭐";position:absolute;top:-6px;inset-inline-start:-4px;font-size:15px}
.ch.lk{opacity:.72}.ch.lk::after{content:attr(data-price);position:absolute;top:-5px;inset-inline-end:-4px;font-size:11px;font-weight:900;background:#ffd23a;color:#7a3a00;border-radius:9px;padding:1px 5px;direction:ltr}
.ch.undo{background:#eef2fb;color:#3a4a7a;box-shadow:0 3px 0 #c8d0e8;font-size:24px}
.nav1{display:flex;gap:8px;justify-content:center;margin-top:4px}
.btn.big{height:54px;font-size:18px;padding:0 22px;flex:1;max-width:420px}
.btn.ready{animation:rdy 1s ease-in-out infinite}@keyframes rdy{50%{transform:scale(1.05)}}
.hintP{text-align:center;font-weight:800;padding:6px 4px 8px;color:#a8285e;font-size:15px}
.meter{position:relative;height:28px;border-radius:14px;background:#fde0ec;overflow:hidden;margin:6px 4px}
.meter i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#9ad8ff,#c8f0ff,#ffffff);transition:width .1s}
[dir=rtl] .meter i{inset:0 0 0 auto}
.meter span{position:relative;display:block;text-align:center;line-height:28px;font-weight:900;font-size:14px;color:#3a5a8a}
#order{position:fixed;z-index:5;top:max(64px,calc(env(safe-area-inset-top) + 60px));inset-inline-start:8px;background:rgba(255,253,246,.94);border-radius:16px;padding:5px 7px 6px;box-shadow:0 8px 20px rgba(150,40,90,.25);border:3px dashed #f6a8c8;text-align:center;font-weight:900;color:#a8285e;transform:rotate(-2deg);min-width:80px;max-width:36vw;transition:transform .3s}
#order.pop{animation:opop .5s ease-out}@keyframes opop{0%{transform:scale(.3) rotate(-10deg)}70%{transform:scale(1.1) rotate(0)}}
#order .who{font-size:11px;margin-bottom:2px}
#order .it{display:flex;align-items:center;gap:4px;justify-content:center;font-size:11px;margin:2px 0;border-radius:10px;padding:1px 3px;line-height:1.1}
#order .it img{width:22px;height:22px;flex:none}
#order .it.ok{background:#c8f5d4}
#order .no{color:#e0304a}
#order .sz{letter-spacing:2px}
#gauge{position:fixed;z-index:5;inset-inline-end:12px;top:22%;height:36vh;width:34px;border-radius:17px;background:rgba(255,255,255,.8);box-shadow:0 6px 16px rgba(150,40,90,.25);overflow:visible}
#gauge i{position:absolute;left:4px;right:4px;bottom:4px;border-radius:13px;background:linear-gradient(0deg,#ffb0d4,#ff5fa2);height:0}
#gauge .mk{position:absolute;inset-inline-end:38px;transform:translateY(50%);font-weight:900;font-size:13px;color:#a8285e;background:#fff;border-radius:8px;padding:1px 6px;box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap}
#gauge .mk.tg{background:#ffd23a;color:#7a3a00;font-size:14px}
#gauge .band{position:absolute;left:0;right:0;background:rgba(80,220,120,.35);border-top:2px dashed #2fb36a;border-bottom:2px dashed #2fb36a}
#hold{position:fixed;z-index:5;left:0;right:0;top:44%;text-align:center;pointer-events:none;font-weight:900;font-size:22px;color:#fff;text-shadow:0 3px 0 #a8285e,0 6px 14px rgba(120,20,70,.5);animation:rdy 1.1s ease-in-out infinite}
#bub{position:fixed;z-index:6;transform:translate(-50%,-100%);background:#fff;border-radius:20px;padding:8px 14px;font-weight:900;font-size:17px;color:#6a2048;box-shadow:0 8px 20px rgba(0,0,0,.22);max-width:72vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#bub.on{opacity:1;animation:bubIn .35s cubic-bezier(.2,1.6,.4,1)}@keyframes bubIn{0%{transform:translate(-50%,-100%) scale(.3)}}
#bub::after{content:"";position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);border:10px solid transparent;border-top-color:#fff;border-bottom:0}
#bub .oc{display:flex;gap:4px 8px;justify-content:center;align-items:center;margin-top:4px;flex-wrap:wrap;font-size:13px}#bub .oc .it{display:inline-flex;align-items:center;gap:3px}#bub .oc img{width:30px;height:30px}
#tense{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:max(26px,calc(env(safe-area-inset-bottom) + 20px));width:min(360px,86vw);height:34px;border-radius:17px;background:linear-gradient(90deg,#ff5a5a,#ffb84a 40%,#ffe84a 60%,#5ad87a);box-shadow:0 6px 18px rgba(0,0,0,.25),inset 0 0 0 3px #fff}
#tense b{position:absolute;top:50%;font-size:38px;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));direction:ltr}
#tense span{position:absolute;top:-30px;left:0;right:0;text-align:center;font-weight:900;color:#fff;font-size:18px;text-shadow:0 2px 0 #a8285e,0 4px 10px rgba(0,0,0,.4)}
#flash{position:fixed;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.big3{position:fixed;z-index:7;left:0;right:0;top:18%;text-align:center;pointer-events:none;font-size:90px;opacity:0;transform:scale(.3);transition:transform .4s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.big3.on{opacity:1;transform:scale(1)}
.sheet .card{max-width:380px}
.res .rbig{font-size:56px;line-height:1.1}.res .st{font-size:34px;letter-spacing:4px;color:#ffb81f;text-shadow:0 2px 0 #b8701a}.res p{margin:6px 0;font-weight:800;color:#6a2048}
.res .cn{display:inline-block;background:#fff4c8;border-radius:999px;padding:4px 14px;font-weight:900;color:#a8601a;direction:ltr}
.res img{width:120px;height:144px;border-radius:18px;object-fit:cover;box-shadow:0 6px 16px rgba(0,0,0,.18);margin:4px auto 2px;display:block;background:#fff}
#title .sub{color:#8a2a5a;font-weight:800;max-width:420px}
#title .logo .a{color:#ff5fa2;letter-spacing:3px}
#title .logo .b{color:#fff;-webkit-text-stroke:3px #c8306e;text-shadow:0 6px 0 #c8306e,0 14px 24px rgba(150,30,80,.35)}
.tbtns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:auto;width:min(360px,100%)}
.tbtns .btn{width:100%;height:58px;font-size:19px}
#freeBtn{animation:rdy 1.4s ease-in-out infinite}
#custBtn{background:#fff;color:#a8285e;box-shadow:0 5px 0 #f6c6da}
.stat{display:flex;gap:8px;justify-content:center;margin:6px 0 10px;flex-wrap:wrap}.stat span{background:#fff;border-radius:999px;padding:5px 12px;font-weight:900;color:#a8285e;box-shadow:0 3px 0 #f6c6da;direction:ltr}
#galT{margin:16px 0 6px;color:#a8285e;font-size:16px}
#gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;width:min(560px,100%);padding:10px;border-radius:20px;background:rgba(255,255,255,.55)}
#gal img{width:100%;aspect-ratio:5/6;object-fit:cover;border-radius:14px;background:#fff;box-shadow:0 3px 0 rgba(150,40,90,.15)}
#gal .empty{grid-column:1/-1;font-weight:800;opacity:.8;font-size:14px}
.coinpop{position:fixed;z-index:9;font-weight:900;font-size:24px;color:#ffb81f;text-shadow:0 2px 0 #7a4a0a;pointer-events:none;animation:up 1.2s ease-out forwards;transform:translateX(-50%)}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}

.tanks{display:flex;gap:8px;direction:ltr}
.tank{flex:1;min-width:0;background:#fff6fa;border-radius:16px;padding:5px 4px 2px;box-shadow:inset 0 0 0 2px #fde0ec}
.tank .lbl{margin:0 4px 2px;font-size:18px}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:150px;overflow-y:auto;padding:7px 3px 4px;scrollbar-width:none}.tg::-webkit-scrollbar{display:none}
.tg .ch{width:auto;min-height:66px}.tg .ch img{width:36px;height:36px}.tg .ch small{font-size:9.5px}
.btn.blink{animation:blink .9s ease-in-out infinite}
@keyframes blink{50%{transform:scale(1.07);filter:brightness(1.25);box-shadow:0 0 0 7px rgba(255,95,162,.4),0 0 30px rgba(255,95,162,.8),0 5px 0 var(--btnsh)}}
#guide{position:fixed;z-index:12;font-size:52px;line-height:1;pointer-events:none;margin-left:-22px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
#guide.tap{animation:gTap .9s ease-in-out infinite}
#guide.drag{animation:gDrag 1.5s ease-in-out infinite}
#guide.swipe{animation:gSwipe 1.6s ease-in-out infinite}
@keyframes gTap{0%,100%{transform:translateY(6px)}50%{transform:translateY(22px) scale(.92)}}
@keyframes gDrag{0%{transform:translateY(-10px);opacity:0}15%{opacity:1;transform:translateY(-10px) scale(.9)}75%{transform:translateY(120px) scale(.9);opacity:1}100%{transform:translateY(120px);opacity:0}}
@keyframes gSwipe{0%,100%{transform:translateX(-50px)}50%{transform:translateX(50px)}}
#gauge .danger{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,rgba(255,60,60,.35) 0 6px,rgba(255,255,255,.2) 6px 12px);border-radius:17px 17px 0 0}
#gauge .mk.dz{background:#ff4a4a;color:#fff}
</style>
</head>
<body>
<div id="stage"></div>
<div class="top" id="hud" hidden>
  <button class="rb" id="backBtn" style="pointer-events:auto"></button>
  <div class="pill" id="stepP"><b id="stepT"></b><small id="stepS"></small></div>
  <div class="pill"><b id="coinTxt">🪙 0</b></div>
  <button class="rb" id="sndBtn" style="pointer-events:auto"></button>
</div>
<div id="order" hidden></div>
<div id="gauge" hidden><i id="gaugeI"></i></div>
<div id="hold" hidden></div>
<div id="bub"></div>
<div id="tense" hidden><span id="tenseT"></span><b id="tenseB">😐</b></div>
<div id="big3" class="big3"></div>
<div id="panel" hidden><div id="opts"></div></div>
<div id="flash"></div><div id="guide" hidden>👆</div>
<section class="scr" id="title" hidden>
  <button class="rb homeT" id="homeT" hidden></button>
  <h1 class="logo"><span class="a">SWIRL</span><span class="b">SHOP</span></h1>
  <p class="sub" id="tSub"></p>
  <div class="tbtns"><div class="stat" id="stat"></div><button class="btn pri" id="freeBtn"></button><button class="btn" id="custBtn"></button></div>
  <h3 id="galT"></h3><div id="gal"></div>
  <div class="chips" style="margin-top:12px"><button class="chip" id="qBtn"></button></div>
</section>
<div class="sheet" id="resSheet" hidden><div class="card res" id="resCard"></div></div>
<div id="toast"></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="swirl/game.js"></script>
</body>
</html>
