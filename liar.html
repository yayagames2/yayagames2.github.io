<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Who Lied?</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#1b1730;--accent:#ffcf3a;--deep:#3a2a8a;--btn:linear-gradient(180deg,#ffd24a,#ff9a1a);--btnsh:#b8600c;--scr:radial-gradient(circle at 50% 25%,rgba(80,60,160,.35),rgba(16,12,36,.94))}
body{color:#fff}
.case{position:fixed;top:max(64px,calc(env(safe-area-inset-top) + 62px));left:10px;right:10px;z-index:5;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.case .t{background:#fff7e0;color:#3a2a10;border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;box-shadow:0 6px 16px rgba(0,0,0,.3);border:2px dashed #c8a05a;max-width:520px;text-align:center}
.case .ev{background:#ffe3e3;color:#7a1020;border-radius:12px;padding:6px 12px;font-weight:800;font-size:13.5px;border:2px solid #ff8a8a;max-width:520px;text-align:center}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;align-items:center;background:linear-gradient(180deg,rgba(27,23,48,0),rgba(27,23,48,.9) 18%)}
.st{display:grid;gap:6px;width:min(560px,100%)}
.sc{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.95);color:#1c2240;border-radius:16px;padding:7px 10px;text-align:start;border:3px solid transparent;font-size:14.5px;line-height:1.3;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.sc i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;color:#fff;font-size:14px}
.sc b{font-weight:900}
.sc[aria-pressed=true]{border-color:#ffb31a;background:#fff7d6}
.sc.bad{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q{font-weight:900;font-size:17px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.acc{height:48px;padding:0 26px;border-radius:999px;background:linear-gradient(180deg,#ff5a6a,#d61f3a);color:#fff;font-weight:900;font-size:17px;box-shadow:0 5px 0 #8a0f20}
.acc[disabled]{opacity:.45}
.hearts{font-size:18px;letter-spacing:2px}
.lbl{position:fixed;z-index:4;transform:translate(-50%,0);padding:3px 10px;border-radius:8px;background:#1c2240;color:#fff;font-weight:900;font-size:13px;pointer-events:none;white-space:nowrap;border:2px solid #ffcf3a}
.lbl.sel{background:#ffcf3a;color:#1c2240}
.exp{background:#f3f0ff;border-radius:14px;padding:10px;color:#3a3060;font-weight:700;font-size:14px;margin:8px 0 12px;text-align:start;line-height:1.45}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div class="top" id="hud" hidden>
  <button class="rb" id="mapBtn"></button>
  <div class="pill"><b id="lvName"></b><small class="hearts" id="hearts"></small></div>
  <div class="sp"></div>
  <button class="rb" id="sndBtn"></button>
</div>
<div class="case" id="case" hidden><div class="t" id="caseT"></div><div class="ev" id="caseE" hidden></div></div>
<div class="panel" id="panel" hidden><div class="q" id="qTxt"></div><div class="st" id="stList"></div><button class="acc" id="accBtn" disabled></button></div>
<div id="toast"></div>
<section class="scr" id="title" hidden>
  <button class="rb homeT" id="homeT" hidden></button>
  <h1 class="logo" style="margin-top:3vh"><span class="a">WHO</span><span class="b">LIED?</span></h1>
  <p class="sub" id="tSub"></p>
  <div class="tabs" id="tabs"></div>
  <div class="tdesc sub" id="tdesc" style="font-size:13.5px;margin-top:8px"></div>
  <div class="lgrid" id="lgrid"></div>
  <div class="chips"><button class="chip" id="qBtn"></button></div>
</section>
<div class="sheet" id="winSheet" hidden><div class="card"><h3 id="wT"></h3><div class="stars" id="wStars"><i>⭐</i><i>⭐</i><i>⭐</i></div><div class="exp" id="wP"></div><div class="row"><button class="btn" id="wMap"></button><button class="btn" id="wAgain"></button><button class="btn pri" id="wNext"></button></div></div></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="liar/game.js"></script>
</body>
</html>
