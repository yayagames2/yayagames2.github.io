<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="lib/i18n.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Spin Masters</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#070b1a;--accent:#ff5a2a;--deep:#0a2a6a;--btn:linear-gradient(180deg,#ff8a4a,#e8401a);--btnsh:#7a1a04;--panel:rgba(10,16,40,.62);--scr:transparent}
body{background:#070b1a;color:#fff;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
.rb,.pill{color:#fff;background:rgba(10,16,40,.58);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px)}
#sb{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:0;direction:ltr;pointer-events:none;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18)}
#sb .nm{background:rgba(8,14,34,.82);padding:5px 10px;font-weight:900;font-size:13px;display:flex;align-items:center;gap:6px;min-width:74px;justify-content:center;white-space:nowrap}
#sb .sc{background:linear-gradient(180deg,#ff6a2a,#d8340a);min-width:40px;font-size:24px;font-weight:900;display:grid;place-items:center;font-variant-numeric:tabular-nums}
#sb .sc.b{background:linear-gradient(180deg,#2a8aff,#0a4ad8)}
#sb i{width:9px;height:9px;border-radius:50%;background:#ffe24a;box-shadow:0 0 8px #ffe24a;display:inline-block;visibility:hidden}#sb i.on{visibility:visible}
#sb .gm{background:rgba(8,14,34,.82);font-size:11px;font-weight:800;padding:0 6px;display:grid;place-items:center;opacity:.85}
#sub{position:fixed;z-index:5;top:calc(max(10px,env(safe-area-inset-top)) + 52px);left:0;right:0;text-align:center;font-weight:800;font-size:13px;pointer-events:none;text-shadow:0 2px 6px #000;opacity:.9}
#big{position:fixed;z-index:7;left:0;right:0;top:30%;text-align:center;pointer-events:none;font-weight:900;direction:ltr}
#big div{font-size:clamp(40px,12vw,84px);font-style:italic;color:#fff;-webkit-text-stroke:3px #c8340a;text-shadow:0 6px 0 #6a1a04,0 0 40px rgba(255,120,40,.85);animation:bp 1.6s ease-out forwards}
#big div.b{-webkit-text-stroke-color:#0a4ad8;text-shadow:0 6px 0 #0a2a6a,0 0 40px rgba(60,150,255,.85)}
#big small{display:block;font-size:20px;-webkit-text-stroke:0;color:#ffe24a;text-shadow:0 2px 6px #000;font-style:normal}
@keyframes bp{0%{transform:scale(.2) rotate(-8deg);opacity:0}15%{transform:scale(1.12) rotate(2deg);opacity:1}28%{transform:scale(1) rotate(0)}80%{opacity:1}100%{transform:scale(1.04);opacity:0}}
#hint{position:fixed;z-index:6;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));text-align:center;pointer-events:none;font-weight:900;font-size:17px;text-shadow:0 2px 8px #000}
#hint b{display:inline-block;padding:7px 16px;border-radius:999px;background:rgba(8,14,34,.65);border:1px solid rgba(255,255,255,.2)}
#rally{position:fixed;z-index:5;right:max(14px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 58px);font-weight:900;font-size:14px;background:rgba(8,14,34,.6);border-radius:999px;padding:5px 12px;pointer-events:none;direction:ltr}
#title{justify-content:flex-end;background:linear-gradient(180deg,rgba(6,10,26,0) 28%,rgba(6,10,26,.86) 52%,rgba(6,10,26,.96))}
#title .homeT{z-index:3}
#title .logo{pointer-events:none;position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;margin:0}
.logo .a{color:#ffb84a;letter-spacing:6px;text-shadow:0 3px 0 #6a2a04,0 0 18px rgba(255,160,60,.7)}.logo .b{color:#fff;-webkit-text-stroke:3px #c8340a;text-shadow:0 6px 0 #6a1a04,0 0 34px rgba(255,100,40,.7);font-style:italic}
.tpan{width:min(520px,100%);display:flex;flex-direction:column;gap:9px;align-items:stretch}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:58px;border-radius:16px;background:rgba(255,255,255,.1);color:#fff;font-weight:900;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px solid transparent;padding:4px}
.seg button span{font-size:22px;line-height:1}
.seg button.on{background:linear-gradient(180deg,#ff8a4a,#e8401a);border-color:#ffd8c0;box-shadow:0 4px 0 #7a1a04}
.opt{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.opt button{min-height:40px;padding:3px 12px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:900;font-size:13.5px;color:#fff;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.opt button small{font-size:11px;opacity:.85;color:#ffe24a}
.opt button.on{border-color:#ffb84a;background:rgba(255,160,60,.2)}
.opt button.lk{opacity:.45}
.info{font-weight:800;font-size:13.5px;opacity:.92;min-height:18px}
.stat{display:flex;gap:10px;justify-content:center;font-weight:900;font-size:15px}
.stat span{background:rgba(8,14,34,.6);border-radius:999px;padding:5px 14px}
.go2{height:62px;border-radius:999px;background:linear-gradient(180deg,#7aff5a,#22b81a);color:#fff;font-weight:900;font-size:23px;box-shadow:0 7px 0 #0f6a0a,0 14px 26px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.trow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip svg{width:22px;height:22px;display:block}
.card{background:#fff;color:#0a1a3a}
.res{list-style:none;padding:0;margin:8px 0;text-align:start}.res li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:12px;font-weight:800;background:#f0f4fc;margin-bottom:5px}.res li.w{background:#fff4c8}
.bracket{display:flex;gap:6px;justify-content:center;direction:ltr;margin:4px 0}
.bracket div{flex:1;border-radius:12px;background:rgba(255,255,255,.08);padding:5px 4px;font-size:11.5px;font-weight:800;line-height:1.25}
.bracket div.cur{background:rgba(255,160,60,.25);box-shadow:0 0 0 2px #ffb84a}.bracket div.dn{opacity:.55}
@media (orientation:landscape) and (max-height:620px){#title{flex-direction:row;justify-content:flex-end;align-items:center;background:linear-gradient(90deg,rgba(6,10,26,0) 30%,rgba(6,10,26,.84) 52%,rgba(6,10,26,.96))}#title .logo{right:auto;left:max(16px,env(safe-area-inset-left));top:auto;bottom:18px;text-align:start;width:auto}.tpan{width:min(440px,56vw);gap:6px;max-height:100%;overflow-y:auto;padding:4px}.seg button{min-height:48px}.go2{height:52px}#title .logo .b{font-size:52px}#title .logo .a{font-size:24px}}
@media (orientation:landscape) and (max-height:620px){html[dir=rtl] #title{background:linear-gradient(270deg,rgba(6,10,26,0) 30%,rgba(6,10,26,.84) 52%,rgba(6,10,26,.96))}html[dir=rtl] #title .logo{left:auto;right:max(16px,env(safe-area-inset-right))}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="top" id="hud" hidden>
  <button class="rb" id="pauseBtn"></button>
  <div class="sp"></div>
  <div class="pill"><b id="coinTxt" style="direction:ltr">0</b><small>🪙</small></div>
</div>
<div id="sb" hidden><div class="nm"><i id="sv0"></i><span id="nm0"></span></div><div class="sc" id="sc0">0</div><div class="sc b" id="sc1">0</div><div class="nm"><span id="nm1"></span><i id="sv1"></i></div><div class="gm" id="gm"></div></div>
<div id="sub" hidden></div>
<div id="rally" hidden></div>
<div id="big"></div>
<div id="hint" hidden><b id="hintT"></b></div>
<div id="toast"></div>
<section class="scr" id="title" hidden>
  <button class="rb homeT" id="homeT" hidden></button>
  <h1 class="logo"><span class="a">SPIN</span><span class="b">MASTERS</span></h1>
  <div class="tpan">
    <div class="stat"><span>🏆 <b id="tTro">0</b></span><span>🪙 <b id="tCoins">0</b></span></div>
    <div class="seg" id="modeSeg"></div>
    <div class="info" id="modeInfo"></div>
    <div class="opt" id="optRow"></div>
    <button class="go2" id="goBtn"></button>
    <div class="trow"><button class="chip" id="helpBtn"></button><button class="chip" id="qBtn"></button><button class="chip" id="sndBtn"></button></div>
  </div>
</section>
<div class="sheet" id="endSheet" hidden><div class="card"><div id="eE" style="font-size:54px;line-height:1"></div><h3 id="eT"></h3><ul class="res" id="eRes"></ul><p id="eP" style="font-weight:700;margin:4px 0"></p><div class="row"><button class="btn" id="eMenu"></button><button class="btn pri" id="eGo"></button></div></div></div>
<div class="sheet" id="pauseSheet" hidden><div class="card"><h3 id="pT"></h3><div class="row"><button class="btn" id="pMenu"></button><button class="btn pri" id="pGo"></button></div></div></div>
<div class="sheet" id="helpSheet" hidden><div class="card" style="text-align:start"><h3 id="hT" style="text-align:center"></h3><div id="hB" style="font-weight:700;line-height:1.55;margin:10px 0 14px"></div><div class="row"><button class="btn pri" id="hX"></button></div></div></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="pong/game.js"></script>
</body>
</html>
