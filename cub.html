<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="lib/i18n.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Cozy Cub Kitchen</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#f3e3cf;--accent:#e8873a;--deep:#7a4220;--btn:linear-gradient(180deg,#ffa95a,#e8732a);--btnsh:#a84a14;--panel:rgba(255,251,244,.95);--scr:linear-gradient(180deg,rgba(255,244,228,.7),rgba(255,244,228,0) 26%,rgba(255,244,228,0) 50%,rgba(250,232,208,.96) 62%)}
body{background:#f3e3cf;color:#5a3418;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.top .pill b{color:#8a4a1c}.top .pill small{color:#b86a2a;font-weight:800}
#stepP{flex:1;align-items:center;text-align:center}
#dots{display:flex;gap:4px;justify-content:center;margin-top:3px}
#dots i{width:7px;height:7px;border-radius:50%;background:#ecd6bc}#dots i.on{background:#e8873a}#dots i.cur{background:#e8873a;box-shadow:0 0 0 3px rgba(232,135,58,.3)}
#panel{position:fixed;z-index:6;left:0;right:0;bottom:0;padding:12px 12px max(12px,env(safe-area-inset-bottom));background:rgba(255,251,244,.94);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(120,60,20,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#pin{max-width:560px;margin:0 auto}
.inst{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:900;font-size:18px;color:#7a4220;min-height:44px;text-align:center}
.inst .ic{font-size:34px;line-height:1;flex:none}
.meter{position:relative;height:30px;border-radius:15px;background:linear-gradient(90deg,#fbe8cf,#f6d8b0);overflow:hidden;margin:10px 2px 2px;box-shadow:inset 0 2px 4px rgba(120,60,20,.15)}
.meter .band{position:absolute;top:0;bottom:0;background:rgba(80,200,110,.35);border-inline:3px solid #3cae62}
.meter .fill{position:absolute;top:0;bottom:0;inset-inline-start:0;background:linear-gradient(90deg,#ffe2a8,#f0a850);transition:width .08s}
.meter .burn{position:absolute;top:0;bottom:0;inset-inline-end:0;width:14%;background:repeating-linear-gradient(45deg,rgba(90,40,20,.35) 0 6px,rgba(255,255,255,.15) 6px 12px)}
.meter b{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:24px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));transition:left .08s}
[dir=rtl] .meter b{transform:translate(50%,-50%)}
.meter span{position:relative;display:block;text-align:center;line-height:30px;font-weight:900;font-size:13px;color:#7a4220}
.pbtns{display:flex;gap:8px;justify-content:center;margin-top:10px}
.pbtns .btn{height:54px;font-size:19px;padding:0 26px;min-width:150px}
.btn.blink{animation:blink .9s ease-in-out infinite}
@keyframes blink{50%{transform:scale(1.07);filter:brightness(1.15);box-shadow:0 0 0 7px rgba(232,135,58,.35),0 0 30px rgba(232,135,58,.7),0 5px 0 var(--btnsh)}}
.chips2{display:flex;gap:7px;overflow-x:auto;padding:6px 3px 6px;justify-content:center;flex-wrap:wrap}
.ing{flex:none;width:66px;height:66px;border-radius:18px;background:#fff3e4;box-shadow:0 3px 0 #ecd0ac;font-size:34px;display:grid;place-items:center;position:relative}
.ing.nx{animation:blink .9s ease-in-out infinite;background:#ffe2bc}
.ing.dn{opacity:.35;filter:grayscale(.8)}
.ing.no{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px) rotate(-6deg)}75%{transform:translateX(6px) rotate(6deg)}}
#guide{position:fixed;z-index:12;font-size:52px;line-height:1;pointer-events:none;margin-left:-22px;margin-top:-8px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
#guide.tap{animation:gTap .9s ease-in-out infinite}
#guide.hold{animation:gHold 1.6s ease-in-out infinite}
#guide.swipe{animation:gDown 1.1s ease-in-out infinite}
#guide.circle{animation:gCirc 1.4s linear infinite}
#guide.drag{animation:gZig 1.8s ease-in-out infinite}
#guide.line{animation:gLine 1.4s ease-in-out infinite}
@keyframes gTap{0%,100%{transform:translateY(6px)}50%{transform:translateY(22px) scale(.92)}}
@keyframes gHold{0%{transform:translateY(0)}20%,80%{transform:translateY(18px) scale(.9)}100%{transform:translateY(0)}}
@keyframes gDown{0%{transform:translateY(-40px);opacity:0}20%{opacity:1}80%{transform:translateY(50px);opacity:1}100%{transform:translateY(50px);opacity:0}}
@keyframes gCirc{0%{transform:rotate(0deg) translateX(46px) rotate(0deg)}100%{transform:rotate(360deg) translateX(46px) rotate(-360deg)}}
@keyframes gZig{0%{transform:translate(-60px,-30px)}25%{transform:translate(60px,-10px)}50%{transform:translate(-60px,10px)}75%{transform:translate(60px,30px)}100%{transform:translate(-60px,-30px)}}
@keyframes gLine{0%{transform:translate(-80px,-40px);opacity:0}15%{opacity:1}85%{transform:translate(80px,40px);opacity:1}100%{transform:translate(80px,40px);opacity:0}}
#bub{position:fixed;z-index:6;transform:translate(-50%,-100%);background:#fff;border-radius:20px;padding:8px 14px;font-weight:900;font-size:17px;color:#6a3418;box-shadow:0 8px 20px rgba(0,0,0,.2);max-width:72vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#bub.on{opacity:1;animation:bubIn .35s cubic-bezier(.2,1.6,.4,1)}@keyframes bubIn{0%{transform:translate(-50%,-100%) scale(.3)}}
#bub::after{content:"";position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);border:10px solid transparent;border-top-color:#fff;border-bottom:0}
#flash{position:fixed;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.big3{position:fixed;z-index:7;left:0;right:0;top:20%;text-align:center;pointer-events:none;font-size:80px;opacity:0;transform:scale(.3);transition:transform .4s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.big3.on{opacity:1;transform:scale(1)}
.res .st{font-size:40px;letter-spacing:6px}.res .st i{font-style:normal;display:inline-block;filter:grayscale(1) opacity(.3)}.res .st i.on{filter:none;animation:st .5s ease-out both}
.res p{margin:6px 0;font-weight:800;color:#6a3418}
.res .cn{display:inline-block;background:#fff4c8;border-radius:999px;padding:4px 14px;font-weight:900;color:#a8601a;direction:ltr}
.res .rbig{font-size:54px;line-height:1.1}
#title .sub{color:#7a4220;font-weight:800;max-width:420px}
#title .logo .a{color:#e8873a;letter-spacing:3px}
#title .logo .b{color:#fff;-webkit-text-stroke:3px #a8541c;text-shadow:0 6px 0 #a8541c,0 14px 24px rgba(120,50,10,.35)}
.tbtns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:auto;width:min(360px,100%)}
.tbtns .btn{width:100%;height:58px;font-size:20px}
#cookBtn{animation:rdy 1.4s ease-in-out infinite}@keyframes rdy{50%{transform:scale(1.04)}}
#hatBtn{background:#fff;color:#8a4a1c;box-shadow:0 5px 0 #ecd0ac}
.stat{display:flex;gap:8px;justify-content:center;margin:6px 0 4px;flex-wrap:wrap}.stat span{background:#fff;border-radius:999px;padding:5px 12px;font-weight:900;color:#8a4a1c;box-shadow:0 3px 0 #ecd0ac;direction:ltr}
.book{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.rc{border-radius:20px;background:#fff6ea;box-shadow:0 4px 0 #ecd0ac;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.rc .e{font-size:46px;line-height:1.1}.rc b{font-size:15px;color:#6a3418}.rc small{font-size:16px;letter-spacing:2px}
.rc.lk{opacity:.55}.rc.lk::after{content:"🔒";position:absolute;top:6px;inset-inline-end:8px;font-size:18px}
.rc.nw::before{content:attr(data-new);position:absolute;top:-6px;inset-inline-start:-4px;background:#e8442a;color:#fff;font-size:11px;font-weight:900;border-radius:9px;padding:2px 7px}
.hats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.hat{border-radius:18px;background:#fff6ea;box-shadow:0 3px 0 #ecd0ac;padding:8px 4px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:12.5px;color:#6a3418;gap:2px}
.hat .e{font-size:34px}.hat.on{background:#ffe0b8;box-shadow:0 0 0 3px #e8873a}.hat .p{direction:ltr;color:#a8601a;font-weight:900}
.coinpop{position:fixed;z-index:9;font-weight:900;font-size:24px;color:#ffb81f;text-shadow:0 2px 0 #7a4a0a;pointer-events:none;animation:up 1.2s ease-out forwards;transform:translateX(-50%)}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
#hunger{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 58px);width:min(230px,60vw);height:22px;border-radius:999px;background:rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.15);overflow:hidden;pointer-events:none;direction:ltr}#hunger i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff8a3a,#ffd23a);transition:width .3s;border-radius:999px}#hunger span{position:absolute;z-index:2;left:6px;top:0;font-size:16px;line-height:22px}#hunger.low i{background:linear-gradient(90deg,#ff3a3a,#ff8a5a);animation:hl .5s ease-in-out infinite alternate}@keyframes hl{to{opacity:.55}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="top" id="hud" hidden>
  <button class="rb" id="backBtn" style="pointer-events:auto"></button>
  <div class="pill" id="stepP"><b id="recT"></b><div id="dots"></div></div>
  <div class="pill"><b id="coinTxt">🪙 0</b></div>
  <button class="rb" id="sndBtn" style="pointer-events:auto"></button>
</div>
<div id="hunger" hidden><span>😋</span><b></b><i></i></div>
<div id="bub"></div>
<div id="big3" class="big3"></div>
<div id="panel" hidden><div id="pin"></div></div>
<div id="flash"></div><div id="guide" hidden>👆</div>
<section class="scr" id="title" hidden>
  <button class="rb homeT" id="homeT" hidden></button>
  <h1 class="logo"><span class="a">COZY CUB</span><span class="b">KITCHEN</span></h1>
  <p class="sub" id="tSub"></p>
  <div class="tbtns"><div class="stat" id="stat"></div><button class="btn pri" id="cookBtn"></button><button class="btn" id="hatBtn"></button></div>
  <div class="chips" style="margin-top:12px"><button class="chip" id="qBtn"></button><button class="chip" id="voiceBtn"></button></div>
</section>
<div class="sheet" id="bookSheet" hidden><div class="card"><h3 id="bookT"></h3><div class="book" id="book"></div><div class="row" style="margin-top:12px"><button class="btn" id="bookX"></button></div></div></div>
<div class="sheet" id="hatSheet" hidden><div class="card"><h3 id="hatT"></h3><div class="hats" id="hats"></div><div class="row" style="margin-top:12px"><button class="btn" id="hatX"></button></div></div></div>
<div class="sheet" id="resSheet" hidden><div class="card res" id="resCard"></div></div>
<div id="toast"></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="cub/game.js"></script>
</body>
</html>
