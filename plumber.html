<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ron the Plumber</title>
<style>
@font-face{font-family:"Rubik";src:url("fonts/rubik.woff") format("woff");font-weight:300 900;font-display:swap}
:root{--panel:rgba(255,255,255,.94);--ink:#14304a;--blue:#1e88ff;--deep:#0b5cc4;--orange:#ff8a1f;--mint:#2fd3a5;--mute:#6a809a;--gold:#ffc23a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe7f5;color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.top{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}.top .sp{flex:1}
.rb{width:46px;height:46px;border-radius:16px;background:var(--panel);box-shadow:0 6px 16px rgba(10,40,80,.18);display:grid;place-items:center;font-size:20px;position:relative}
.rb svg{width:24px;height:24px}
.rb .n{position:absolute;top:-5px;inset-inline-end:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--orange);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.lv{height:46px;padding:0 14px;border-radius:16px;background:var(--panel);box-shadow:0 6px 16px rgba(10,40,80,.18);display:flex;flex-direction:column;justify-content:center;line-height:1.1}
.lv b{font-size:15px}.lv small{font-size:11.5px;color:var(--mute);font-weight:700}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.dock>*{pointer-events:auto}
.tray{display:flex;gap:8px;padding:8px 10px;border-radius:22px;background:var(--panel);box-shadow:0 8px 22px rgba(10,40,80,.2);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.pc{flex:none;width:58px;height:58px;border-radius:16px;background:#eef5fb;display:grid;place-items:center;position:relative;transition:transform .15s}
.pc svg{width:40px;height:40px}
.pc[aria-pressed=true]{background:linear-gradient(160deg,#4fb0ff,#1e6fe0);transform:translateY(-4px)}
.pc[aria-pressed=true] svg path{stroke:#fff}
.pc .c{position:absolute;bottom:-4px;inset-inline-end:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.pc.empty{opacity:.35}
.go{min-width:230px;height:62px;border-radius:999px;background:linear-gradient(180deg,#46a8ff,#1466d8);color:#fff;font-weight:900;font-size:21px;box-shadow:0 7px 0 #0c4699,0 14px 26px rgba(12,70,153,.35);display:flex;align-items:center;justify-content:center;gap:10px}
.go:active{transform:translateY(4px);box-shadow:0 3px 0 #0c4699}
.go.ready{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 7px 0 #0c4699,0 0 0 10px rgba(70,168,255,.25)}}
.go[disabled]{filter:grayscale(.5);opacity:.6}
#toast{position:fixed;top:max(70px,calc(env(safe-area-inset-top) + 64px));left:50%;transform:translateX(-50%);z-index:8;background:rgba(20,48,74,.88);color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
.scr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));text-align:center;background:linear-gradient(180deg,rgba(207,231,245,.72),rgba(170,210,240,.92));overflow-y:auto}
.logo{margin:6px 0 0;line-height:.9;font-weight:900;direction:ltr}
.logo .a{display:block;font-size:clamp(26px,7vw,40px);color:var(--orange);letter-spacing:2px}
.logo .b{display:block;font-size:clamp(50px,14vw,92px);color:#fff;-webkit-text-stroke:3px var(--deep);paint-order:stroke fill;text-shadow:0 6px 0 var(--deep),0 14px 24px rgba(11,92,196,.35)}
.sub{margin:10px 0 0;font-weight:700;color:#35577a;max-width:420px}
.tabs{display:flex;gap:6px;margin-top:16px;padding:4px;border-radius:18px;background:rgba(255,255,255,.6);flex-wrap:wrap;justify-content:center}
.tabs button{padding:8px 12px;border-radius:14px;font-weight:800;font-size:14px;color:#35577a}
.tabs button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 4px 10px rgba(10,40,80,.12)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;width:min(360px,100%)}
.lb{aspect-ratio:1;border-radius:20px;background:#fff;box-shadow:0 8px 18px rgba(10,40,80,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:26px;border:3px solid transparent}
.lb small{font-size:14px;letter-spacing:1px;color:var(--gold)}
.lb.lock{background:rgba(255,255,255,.55);color:#9bb0c6;font-size:22px}
.lb.cur{border-color:var(--blue)}
.tdesc{margin-top:10px;font-size:13.5px;color:#35577a;font-weight:700;min-height:20px}
#homeT{position:absolute;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px}
.chips{display:flex;gap:8px;margin-top:14px}
.chip{height:40px;padding:0 14px;border-radius:999px;background:#fff;font-weight:700;font-size:14px;box-shadow:0 4px 12px rgba(10,40,80,.12)}
.sheet{position:fixed;inset:0;z-index:12;background:rgba(10,30,60,.38);display:grid;place-items:center;padding:16px}
.card{width:min(380px,100%);background:#fff;border-radius:28px;padding:22px 18px;box-shadow:0 24px 60px rgba(10,30,60,.35);text-align:center;animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h3{margin:0;font-size:26px}
.stars{font-size:46px;letter-spacing:6px;margin:8px 0 4px}
.stars i{font-style:normal;display:inline-block;filter:grayscale(1) opacity(.3);transition:.3s}
.stars i.on{filter:none;animation:st .5s ease-out both}
@keyframes st{from{transform:scale(0) rotate(-40deg)}}
.card p{margin:4px 0 14px;color:var(--mute);font-weight:700}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{height:50px;padding:0 20px;border-radius:999px;background:#eef5fb;font-weight:800;font-size:16px}
.btn.pri{background:linear-gradient(180deg,#46a8ff,#1466d8);color:#fff;box-shadow:0 5px 0 #0c4699}
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#cfe7f5;font-weight:800;color:var(--deep);font-size:18px}
#loading svg{width:70px;height:70px;margin:0 auto 10px;display:block;animation:wr 1.1s ease-in-out infinite}
@keyframes wr{50%{transform:rotate(-25deg)}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="top" id="hud" hidden>
  <button class="rb" id="mapBtn" aria-label="levels"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2" fill="#1466d8"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2" fill="#1466d8"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2" fill="#1466d8"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" fill="#1466d8"/></svg></button>
  <div class="lv"><b id="lvName"></b><small id="lvMoves"></small></div>
  <div class="sp"></div>
  <button class="rb" id="hintBtn" aria-label="hint">💡<span class="n" id="hintN">3</span></button>
  <button class="rb" id="resetBtn" aria-label="restart"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5" fill="none" stroke="#1466d8" stroke-width="2.6" stroke-linecap="round"/><path d="M4 3.5v5h5" fill="none" stroke="#1466d8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="rb" id="sndBtn" aria-label="sound"></button>
</div>
<div class="dock" id="dock" hidden>
  <div class="tray" id="tray" hidden></div>
  <button class="go" id="goBtn"></button>
</div>
<div id="toast"></div>

<section class="scr" id="title" hidden>
  <button class="rb" id="homeT" hidden aria-label="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="#1466d8"/></svg></button>
  <h1 class="logo"><span class="a">RON THE</span><span class="b">PLUMBER</span></h1>
  <p class="sub" id="tSub"></p>
  <div class="tabs" id="tabs"></div>
  <div class="tdesc" id="tdesc"></div>
  <div class="grid" id="lgrid"></div>
  <div class="chips"><button class="chip" id="qBtn"></button></div>
</section>

<div class="sheet" id="winSheet" hidden><div class="card"><h3 id="wT"></h3><div class="stars" id="wStars"><i>⭐</i><i>⭐</i><i>⭐</i></div><p id="wP"></p><div class="row"><button class="btn" id="wMap"></button><button class="btn" id="wAgain"></button><button class="btn pri" id="wNext"></button></div></div></div>
<div id="loading"><div><svg viewBox="0 0 64 64"><path d="M14 50 40 24" stroke="#9aa9b8" stroke-width="9" stroke-linecap="round"/><path d="M38 12a12 12 0 0 0 12 18l4-4-6-2-2-6 4-4a12 12 0 0 0-12-2z" fill="#9aa9b8"/></svg><div id="loadTxt">…</div></div></div>

<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="plumber/game.js"></script>
</body>
</html>
