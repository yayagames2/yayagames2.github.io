<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Zori – Jungle Swing</title>
<style>
:root{--ink:#06140f;--panel:rgba(8,22,16,.86);--line:rgba(255,255,255,.16);--text:#f2fff6;--mute:#d4ecdd;--gold:#ffd25e;--leaf:#5be08a;--red:#ff5f5f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.scr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));text-align:center}
#title{background:linear-gradient(180deg,rgba(3,12,8,.15),rgba(3,12,8,.25) 50%,rgba(3,12,8,.85))}
.logo{font-size:clamp(64px,17vw,120px);font-weight:900;letter-spacing:.08em;line-height:.9;margin:0;direction:ltr;
  background:linear-gradient(180deg,#fff7c2,#ffd25e 45%,#e0741c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #5a2a06) drop-shadow(0 12px 22px rgba(0,0,0,.55))}
.sub{margin:6px 0 0;font-weight:800;letter-spacing:.35em;color:#c9f7d8;font-size:13px;direction:ltr;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.tbox{margin-top:auto;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.cta{width:100%;padding:16px;border-radius:20px;background:linear-gradient(180deg,#ffe07a,#f2a91c);color:#3a2200;font-size:22px;font-weight:900;box-shadow:0 6px 0 #9a5a06,0 14px 30px rgba(0,0,0,.45)}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 #9a5a06}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{flex:1;padding:10px 6px;border-radius:12px;font-weight:900;color:#fff;font-size:15px;text-shadow:0 1px 2px #000}
.seg button[aria-pressed=true]{background:var(--leaf);color:#03240f}
.row{display:flex;gap:8px}
.btn{flex:1;padding:12px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-weight:800;font-size:15px}
.btn.pri{background:var(--gold);color:#3a2200;border-color:transparent}
.lbl{font-size:14px;color:#fff;font-weight:900;text-shadow:0 1px 3px #000;text-align:start;margin:4px 4px -4px}
/* map */
#map{background:radial-gradient(circle at 50% 0,#1d5a3a,#071a10 70%);justify-content:flex-start;overflow-y:auto}
#map h2{margin:6px 0 4px;font-size:26px}
#map .note{color:var(--mute);font-size:13px;margin:0 0 12px}
.lvgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(560px,100%)}
@media(min-width:700px){.lvgrid{grid-template-columns:repeat(4,1fr)}}
.lv{position:relative;border-radius:18px;padding:12px 10px 10px;min-height:118px;text-align:start;overflow:hidden;border:2px solid rgba(255,255,255,.18);box-shadow:0 8px 20px rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:flex-end}
.lv .n{position:absolute;top:8px;inset-inline-start:10px;font-size:26px;font-weight:900;opacity:.9;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.lv .ic{position:absolute;top:8px;inset-inline-end:10px;font-size:30px}
.lv b{font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.lv .st{font-size:15px;letter-spacing:2px;margin-top:3px}
.lv.lock{filter:grayscale(.85) brightness(.55)}
.lv.lock::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:34px}
/* hud */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
.hl{position:absolute;top:max(10px,env(safe-area-inset-top));inset-inline-start:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pill{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:14px;background:rgba(6,20,12,.72);border:1.5px solid rgba(255,255,255,.28);font-weight:900;font-size:16px;color:#fff;text-shadow:0 1px 2px #000;backdrop-filter:blur(6px)}
.hearts{letter-spacing:1px;font-size:16px}
.letters{display:flex;gap:5px;direction:ltr}
.letters i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;background:rgba(6,20,12,.75);border:2px solid rgba(255,255,255,.45);color:rgba(255,255,255,.8);text-shadow:0 1px 2px #000}
.letters i.on{background:radial-gradient(circle at 35% 30%,#fff2a8,#ffc21f 60%,#c07a00);color:#5a3300;border-color:#ffe48a;box-shadow:0 0 12px #ffd25e}
#pBtn{position:absolute;top:max(10px,env(safe-area-inset-top));inset-inline-end:12px;pointer-events:auto;width:46px;height:46px;border-radius:15px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.2);font-size:20px}
#lvName{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-weight:900;font-size:15px;color:#fff;background:rgba(6,20,12,.72);border:1.5px solid rgba(255,255,255,.28);padding:5px 12px;border-radius:12px;text-shadow:0 1px 2px #000;white-space:nowrap}
#toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);max-width:86vw;text-align:center;font-weight:900;font-size:21px;color:#fff;background:rgba(6,20,12,.78);border:1.5px solid rgba(255,255,255,.3);padding:10px 16px;border-radius:16px;text-shadow:0 2px 3px #000;opacity:0;transition:opacity .3s}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;opacity:0;transition:opacity .5s}
#banner b{display:block;font-size:clamp(30px,8vw,54px);font-weight:900;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.8)}
#banner span{font-weight:800;color:var(--gold);letter-spacing:.2em;font-size:14px;text-shadow:0 2px 8px #000}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,40,40,.65));opacity:0;transition:opacity .4s}
/* touch */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#touch>*{pointer-events:auto;touch-action:none}
#joy{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:136px;height:136px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2)}
#thumb{position:absolute;left:38px;top:38px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none}
.act{position:absolute;right:max(22px,env(safe-area-inset-right));border-radius:50%;font-weight:900;color:#fff;border:2px solid rgba(255,255,255,.35);text-shadow:0 1px 3px rgba(0,0,0,.5)}
#bJump{width:100px;height:100px;bottom:max(30px,env(safe-area-inset-bottom));background:radial-gradient(circle at 35% 30%,rgba(120,255,160,.95),rgba(20,130,60,.92));font-size:19px;text-shadow:0 2px 3px rgba(0,0,0,.7)}
#bThrow{width:74px;height:74px;bottom:calc(max(30px,env(safe-area-inset-bottom)) + 112px);right:calc(max(22px,env(safe-area-inset-right)) + 14px);background:radial-gradient(circle at 35% 30%,rgba(255,200,120,.95),rgba(180,90,20,.92));font-size:15px;text-shadow:0 2px 3px rgba(0,0,0,.7)}
.act.on{filter:brightness(1.35);transform:scale(.95)}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(2,10,6,.62);backdrop-filter:blur(5px);padding:16px}
.card{width:min(360px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.card h2{margin:0;font-size:26px}
.stars{font-size:46px;letter-spacing:6px;min-height:56px}
.stars i{font-style:normal;display:inline-block;filter:grayscale(1) brightness(.5);transform:scale(.6);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.stars i.on{filter:none;transform:scale(1)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:14px;font-weight:700;color:var(--mute)}
.stats b{display:block;color:#fff;font-size:18px}
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,#1d5a3a,#04100a);font-weight:800;font-size:18px}
#loading .sp{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.home{position:fixed;z-index:12;top:max(12px,env(safe-area-inset-top));inset-inline-end:12px;padding:9px 13px;border-radius:13px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.22);font-weight:800;font-size:13px}
.keys{color:var(--mute);font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading"><div><div class="sp"></div>Chargement de la jungle…</div></div>

<section class="scr" id="title" hidden>
  <button class="home" id="homeT" hidden>🏠 Menu des jeux</button>
  <h1 class="logo">ZORI</h1>
  <div class="sub">JUNGLE SWING</div>
  <div class="tbox">
    <button class="cta" id="playBtn">▶ Jouer</button>
    <div class="lbl">Difficulté</div>
    <div class="seg" id="diffSeg"><button data-d="easy">😊 Facile</button><button data-d="normal">🙂 Normal</button><button data-d="hard">🔥 Difficile</button></div>
    <div class="row"><button class="btn" id="sndBtn">🔊 Son</button><button class="btn" id="qBtn">✨ Graphismes</button></div>
    <div class="keys" id="keysTxt"></div>
  </div>
</section>

<section class="scr" id="map" hidden>
  <h2>🗺️ Voyage dans la jungle</h2>
  <p class="note">12 niveaux · ramasse les lettres Z·O·R·I et un maximum de fruits</p>
  <div class="lvgrid" id="lvGrid"></div>
  <div class="row" style="width:min(560px,100%);margin-top:14px"><button class="btn" id="mapBack">→ Retour</button></div>
</section>

<div id="hud" hidden>
  <div class="hl">
    <div class="pill"><span class="hearts" id="hHearts"></span><span id="hLives" style="font-size:13px;opacity:.85"></span></div>
    <div class="pill">🥭 <span id="hFruit">0</span></div>
    <div class="letters" id="hLet"><i>Z</i><i>O</i><i>R</i><i>I</i></div>
  </div>
  <div id="lvName"></div>
  <button id="pBtn" aria-label="Pause">⏸</button>
  <div id="toast"></div>
  <div id="banner"><span id="banN"></span><b id="banT"></b></div>
  <div id="hurt"></div>
</div>

<div id="touch" hidden>
  <div id="joy"><div id="thumb"></div></div>
  <button class="act" id="bThrow">Lancer</button>
  <button class="act" id="bJump">Saut</button>
</div>

<div class="ov" id="pause" hidden><div class="card">
  <h2>⏸ Pause</h2>
  <button class="btn pri" id="resBtn">▶ Reprendre</button>
  <button class="btn" id="rstBtn">↺ Recommencer le niveau</button>
  <button class="btn" id="toMap">🗺️ Carte des niveaux</button>
  <div class="row"><button class="btn" id="sndBtn2">🔊</button><button class="btn" id="qBtn2">✨</button></div>
  <button class="btn" id="homeP" hidden>🏠 Menu des jeux</button>
</div></div>

<div class="ov" id="done" hidden><div class="card">
  <h2 id="doneT">Niveau terminé !</h2>
  <div class="stars" id="doneS"><i>⭐</i><i>⭐</i><i>⭐</i></div>
  <div class="stats"><div>Fruits<b id="dF"></b></div><div>Lettres<b id="dL"></b></div><div>Temps<b id="dT"></b></div></div>
  <div id="dHint" style="font-size:14px;font-weight:700;color:var(--mute);text-shadow:0 1px 2px #000"></div>
  <button class="btn pri" id="nextBtn">Niveau suivant ▶</button>
  <div class="row"><button class="btn" id="againBtn">↺ Encore</button><button class="btn" id="mapBtn2">🗺️ Carte</button></div>
</div></div>

<div class="ov" id="over" hidden><div class="card">
  <h2>😵 Plus de vies</h2>
  <p style="margin:0;color:var(--mute)">Pas grave ! Réessaie – chaque essai te rend meilleur.</p>
  <button class="btn pri" id="retryBtn">↺ Réessayer</button>
  <button class="btn" id="mapBtn3">🗺️ Carte des niveaux</button>
</div></div>

<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="zori/game.fr.js"></script>
</body>
</html>
