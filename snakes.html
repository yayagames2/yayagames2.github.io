<style>
:root{--bg:#1a5a3a;--accent:#ffd23f;--deep:#145a2a;--btn:linear-gradient(180deg,#4ad06a,#1a9a3a);--btnsh:#0e5a20;--scr:radial-gradient(circle at 50% 15%,#7ae0a0,#1a7a4a 70%);--table:radial-gradient(circle at 50% 30%,#8ad8ff,#2a8ad0);--subc:#f0fff4}
#swrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:2px 8px max(8px,env(safe-area-inset-bottom))}
#ssvg{display:block;border-radius:16px;box-shadow:0 12px 30px rgba(0,40,80,.35);touch-action:manipulation;flex:none}
#plist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#plist .pl{display:flex;align-items:center;gap:5px;height:34px;padding:0 10px 0 4px;border-radius:999px;background:rgba(255,255,255,.88);font-weight:900;font-size:13px;color:#1a2a3a;box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .2s}
#plist .pl.on{background:#fff;transform:scale(1.08);box-shadow:0 0 0 3px var(--c),0 3px 0 rgba(0,0,0,.15)}
#plist .pl i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--c)}
#sp{display:flex;align-items:center;gap:14px;min-height:70px}
#sp .rollBtn{min-width:150px}
</style>
</head>
