<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="lib/i18n.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Spiral Drop</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#2a1a5a;--accent:#ff5ab0;--deep:#3a1a7a;--btn:linear-gradient(180deg,#ff7ac8,#d83a9a);--btnsh:#6a0a4a;--panel:rgba(30,16,60,.55);--scr:transparent}
body{background:#2a1a5a;color:#fff}
.rb,.pill{color:#fff;background:rgba(20,10,50,.45);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px)}
#lvbar{position:fixed;z-index:5;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;direction:ltr;pointer-events:none}
#lvbar .c{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:17px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#lvbar .bar{width:min(46vw,220px);height:12px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden}
#lvbar .bar i{display:block;height:100%;width:0;border-radius:8px;transition:width .15s}
#score{position:fixed;z-index:5;top:max(62px,calc(env(safe-area-inset-top) + 58px));left:0;right:0;text-align:center;font-weight:900;font-size:46px;color:#fff;-webkit-text-stroke:2px rgba(60,10,80,.75);paint-order:stroke fill;text-shadow:0 4px 0 rgba(60,10,80,.45);pointer-events:none;direction:ltr}
#combo{position:fixed;z-index:6;left:0;right:0;top:30%;text-align:center;pointer-events:none;font-weight:900;direction:ltr}
#combo div{font-size:30px;color:#fff;-webkit-text-stroke:1.5px rgba(80,0,60,.8);text-shadow:0 4px 0 rgba(80,0,60,.6),0 0 22px rgba(255,120,200,.8);animation:cpop 1s ease-out forwards}
#combo div.f{color:#ffe24a;font-size:36px}
@keyframes cpop{0%{transform:scale(.3);opacity:0}20%{transform:scale(1.15);opacity:1}35%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
#title{justify-content:flex-end;background:linear-gradient(180deg,rgba(20,8,50,0) 45%,rgba(20,8,50,.8))}
#title .homeT{z-index:3}
#title .logo{pointer-events:none;position:absolute;top:max(16px,env(safe-area-inset-top));left:0;right:0;margin:0}
.logo .a{color:#ffe24a;letter-spacing:8px;text-shadow:0 4px 0 #8a2a6a}.logo .b{color:#fff;-webkit-text-stroke:3px #8a1a6a;text-shadow:0 6px 0 #5a0a4a,0 0 30px rgba(255,100,200,.6);font-style:italic}
.stat{display:flex;gap:10px;justify-content:center;color:#fff;font-weight:900;font-size:17px}
.stat span{background:rgba(20,10,50,.5);border-radius:999px;padding:5px 14px}
.go2{width:min(340px,90vw);height:66px;border-radius:999px;background:linear-gradient(180deg,#7aff5a,#22b81a);color:#fff;font-weight:900;font-size:25px;box-shadow:0 7px 0 #0f6a0a,0 14px 26px rgba(0,0,0,.35);margin-top:12px;animation:gp 1.2s ease-in-out infinite;text-shadow:0 2px 0 rgba(0,0,0,.25)}@keyframes gp{50%{transform:scale(1.05)}}
.trow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 6px}
.chip svg{width:22px;height:22px;display:block}
#hint{position:fixed;z-index:6;left:0;right:0;bottom:max(40px,env(safe-area-inset-bottom));text-align:center;font-weight:900;font-size:20px;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.5);animation:hb 1.4s ease-in-out infinite}
@keyframes hb{50%{transform:translateX(16px)}}
.shop{max-height:82vh;overflow-y:auto;width:min(460px,94vw)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:10px 0 14px}
.sk{border-radius:16px;background:#f4f0fb;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent;font-weight:800;color:#2a1a4a;font-size:12px}
.sk canvas{width:56px;height:56px}
.sk.on{border-color:#ff5ab0;background:#fff0f8}.sk small{font-size:11px;opacity:.8}
.card{background:#fff;color:#2a1a4a}
</style>
</head>
<body>
<div id="stage"></div>
<div class="top" id="hud" hidden>
  <button class="rb" id="pauseBtn"></button>
  <div class="sp"></div>
  <div class="pill"><b id="coinTxt" style="direction:ltr">0</b><small>🪙</small></div>
</div>
<div id="lvbar" hidden><div class="c" id="lvA">1</div><div class="bar"><i id="lvI"></i></div><div class="c" id="lvB">2</div></div>
<div id="score" hidden>0</div>
<div id="combo"></div>
<div id="hint" hidden></div>
<div id="toast"></div>
<section class="scr" id="title" hidden>
  <button class="rb homeT" id="homeT" hidden></button>
  <h1 class="logo"><span class="a">SPIRAL</span><span class="b">DROP</span></h1>
  <div class="stat"><span>🏆 <b id="tBest">0</b></span><span>🪙 <b id="tCoins">0</b></span></div>
  <button class="go2" id="goBtn"></button>
  <div class="trow"><button class="chip" id="shopBtn"></button><button class="chip" id="qBtn"></button><button class="chip" id="sndBtn"></button></div>
</section>
<div class="sheet" id="shopSheet" hidden><div class="card shop"><h3><span id="shopT"></span> · 🪙 <span id="shopCoins"></span></h3><div class="grid3" id="skins"></div><div class="row"><button class="btn pri" id="shopClose"></button></div></div></div>
<div class="sheet" id="endSheet" hidden><div class="card"><div id="eE" style="font-size:54px;line-height:1"></div><h3 id="eT"></h3><p id="eP" style="font-weight:700"></p><div class="row"><button class="btn" id="eMenu"></button><button class="btn pri" id="eAgain"></button></div></div></div>
<div class="sheet" id="pauseSheet" hidden><div class="card"><h3 id="pT"></h3><div class="row"><button class="btn" id="pMenu"></button><button class="btn pri" id="pGo"></button></div></div></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="helix/game.js"></script>
</body>
</html>
