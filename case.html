<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="lib/i18n.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Case Craft</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#ffe6f4;--accent:#ff4fa8;--btn:linear-gradient(180deg,#ff7ac8,#c84aff);--btnsh:#7a2aa8;--panel:rgba(255,255,255,.95)}
body{background:radial-gradient(circle at 50% 10%,#fff4fb,#ffd8ee 45%,#d8c8ff);color:#5a2a6a;overflow:hidden}
#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#ed{position:fixed;inset:0;z-index:2;touch-action:none;display:block}
#toast{z-index:41}
#hud{position:fixed;z-index:6;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;gap:8px;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto}
#stepT{flex:1;text-align:center;font-weight:900;font-size:19px;color:#8a2a9a;text-shadow:0 2px 0 #fff;pointer-events:none!important}
#coinC{direction:ltr;font-weight:900;background:#fff;border-radius:999px;padding:5px 12px;box-shadow:0 3px 0 #e8c0e0;color:#8a2a9a}
#edTools{position:fixed;z-index:6;left:max(8px,env(safe-area-inset-left));top:max(70px,calc(env(safe-area-inset-top) + 64px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.et{pointer-events:auto;width:50px;height:50px;border-radius:16px;background:#fff;box-shadow:0 4px 0 #d9a8e6,0 8px 16px rgba(120,40,140,.22);display:grid;place-items:center;font-size:24px;transition:opacity .15s,transform .1s}
.et:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a8e6}.et svg{width:28px;height:28px}#redoBtn svg{transform:scaleX(-1)}.et.off{opacity:.38}
#panel{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:8px 10px max(10px,env(safe-area-inset-bottom));background:rgba(255,255,255,.93);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(120,40,140,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#panel .in{max-width:620px;margin:0 auto}
.tabs{display:flex;gap:4px;justify-content:space-between;margin-bottom:6px}
.tab{flex:1;min-width:0;height:48px;border-radius:14px;background:#f6ecfb;font-size:20px;line-height:1;color:#8a2a9a;font-weight:800;padding:2px 0}
.tab small{display:block;font-size:9px;margin-top:2px;white-space:nowrap;letter-spacing:-.2px;color:inherit;opacity:1}
.tab.on{background:linear-gradient(180deg,#ff7ac8,#c84aff);color:#fff;box-shadow:0 3px 0 #7a2aa8}
#opts{min-height:104px}
.lbl{font-weight:900;font-size:12.5px;margin:2px 4px 3px;color:#8a2a9a}
.row2{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;align-items:center}.row2::-webkit-scrollbar{display:none}
.sw{flex:none;width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(120,40,140,.28)}
.sw.on{outline:3px solid #8a2a9a;transform:scale(1.12)}
.ch{flex:none;min-width:44px;height:44px;border-radius:14px;background:#f6ecfb;font-size:22px;box-shadow:0 3px 0 #e2c8ee;padding:0 9px;font-weight:800;color:#8a2a9a;position:relative}
.ch small{display:block;font-size:10px;line-height:1.05;color:inherit;opacity:1;letter-spacing:0}
.ch.on{background:linear-gradient(180deg,#ff7ac8,#c84aff);color:#fff;box-shadow:0 3px 0 #7a2aa8}
.ch.lk{opacity:.55}.ch .pr{position:absolute;bottom:-5px;inset-inline-end:-4px;font-size:10px;background:#ffd23a;color:#7a3a00;border-radius:8px;padding:0 4px;direction:ltr;font-weight:900}
.sep{flex:none;width:2px;align-self:stretch;background:#eedcf4;margin:4px 2px;border-radius:2px}
.sl{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px;margin:2px 4px}.sl input{flex:1;accent-color:#c84aff}
.tin{flex:1;min-width:0;height:42px;border-radius:12px;border:2px solid #e2c8ee;font-size:17px;font-weight:800;padding:0 10px;color:#5a2a6a;font-family:inherit}
.go{display:flex;gap:8px;margin-top:4px}.go .btn{flex:1;height:52px;font-size:18px}
.btn.ready{animation:rdy 1.1s ease-in-out infinite}@keyframes rdy{50%{transform:scale(1.05)}}
.btn.wh{background:#fff;color:#8a2a9a;box-shadow:0 4px 0 #e2c8ee}
#title{position:fixed;inset:0;z-index:7;overflow-y:auto;text-align:center;padding:max(14px,env(safe-area-inset-top)) 16px 30px;pointer-events:none}
#title>*{pointer-events:auto}
#title .homeT{position:absolute;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px}
.logo{margin:46px 0 0;font-size:clamp(44px,13vw,72px);line-height:.92;pointer-events:none!important}
.logo .a{display:block;color:#ff5ab4;-webkit-text-stroke:2px #fff;text-shadow:0 6px 0 #a8287a,0 10px 24px rgba(200,40,140,.35)}
.logo .b{display:block;color:#8a5aff;-webkit-text-stroke:3px #fff;text-shadow:0 6px 0 #4a2aa8}
#tSub{max-width:400px;margin:6px auto 0;font-weight:800;pointer-events:none!important}
.tbot{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.tbot>*{pointer-events:auto}
#newBtn{height:66px;font-size:22px;padding:0 34px;animation:rdy 1.4s ease-in-out infinite}
#albBtn{height:48px;font-size:17px}
#tCoin{direction:ltr;font-weight:900;background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 4px 0 #e8c0e0;color:#8a2a9a;display:inline-block;margin-top:8px}
/* phone picker */
#pick{position:fixed;inset:0;z-index:7;pointer-events:none}
#pick .pp{position:fixed;left:0;right:0;bottom:0;padding:12px 12px max(14px,env(safe-area-inset-bottom));background:rgba(255,255,255,.94);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(120,40,140,.18);pointer-events:auto}
#pick .pp>div{max-width:560px;margin:0 auto}
/* oven */
#oven{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#3a2240,#140a1c 75%);padding:20px}
.ov{position:relative;width:min(300px,78vw);aspect-ratio:1.05;border-radius:26px;background:linear-gradient(180deg,#e8e4ee,#b8b0c4);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 -8px 0 rgba(0,0,0,.12);padding:12px}
.otop{height:16%;display:flex;align-items:center;gap:10px;padding:0 6px}
.knob{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#888);box-shadow:0 2px 4px rgba(0,0,0,.4);position:relative}.knob::after{content:"";position:absolute;left:50%;top:3px;width:3px;height:9px;margin-left:-1.5px;background:#444;border-radius:2px}
.disp{margin-inline-start:auto;font-family:monospace;font-weight:900;font-size:20px;color:#5aff9a;background:#101418;border-radius:8px;padding:2px 10px;direction:ltr;text-shadow:0 0 8px #5aff9a}
.door{position:absolute;left:12px;right:12px;bottom:12px;top:20%;border-radius:18px;background:linear-gradient(180deg,#d8d2e2,#a8a0b8);padding:12px;box-shadow:inset 0 2px 0 #fff}
.win{position:relative;width:100%;height:82%;border-radius:12px;background:#1a0e10;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 20px #000}
.win img{height:84%;border-radius:12%;filter:brightness(.8);transition:filter .3s;transform:rotate(-8deg)}
.heat{position:absolute;inset:0;background:radial-gradient(circle at 50% 70%,rgba(255,140,40,.85),rgba(255,60,0,.25) 50%,transparent 75%);opacity:0;mix-blend-mode:screen}
.grill{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.08) 18px 20px)}
.handle{height:10px;margin:7px 18% 0;border-radius:6px;background:linear-gradient(180deg,#fff,#888)}
.ov.shake{animation:osh .12s linear infinite}@keyframes osh{25%{transform:translate(1px,-1px)}75%{transform:translate(-1px,1px)}}
.gauge{position:relative;width:min(280px,74vw);height:calc(min(280px,74vw)/2);overflow:hidden}
.gauge .arc{position:absolute;left:0;top:0;width:100%;aspect-ratio:1;border-radius:50%;background:conic-gradient(from -90deg,#4ab0ff 0 55deg,#ffd23a 55deg 78deg,#3aff8a 78deg 102deg,#ffd23a 102deg 125deg,#ff4a3a 125deg 180deg,transparent 180deg)}
.gauge .arc::after{content:"";position:absolute;inset:20%;border-radius:50%;background:#1c1024}
.gauge i{position:absolute;left:50%;bottom:0;width:6px;height:88%;margin-left:-3px;background:#fff;border-radius:3px;transform-origin:50% 100%;box-shadow:0 0 10px #fff}
.gauge b{position:absolute;left:50%;bottom:-14px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:#fff}
#ovBtn{height:64px;font-size:22px;padding:0 40px;background:linear-gradient(180deg,#ff9a3a,#ff3a3a);box-shadow:0 6px 0 #8a1a1a}
#ovHint{color:#fff;font-weight:900;font-size:18px;text-align:center;min-height:26px;margin:0;text-shadow:0 2px 6px #000}
/* reveal bar */
#rev{position:fixed;z-index:6;left:0;right:0;bottom:0;padding:10px 10px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#rev>*{pointer-events:auto}
#rev .rr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#rev .btn{height:48px;font-size:16px}
#revInfo{background:rgba(255,255,255,.9);border-radius:18px;padding:6px 16px;font-weight:900;text-align:center;box-shadow:0 4px 0 rgba(120,40,140,.15)}
#revInfo small{display:block;font-weight:800;opacity:.8}
#rotHint{position:fixed;z-index:6;top:30%;left:0;right:0;text-align:center;font-weight:900;font-size:16px;color:#8a2a9a;pointer-events:none;text-shadow:0 2px 0 #fff;animation:fade 3s ease forwards 2.5s}@keyframes fade{to{opacity:0}}
#flash{position:fixed;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none}
.tierB{position:fixed;z-index:21;left:0;right:0;top:14%;text-align:center;pointer-events:none;opacity:0;transform:scale(.3);transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .25s}
.tierB.on{opacity:1;transform:scale(1)}
.tierB b{display:inline-block;font-size:36px;font-weight:900;color:#fff;padding:6px 26px;border-radius:999px;background:var(--c);box-shadow:0 6px 0 rgba(0,0,0,.18),0 0 40px var(--c)}
.tierB.t4 b{background:linear-gradient(90deg,#ff4ab0,#ffb21f,#5ae0a0,#4ab0ff,#b05aff);animation:hue 2s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
.tierB span{display:block;margin-top:8px;font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 6px #000}
#album{position:fixed;inset:0;z-index:12;overflow-y:auto;background:linear-gradient(180deg,#fff4fb,#e8dcff);padding:max(12px,env(safe-area-inset-top)) 12px 30px}
.ahead{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto 10px}.ahead h3{margin:0;color:#8a2a9a;flex:1;text-align:center}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;max-width:640px;margin:0 auto}
.ac{position:relative;aspect-ratio:2/3;border-radius:16px;background:#fff;padding:0;overflow:hidden;box-shadow:0 4px 0 rgba(120,40,140,.15)}
.ac img{width:100%;height:100%;object-fit:cover;display:block}
.ac i{position:absolute;top:4px;inset-inline-start:4px;font-style:normal;font-size:16px}
.empty{grid-column:1/-1;text-align:center;font-weight:800;opacity:.8;padding:30px 0}
.dark-on body,body.dark{background:radial-gradient(circle at 50% 30%,#2a1a40,#07040e 75%)}
body.dark #stepT{color:#fff;text-shadow:0 2px 8px #000}
@media (orientation:landscape) and (max-height:560px){#panel{left:auto;top:0;width:min(400px,50vw);border-radius:24px 0 0 24px;overflow-y:auto;padding-top:max(8px,env(safe-area-inset-top))}#hud{right:min(400px,50vw)}#pick .pp{left:auto;top:0;width:min(400px,50vw);border-radius:24px 0 0 24px}.logo{margin-top:14px;font-size:44px}#tSub{display:none}.tbot{flex-direction:row;justify-content:center}#newBtn{height:54px;font-size:19px}#rev{left:auto;right:0;width:48vw}#rev .rr{max-width:46vw}#title{padding-left:46vw}.tbot{left:46vw}#oven{display:grid;grid-template-columns:auto auto;align-content:center;justify-content:center;column-gap:30px;row-gap:10px}.ov{grid-row:1/4;width:min(300px,62vh)}.gauge{width:min(240px,40vw);height:calc(min(240px,40vw)/2)}}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="ed" hidden></canvas>
<div id="hud" hidden><button class="rb" id="backBtn"></button><div id="stepT"></div><span id="coinC"></span><button class="rb" id="sndBtn"></button></div>
<div id="panel" hidden><div class="in"><div class="tabs" id="tabs"></div><div id="opts"></div><div class="go"><button class="btn pri ready" id="bakeBtn"></button></div></div></div>
<div id="edTools"><button class="et" id="undoBtn" hidden></button><button class="et" id="redoBtn" hidden></button><button class="et" id="wipeBtn" hidden>🧽</button></div>
<div id="title" hidden><button class="rb homeT" id="homeT" hidden></button><h1 class="logo"><span class="a">CASE</span><span class="b">CRAFT</span></h1><p id="tSub"></p><span id="tCoin"></span>
  <div class="tbot"><button class="btn pri" id="newBtn"></button><button class="btn wh" id="albBtn"></button></div></div>
<div id="pick" hidden><div class="pp"><div id="pickIn"></div></div></div>
<div id="oven" hidden><div class="ov" id="ovBox"><div class="otop"><span class="knob" id="k1"></span><span class="knob"></span><div class="disp" id="odisp">180°</div></div><div class="door"><div class="win"><img id="oimg" alt=""><div class="grill"></div><div class="heat" id="heat"></div></div><div class="handle"></div></div></div>
  <div class="gauge" id="gauge"><div class="arc"></div><i id="needle"></i><b></b></div><p id="ovHint"></p><button class="btn pri" id="ovBtn"></button></div>
<div id="rev" hidden><div id="revInfo"></div><div class="rr" id="revBtns"></div></div>
<div id="rotHint" hidden></div>
<div id="flash"></div><div id="tierB" class="tierB"></div>
<div id="album" hidden></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<div id="toast"></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="case/game.js"></script>
</body>
</html>
