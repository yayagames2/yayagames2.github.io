<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Siren Rush</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
:root{--bg:#070a1a;--accent:#ff2a4a;--btn:linear-gradient(180deg,#ff4a5a,#c8102a);--btnsh:#6a0a1a;--panel:rgba(8,10,28,.72);--scr:transparent}
body{color:#fff;background:#070a1a}
.rb,.pill{color:#fff;background:rgba(8,10,28,.6);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#edge{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .2s}
#flash{position:fixed;inset:0;z-index:3;pointer-events:none;background:#fff;opacity:0}
#title{justify-content:flex-end;background:linear-gradient(180deg,rgba(7,10,26,0) 0%,rgba(7,10,26,0) 22%,rgba(7,10,26,.8) 42%,rgba(7,10,26,.96) 100%)}
#title .homeT{z-index:3}
.logo{pointer-events:none;position:absolute;top:max(18px,env(safe-area-inset-top));left:0;right:0;margin:0;font-size:clamp(44px,12vw,74px);line-height:.9;font-style:italic;letter-spacing:-1px;direction:ltr}
.logo .a{display:block;color:#ff2a4a;text-shadow:0 0 18px #ff2a4a,0 4px 0 #5a0010;animation:sa 1s steps(1) infinite}
.logo .b{display:block;color:#3a8aff;text-shadow:0 0 18px #3a8aff,0 4px 0 #001a5a;animation:sb 1s steps(1) infinite}
@keyframes sa{50%{color:#ff9aa8;text-shadow:0 0 4px #ff2a4a,0 4px 0 #5a0010}}@keyframes sb{0%{color:#9ac8ff;text-shadow:0 0 4px #3a8aff,0 4px 0 #001a5a}50%{color:#3a8aff;text-shadow:0 0 18px #3a8aff,0 4px 0 #001a5a}}
.tpan{width:min(560px,100%);display:flex;flex-direction:column;gap:10px;align-items:stretch}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sides button{border-radius:20px;padding:10px 6px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);color:#fff;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:2px}
.sides button i{font-style:normal;font-size:34px;line-height:1.1}.sides button small{font-size:11.5px;opacity:.8;font-weight:700}
.sides button.on.rob{border-color:#ffd23a;background:linear-gradient(180deg,rgba(255,210,58,.25),rgba(255,120,30,.12));box-shadow:0 0 22px rgba(255,190,40,.3)}
.sides button.on.cop{border-color:#5aa8ff;background:linear-gradient(180deg,rgba(90,168,255,.28),rgba(40,60,255,.12));box-shadow:0 0 22px rgba(80,150,255,.35)}
.lvls{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.lvls button{height:52px;border-radius:14px;background:rgba(255,255,255,.08);color:#fff;font-weight:900;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid transparent;line-height:1}
.lvls button small{font-size:10px;color:#ffd23a;letter-spacing:-1px;margin-top:3px}.lvls button.on{border-color:#ff4a5a;background:rgba(255,74,90,.2)}.lvls button.lock{opacity:.35}
.vsel{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:18px;padding:8px}
.vsel .ar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);font-size:20px;font-weight:900;color:#fff;flex:none}
.vmid{flex:1;text-align:center}.vmid b{font-size:19px}.vmid p{margin:1px 0 4px;font-size:12px;opacity:.85;font-weight:700}
.bars{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:11px;font-weight:800;text-align:start;align-items:center}
.bars i{display:block;height:7px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}.bars i b{display:block;height:100%;background:linear-gradient(90deg,#3a8aff,#ff2a4a)}
.go2{height:62px;border-radius:999px;background:linear-gradient(180deg,#ff4a5a,#c8102a);color:#fff;font-weight:900;font-size:22px;box-shadow:0 7px 0 #6a0a1a,0 0 30px rgba(255,40,70,.45);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.trow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.brief{font-size:13px;font-weight:700;opacity:.88;min-height:18px}
#hud .pill b{font-size:16px}
.hp{width:70px;height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:3px}.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3a3a,#ffd23a,#5aff7a);transition:width .2s}
.heat{color:#ffd23a;letter-spacing:-1px;font-size:15px!important}.heat .off{color:rgba(255,255,255,.22)}
.mini{position:fixed;z-index:5;top:max(66px,calc(env(safe-area-inset-top) + 62px));inset-inline-end:12px;width:116px;height:116px;border-radius:50%;background:rgba(8,10,28,.55);border:2px solid rgba(255,255,255,.25);box-shadow:0 0 18px rgba(0,0,0,.4)}
.spd{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));text-align:center;font-weight:900;pointer-events:none;direction:ltr;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.spd b{font-size:34px;display:block;line-height:1;font-style:italic}.spd small{font-size:11px;opacity:.85}
.nitro{width:90px;height:7px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;margin:4px auto 0}.nitro i{display:block;height:100%;background:linear-gradient(90deg,#3af0ff,#c85aff)}
.bust{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:max(118px,calc(env(safe-area-inset-top) + 112px));width:min(260px,64vw);text-align:center;font-weight:900;pointer-events:none}
.bust div{height:12px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;border:1px solid rgba(255,255,255,.3)}.bust i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3a8aff,#ff2a4a)}.bust span{font-size:13px;text-shadow:0 2px 4px #000}
.msg{position:fixed;z-index:6;left:0;right:0;top:27%;text-align:center;pointer-events:none;font-weight:900;font-style:italic}
.msg div{font-size:40px;color:#fff;text-shadow:0 0 20px #ff2a4a,0 4px 0 #5a0010;animation:tpop 1.6s ease-out forwards}
.msg div.blue{text-shadow:0 0 20px #3a8aff,0 4px 0 #001a5a}.msg div.gold{color:#ffe27a;text-shadow:0 0 20px #ffb21f,0 4px 0 #5a3a00}.msg div.sm{font-size:26px}
@keyframes tpop{0%{transform:scale(.3) skewX(-8deg);opacity:0}14%{transform:scale(1.18) skewX(-8deg);opacity:1}28%{transform:scale(1) skewX(-8deg)}80%{opacity:1}100%{transform:translateY(-34px) skewX(-8deg);opacity:0}}
.cd{position:fixed;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none}
.cd b{font-size:120px;font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 30px #ff2a4a,0 8px 0 #5a0010;animation:cdp .9s ease-out forwards;direction:ltr}
@keyframes cdp{0%{transform:scale(2);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:0}}
.ctl{position:fixed;z-index:6;bottom:max(16px,calc(env(safe-area-inset-bottom) + 8px));display:flex;gap:12px;align-items:flex-end;direction:ltr}
.ctl button{border-radius:50%;font-weight:900;color:#fff;touch-action:none;box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.35);user-select:none;-webkit-user-select:none}
.ctl button.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35);filter:brightness(1.25)}
#cL{left:max(14px,env(safe-area-inset-left))}#cR{right:max(14px,env(safe-area-inset-right))}
.st{width:78px;height:78px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),rgba(255,255,255,.12));font-size:32px}
#bGas{width:84px;height:118px;border-radius:26px!important;background:linear-gradient(180deg,#5aff7a,#14a83a);font-size:30px}
#bBrk{width:66px;height:66px;background:radial-gradient(circle at 35% 30%,#ff8a7a,#d8241a);font-size:22px}
.side{position:fixed;z-index:6;right:max(18px,env(safe-area-inset-right));width:70px;height:70px;border-radius:22px;font-size:32px;border:3px solid rgba(255,255,255,.45);box-shadow:0 5px 0 rgba(0,0,0,.35);touch-action:none;color:#fff}
#bNit{bottom:max(150px,calc(env(safe-area-inset-bottom) + 142px));background:linear-gradient(180deg,#3af0ff,#7a3aff)}
#bNit.dim{opacity:.35}
#bSpk{bottom:max(232px,calc(env(safe-area-inset-bottom) + 224px));background:linear-gradient(180deg,#ffb23a,#e85a14)}#bSpk small{position:absolute;top:-6px;left:-6px;background:#fff;color:#c8102a;border-radius:10px;font-size:13px;padding:1px 6px;font-weight:900}
#bSpk.dim{opacity:.35}
.card{background:#fff;color:#14162a}
.chip svg{width:22px;height:22px;display:block}
.stats{list-style:none;padding:0;margin:8px 0;text-align:start}.stats li{display:flex;justify-content:space-between;padding:6px 10px;border-radius:10px;font-weight:800}.stats li:nth-child(odd){background:#f2f4fa}
@media (orientation:portrait){.spd{bottom:max(150px,calc(env(safe-area-inset-bottom) + 142px))}.st{width:70px;height:70px}#bGas{width:76px;height:108px}#bBrk{width:58px;height:58px}#bNit{bottom:max(140px,calc(env(safe-area-inset-bottom) + 132px))}#bSpk{bottom:max(220px,calc(env(safe-area-inset-bottom) + 212px))}}
@media (orientation:landscape) and (max-height:620px){.brief{display:none}.vmid p{display:none}.sides button{padding:4px}.sides button i{font-size:24px}.lvls button{height:42px}.go2{height:52px}.tpan{gap:7px}#title{flex-direction:row;justify-content:flex-end;align-items:center;background:linear-gradient(90deg,rgba(7,10,26,0) 30%,rgba(7,10,26,.82) 50%,rgba(7,10,26,.96))}.logo{right:auto;left:max(16px,env(safe-area-inset-left));top:auto;bottom:18px;width:auto;text-align:left}.tpan{width:min(460px,56vw)}#bSpk{bottom:max(110px,calc(env(safe-area-inset-bottom) + 100px));right:max(110px,env(safe-area-inset-right))}#bNit{bottom:max(110px,calc(env(safe-area-inset-bottom) + 100px));right:max(18px,env(safe-area-inset-right))}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="edge"></div><div id="flash"></div>
<div class="top" id="hud" hidden>
  <button class="rb" id="pauseBtn"></button>
  <div class="pill"><b id="objTxt" style="direction:ltr"></b><small id="objSub"></small></div>
  <div class="pill"><b id="timeTxt" style="direction:ltr">0:00</b><div class="hp"><i id="hpI"></i></div></div>
  <div class="sp"></div>
  <div class="pill" id="heatP"><b class="heat" id="heatTxt"></b><small id="heatSub"></small></div>
</div>
<canvas class="mini" id="mini" width="232" height="232" hidden></canvas>
<div class="spd" id="spd" hidden><b id="spdTxt">0</b><small>km/h</small><div class="nitro"><i id="nitI"></i></div></div>
<div class="bust" id="bustW" hidden><span id="bustS"></span><div><i id="bustI"></i></div></div>
<div class="msg" id="msg"></div>
<div class="cd" id="cd"></div>
<div class="ctl" id="cL" hidden><button class="st" id="bL">◀</button><button class="st" id="bR">▶</button></div>
<div class="ctl" id="cR" hidden><button id="bBrk">⏪</button><button id="bGas">⏩</button></div>
<button class="side" id="bNit" hidden>⚡</button>
<button class="side" id="bSpk" hidden>🚧<small id="spkN">3</small></button>
<div id="toast"></div>
<section class="scr" id="title" hidden>
  <button class="rb homeT" id="homeT" hidden></button>
  <h1 class="logo"><span class="a">SIREN</span><span class="b">RUSH</span></h1>
  <div class="tpan">
    <div class="sides" id="sides"></div>
    <div class="brief" id="brief"></div>
    <div class="lvls" id="lvls"></div>
    <div class="vsel"><button class="ar" id="vPrev">◀</button><div class="vmid"><b id="vName"></b><p id="vDesc"></p><div class="bars" id="vBars"></div></div><button class="ar" id="vNext">▶</button></div>
    <button class="go2" id="goBtn"></button>
    <div class="trow"><button class="chip" id="qBtn"></button><button class="chip" id="sndBtn2"></button></div>
  </div>
</section>
<div class="sheet" id="endSheet" hidden><div class="card"><h3 id="eT"></h3><div class="stars" id="eStars"><i>⭐</i><i>⭐</i><i>⭐</i></div><p id="eP"></p><ul class="stats" id="eRes"></ul><div class="row"><button class="btn" id="eMap"></button><button class="btn" id="eAgain"></button><button class="btn pri" id="eNext"></button></div></div></div>
<div class="sheet" id="pauseSheet" hidden><div class="card"><h3 id="pT"></h3><div class="row"><button class="btn" id="pMap"></button><button class="btn" id="pRestart"></button><button class="btn pri" id="pGo"></button></div></div></div>
<div id="loading"><div><div class="sp"></div>…</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="chase/game.js"></script>
</body>
</html>
