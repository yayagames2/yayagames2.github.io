<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>html,body{margin:0;background:#000}</style>
<title>Jeti Jump</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@500;700;800&display=swap">
<style>
/* Layout: one full-screen canvas world; DOM overlays for menus/HUD; touch pads pinned to the bottom corners. */
:root{
  --ink:#10162f; --panel:#18224a; --panel2:#22306a; --line:rgba(255,255,255,.14);
  --fg:#f4f6ff; --muted:#a9b3dd; --jet:#ffd23f; --flame:#ff7a2f; --mint:#3fe0b0; --rose:#ff5d73;
  --display:"Secular One","Assistant",system-ui,sans-serif; --body:"Assistant",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;direction:rtl}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
button{font-family:var(--body);cursor:pointer}
button:focus-visible{outline:3px solid var(--jet);outline-offset:2px}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow-y:auto;z-index:5}
.dim{background:linear-gradient(180deg,rgba(10,14,36,.35),rgba(10,14,36,.82))}
.logo{position:relative;font-family:var(--display);font-size:clamp(70px,24vw,128px);line-height:.95;letter-spacing:2px;margin-top:3vh;transform:rotate(-5deg);animation:logoIn .9s cubic-bezier(.2,1.5,.4,1) both, logoBob 3.2s ease-in-out .9s infinite}
.logo .lt{display:block;background:linear-gradient(180deg,#fff6c2 0%,#ffd23f 38%,#ff9a1f 70%,#ff6a1a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #4a1a00;paint-order:stroke fill;filter:drop-shadow(0 6px 0 #8a2a00) drop-shadow(0 14px 18px rgba(0,0,0,.45))}
.logo .sh{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:logoShine 3.6s ease-in-out infinite;pointer-events:none}
@keyframes logoIn{0%{transform:scale(.3) rotate(-25deg);opacity:0}}
@keyframes logoBob{50%{transform:rotate(-3deg) translateY(-6px)}}
@keyframes logoShine{0%,60%{background-position:130% 0}100%{background-position:-130% 0}}
.logo small{display:block;width:max-content;margin:4px auto 0;font-family:var(--body);font-weight:800;font-size:.17em;color:#fff;letter-spacing:7px;padding:5px 14px 5px 7px;border-radius:99px;background:linear-gradient(90deg,#3fb6ff,#7a5cff);box-shadow:0 4px 0 #2a2a86,0 8px 16px rgba(0,0,0,.35);transform:rotate(3deg)}
.menu{display:grid;gap:10px;width:min(360px,100%);margin-top:auto;margin-bottom:1vh}
.tcorner{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;pointer-events:none;direction:ltr}
.tchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:18px;padding:5px 12px 5px 8px;border-radius:99px;border:3px solid #241544;background:linear-gradient(180deg,#3a2a7a,#251a55);color:#fff;box-shadow:0 3px 0 #120a2a;font-variant-numeric:tabular-nums}
.tchip.gold b{color:#ffd23f}.tchip.fire b{color:#ffb070}
.playbtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 18px;border-radius:24px;border:4px solid #5a2a00;background:linear-gradient(180deg,#fff3a0 0%,#ffd23f 35%,#ffa21f 100%);box-shadow:inset 0 4px 0 rgba(255,255,255,.7),inset 0 -6px 0 rgba(200,90,0,.45),0 7px 0 #5a2a00,0 14px 26px rgba(0,0,0,.4);animation:pulse 1.6s ease-in-out infinite}
.playbtn .pi{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#fff;background:radial-gradient(circle at 35% 30%,#ffb070,#ff5a1f 60%,#c43a00);border:3px solid #5a2a00;box-shadow:inset 0 3px 0 rgba(255,255,255,.4)}
.playbtn .pt{font-family:var(--display);font-size:40px;line-height:1;color:#5a2a00;text-shadow:0 2px 0 rgba(255,255,255,.55)}
.playbtn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);background-size:250% 100%;animation:logoShine 2.8s ease-in-out infinite;pointer-events:none}
.playbtn:active{transform:translateY(5px);box-shadow:inset 0 4px 0 rgba(255,255,255,.7),0 2px 0 #5a2a00}
.dailybtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;border:3px solid #064a42;background:linear-gradient(180deg,#5ff0c8,#18b89a);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 5px 0 #064a42,0 10px 18px rgba(0,0,0,.3);color:#04302a;text-align:right}
.dailybtn:active{transform:translateY(4px);box-shadow:0 1px 0 #064a42}
.dailybtn .di{width:42px;height:42px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 3px 0 rgba(0,0,0,.15);flex:none}
.dailybtn .dt{flex:1;display:grid}.dailybtn b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1}.dailybtn small{font-weight:800;font-size:12.5px;opacity:.75}
.dailybtn .tag{background:#04302a;color:#5ff0c8;font-weight:800;font-size:12px;border-radius:99px;padding:4px 10px;flex:none}
#diffSeg{background:rgba(20,12,50,.75);border:3px solid #241544;border-radius:18px;padding:5px;gap:6px;box-shadow:0 4px 0 #120a2a}
#diffSeg button{display:flex;align-items:center;justify-content:center;gap:5px;border-radius:12px;padding:8px 4px;font-family:var(--display);font-weight:400;font-size:17px;color:rgba(255,255,255,.55);background:transparent;transition:transform .15s}
#diffSeg button i{font-style:normal;font-size:18px;filter:grayscale(.7);opacity:.7}
#diffSeg button[aria-pressed=true]{color:#fff;transform:translateY(-2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 rgba(0,0,0,.35)}
#diffSeg button[aria-pressed=true] i{filter:none;opacity:1}
#diffSeg .d-easy[aria-pressed=true]{background:linear-gradient(180deg,#6fe07a,#2fa84f)}
#diffSeg .d-normal[aria-pressed=true]{background:linear-gradient(180deg,#ffc94f,#f08a1a)}
#diffSeg .d-hard[aria-pressed=true]{background:linear-gradient(180deg,#ff7a85,#d9283a)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:82px;border-radius:20px;border:3px solid rgba(0,0,0,.45);color:#fff;font-family:var(--display);font-size:16px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 rgba(0,0,0,.45),0 10px 16px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.tile i{font-style:normal;font-size:30px;line-height:1}
.tile canvas{width:46px;height:46px}
.t-hero{background:linear-gradient(180deg,#a98bff,#6a3fe0)}.t-shop{background:linear-gradient(180deg,#ff8fc8,#e0408a)}.t-sound{background:linear-gradient(180deg,#6fc8ff,#2a7ae0)}
.t-sound[aria-pressed=false]{filter:grayscale(.8) brightness(.8)}
.credit{text-align:center;color:rgba(255,255,255,.6);font-size:11px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.big{font-family:var(--display);font-size:26px;padding:16px;position:relative;overflow:hidden;border-radius:18px;border:0;color:#3a1600;background:linear-gradient(180deg,#ffe46b,#ffb322);box-shadow:0 6px 0 #c47a0c,0 12px 24px rgba(0,0,0,.35)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c47a0c}
#bPlay{animation:pulse 1.6s ease-in-out infinite}
#bPlay::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);background-size:250% 100%;animation:logoShine 2.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.035)}}
.mid{font-family:var(--display);font-size:19px;padding:13px;border-radius:16px;border:2px solid var(--line);color:var(--fg);background:rgba(24,34,74,.88);display:flex;align-items:center;justify-content:center;gap:10px}
.mid .tag{font-family:var(--body);font-weight:800;font-size:12px;background:var(--mint);color:#06352a;border-radius:99px;padding:2px 8px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.topbar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:560px;gap:10px}
.topbar h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.ic{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:rgba(24,34,74,.9);color:var(--fg);font-size:20px;display:grid;place-items:center;flex:none}
.wallet{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:17px;background:rgba(24,34,74,.9);border:2px solid rgba(255,210,63,.5);border-radius:99px;padding:6px 14px;color:var(--jet);font-variant-numeric:tabular-nums}
.coin{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffd23f 42%,#c98a0e 78%);box-shadow:inset 0 0 0 2px rgba(140,90,0,.5);flex:none}
.worlds{display:flex;gap:8px;width:100%;max-width:560px;margin:16px 0 12px;overflow-x:auto;padding-bottom:4px}
.worlds button{flex:1;min-width:110px;border-radius:14px;border:2px solid var(--line);padding:10px 8px;color:var(--fg);background:rgba(24,34,74,.85);font-weight:800;font-size:14px}
.worlds button[aria-pressed=true]{border-color:var(--jet);background:var(--panel2)}
.worlds button .wi{display:block;font-size:22px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:560px}
.lv{aspect-ratio:1/1.05;border-radius:18px;border:0;color:#fff;font-family:var(--display);font-size:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.lv small{font-family:var(--body);font-size:12px;font-weight:800;opacity:.85;font-variant-numeric:tabular-nums}
.lv .st{font-size:15px;letter-spacing:2px;color:rgba(255,255,255,.25)}
.lv .st b{color:var(--jet);font-weight:400}
.lv.lock{filter:grayscale(.85) brightness(.6)}
.lv.lock::after{content:"🔒";position:absolute;font-size:26px}
.hint{color:var(--muted);font-size:14px;text-align:center;max-width:420px;margin:14px 0 0}
/* HUD */
#hud{position:absolute;inset:0 0 auto 0;z-index:4;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;direction:ltr}
.hb{display:flex;gap:6px;align-items:center;pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(10,14,36,.55);border-radius:99px;padding:4px 9px;font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;backdrop-filter:blur(4px)}
.hearts{font-size:12px;letter-spacing:0}
.stars3{color:rgba(255,255,255,.28);font-size:15px;letter-spacing:1px}
.stars3 b{color:var(--jet);font-weight:400}
.bossbar{position:absolute;left:50%;top:calc(98px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(300px,70vw);text-align:center;direction:rtl}
.bossbar b{display:block;font-family:var(--display);font-weight:400;font-size:16px;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.bossbar span{display:block;height:12px;border-radius:9px;background:rgba(10,14,36,.7);border:2px solid rgba(255,255,255,.5);overflow:hidden}
.bossbar i{display:block;height:100%;background:linear-gradient(90deg,#ff5d73,#ffb322);transition:width .25s}
.fuel{width:40px;height:7px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.fuel i{display:block;height:100%;background:linear-gradient(90deg,#ff7a2f,#ffd23f);border-radius:9px}
/* touch pads */
#pads{position:absolute;inset:auto 0 0 0;z-index:4;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none;direction:ltr}
.pad{pointer-events:auto;touch-action:none;width:78px;height:78px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(10,14,36,.42);color:#fff;font-size:30px;display:grid;place-items:center;backdrop-filter:blur(3px)}
.pad.on{background:rgba(255,210,63,.45);border-color:var(--jet)}
.pad.jump{width:96px;height:96px;font-family:var(--display);font-size:17px;background:rgba(255,122,47,.45);border-color:rgba(255,210,63,.8)}
.dpad{display:flex;gap:14px}
.pad.fire{width:70px;height:70px;font-size:28px;background:rgba(255,90,40,.45);border-color:#ffb322;margin-bottom:30px}
.pad.fire.ice{background:rgba(79,195,255,.45);border-color:#bff0ff}
@media (hover:hover) and (pointer:fine){ #pads{opacity:.35} }
/* panels */
.card{width:min(420px,100%);background:linear-gradient(180deg,#1e2a5c,#141c40);border:2px solid var(--line);border-radius:24px;padding:22px 20px;box-shadow:0 24px 60px rgba(0,0,0,.5);display:grid;gap:14px;margin:auto 0;text-align:center}
.card h3{font-family:var(--display);font-weight:400;font-size:30px;margin:0;text-wrap:balance}
.bigstars{font-size:46px;letter-spacing:6px;color:rgba(255,255,255,.18)}
.bigstars b{color:var(--jet);font-weight:400;display:inline-block;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.bigstars b:nth-child(2){animation-delay:.15s}.bigstars b:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:rgba(0,0,0,.25);border-radius:14px;padding:10px 4px}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted);font-weight:700}
.badge{justify-self:center;font-weight:800;font-size:13px;padding:5px 12px;border-radius:99px;background:rgba(63,224,176,.16);color:var(--mint);border:1px solid rgba(63,224,176,.4)}
.badge.new{background:rgba(255,210,63,.16);color:var(--jet);border-color:rgba(255,210,63,.5)}
.share{font-size:13px;color:var(--muted);background:rgba(0,0,0,.25);border-radius:12px;padding:10px;white-space:pre-line;direction:rtl;text-align:right;user-select:text;-webkit-user-select:text}
a.mid{text-decoration:none}
/* shop */
.tabs{display:flex;gap:8px;width:100%;max-width:560px;margin:14px 0}
.tabs button{flex:1;border-radius:12px;border:2px solid var(--line);background:rgba(24,34,74,.85);color:var(--fg);padding:9px;font-weight:800;font-size:15px}
.tabs button[aria-pressed=true]{border-color:var(--jet)}
.shopprev{width:min(560px,100%);height:150px;border-radius:20px;background:radial-gradient(70% 90% at 50% 100%,rgba(255,210,63,.25),transparent 70%),rgba(24,34,74,.7);border:2px solid var(--line);display:block}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:560px}
.it{border-radius:16px;border:2px solid var(--line);background:rgba(24,34,74,.85);color:var(--fg);padding:12px 6px;display:grid;gap:6px;justify-items:center;font-weight:800;font-size:13px}
.it .sw{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.25)}
.it.eq{border-color:var(--mint)}
.it small{display:inline-flex;align-items:center;gap:4px;color:var(--jet);font-variant-numeric:tabular-nums}
.it.eq small{color:var(--mint)}
.toast{position:absolute;left:50%;top:calc(150px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:20;background:#0d1330;border:2px solid var(--jet);color:var(--fg);border-radius:14px;padding:9px 16px;font-weight:800;font-size:15px;animation:tin .25s ease-out;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}
#rot{display:none}
.seg{display:flex;background:rgba(10,14,36,.6);border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:12px;padding:10px 4px;background:transparent;color:var(--muted);font-weight:800;font-size:15px}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 2px var(--jet)}
.heroes{display:grid;gap:12px;width:100%;max-width:560px;margin-top:16px}
.hero{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:14px;border-radius:20px;border:2px solid var(--line);background:rgba(24,34,74,.88);color:var(--fg);padding:10px 14px;text-align:right}
.hero[aria-pressed=true]{border-color:var(--jet);background:var(--panel2)}
.hero canvas{width:110px;height:110px;border-radius:16px;background:radial-gradient(70% 70% at 50% 85%,rgba(255,210,63,.25),transparent 70%),rgba(0,0,0,.2)}
.hero b{font-family:var(--display);font-weight:400;font-size:24px;display:block}
.hero span{color:var(--muted);font-size:14px;font-weight:700}
.hero em{font-style:normal;font-size:12px;font-weight:800;color:var(--mint)}
@media (prefers-reduced-motion:reduce){ .bigstars b,.toast,.logo,.logo .sh,#bPlay,#bPlay::after{animation:none} }
</style>

<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div class="hb">
      <button class="ic" id="pauseBtn" aria-label="إيقاف مؤقت" style="width:40px;height:40px">⏸</button>
      <span class="chip hearts" id="hHearts">❤️❤️❤️</span>
      <span class="chip"><span class="fuel"><i id="hFuel"></i></span></span>
      <span class="chip" id="hPow" hidden></span>
    </div>
    <div class="bossbar" id="bossBar" hidden><b id="bossName"></b><span><i id="bossHp"></i></span></div>
    <div class="hb">
      <span class="chip stars3" id="hStars"></span>
      <span class="chip"><i class="coin"></i><b id="hCoins">0</b></span>
      <span class="chip" id="hTime">0:00</span>
    </div>
  </div>

  <div id="pads" hidden>
    <div class="dpad"><button class="pad" id="padL" aria-label="يسار">◀</button><button class="pad" id="padR" aria-label="يمين">▶</button></div>
    <div class="dpad" style="align-items:flex-end"><button class="pad fire" id="padF" aria-label="نار" hidden>🔥</button><button class="pad jump" id="padJ" aria-label="قفز">قفز</button></div>
  </div>

  <!-- title -->
  <section class="scr" id="sTitle">
    <div class="logo"><span class="lt">جيتي</span><span class="sh" aria-hidden="true">جيتي</span><small>JETI JUMP</small></div>
    <div class="tcorner"><span class="tchip gold"><i class="coin"></i><b id="tCoins">0</b></span><span class="tchip fire">🔥<b id="tStreak">0</b></span></div>
    <div class="menu">
      <button class="playbtn" id="bPlay"><span class="pi">▶</span><span class="pt">العب</span></button>
      <button class="dailybtn" id="bDaily"><span class="di">📅</span><span class="dt"><b>التحدي اليومي</b><small>مسار جديد للجميع كل يوم</small></span><span class="tag" id="dailyTag">جديد</span></button>
      <div class="seg" id="diffSeg" role="group" aria-label="الصعوبة"><button data-m="easy" class="d-easy"><i>😊</i>سهل</button><button data-m="normal" class="d-normal"><i>😎</i>عادي</button><button data-m="hard" class="d-hard"><i>🔥</i>صعب</button></div>
      <div class="tiles"><button class="tile t-hero" id="bHero"><canvas id="heroMini"></canvas><span id="heroName">جيتي</span></button><button class="tile t-shop" id="bShop"><i>🛍️</i><span>المتجر</span></button><button class="tile t-sound" id="bSound" aria-pressed="true"><i id="soundIc">🔊</i><span>الصوت</span></button></div>
      <small class="credit">الرسومات: Kenney.nl (CC0)</small>
    </div>
  </section>

  <!-- character select -->
  <section class="scr dim" id="sHero" hidden>
    <div class="topbar"><button class="ic" data-back aria-label="رجوع">→</button><h2>اختر بطلًا</h2><span style="width:46px"></span></div>

// each level in a world has its own route style, so the paths feel different
const STYLES=[
 {n:'كلاسيكي',w:{flat:2,step:2,gap:3,plats:2,crates:2,spikes:2,spring:1,enemy:3,flyer:1,mover:1,tower:1,pillars:1,pool:1,powerbox:1}},

 {n:'مسار العوائق',w:{enemy:5,turret:3,spikes:3,pool:2,gap:2,crumble:2,flyer:2,powerbox:2,crates:1}},
 {n:'التسلق',w:{tower:4,zigzag:4,pyramid:3,spring:3,pillars:2,islands:2,enemy:2,powerbox:1}}

function gtop(c){ let y=R-1; if(c[y]!=='#') return R; while(y>0&&c[y-1]==='#') y--; return y; }
function genLevel(seed,diff,len,theme,style,boss){
  const r=rng(seed), cols=[], ents=[], movers=[]; let g=10, coins=0;
  const ri=(a,b)=>a+Math.floor(r()*(b-a+1));
  const col=top=>{ const c=new Array(R).fill('.'); for(let y=top;y<R;y++) c[y]='#'; cols.push(c); return c; };
  const put=(x,y,ch)=>{ if(x>=0&&x<cols.length&&y>=0&&y<R){ if(ch==='o'&&cols[x][y]!=='.') return; cols[x][y]=ch; if(ch==='o') coins++; } };
  const W_=WORLDS[theme];
  for(let i=0;i<7;i++) col(g);
  const starAt=[]; const chunkLog=[];
  const ST=STYLES[(style??0)%STYLES.length], bag=[]; for(const k in ST.w) for(let i=0;i<ST.w[k];i++) bag.push(k);
  const pickE=()=>{ const L=W_.enemies.filter(e=>diff>.25||e==='w'||e==='f'||e==='m'); return L[Math.floor(r()*L.length)]; };
  let lastType='', nChunk=0, powers=0;
  while(cols.length<len){
    let t=bag[Math.floor(r()*bag.length)];
    if(nChunk===2&&powers===0) t='powerbox';
    if(t===lastType&&t!=='cave') t=r()<.5?'flat':'gap';
    if(diff<.15&&(t==='mover'||t==='tower'||t==='turret')) t='gap';
    nChunk++;
    lastType=t; const x0=cols.length; let star=null;
    if(t==='flat'){ const n=ri(4,6); for(let i=0;i<n;i++){ col(g); if(i>0&&i<n-1&&r()<.7) put(x0+i,g-2,'o'); } }
    else if(t==='step'){ g=Math.max(6,Math.min(11,g+(r()<.5?-1:1)*ri(1,2))); const n=ri(3,5); for(let i=0;i<n;i++){ col(g); } put(x0+1,g-2,'o'); }
    else if(t==='gap'){ col(g); const w=2+Math.min(2,Math.floor(r()*(1+diff*2.4))); for(let i=0;i<w;i++) col(R); for(let i=0;i<3;i++) col(g);
      for(let i=0;i<w;i++) put(x0+1+i,g-3-(i===0||i===w-1?0:1),'o'); star=[x0+1+Math.floor(w/2),g-5]; }
    else if(t==='plats'){ col(g); const n=ri(5,7); for(let i=0;i<n;i++) col(R); for(let i=0;i<3;i++) col(g);
      let py=g-2; for(let i=1;i<n;i+=3){ py=Math.max(3,g-2-ri(0,2)); put(x0+i,py,'='); put(x0+i+1,py,'='); put(x0+i,py-1,'o'); put(x0+i+1,py-1,'o'); } star=[x0+Math.floor(n/2)+1,py-3]; }
    else if(t==='crates'){ const n=6; for(let i=0;i<n;i++) col(g); for(let i=1;i<4;i++) put(x0+i,g-4,'B'); put(x0+5,g-4,'B'); if(r()<.4){ put(x0+2,g-4,'P'); powers++; } star=[x0+2,g-6]; put(x0+4,g-2,'o'); }
    else if(t==='spikes'){ const n=7; for(let i=0;i<n;i++) col(g); const k=diff>.5?2:1; for(let i=0;i<k;i++) put(x0+3+i,g-1,'^'); for(let i=0;i<k+2;i++) put(x0+2+i,g-3,'o'); }
    else if(t==='spring'){ for(let i=0;i<4;i++) col(g); put(x0+2,g-1,'S'); const g2=Math.max(4,g-5); for(let i=0;i<5;i++) col(g2); g=g2; put(x0+5,g-2,'o'); put(x0+6,g-2,'o'); star=[x0+2,g2-3]; }
    else if(t==='enemy'){ const n=8; for(let i=0;i<n;i++) col(g); { const a=pickE(); ents.push({t:a,x:(x0+4)*T,y:(g-(a==='d'?4:1))*T}); } if(diff>.4){ const b2=pickE(); ents.push({t:b2,x:(x0+6)*T,y:(g-(b2==='d'?4:1))*T}); } put(x0+2,g-2,'o'); put(x0+3,g-2,'o'); }
    else if(t==='flyer'){ col(g); const w=3; for(let i=0;i<w;i++) col(R); for(let i=0;i<4;i++) col(g); ents.push({t:r()<.5&&W_.enemies.includes('d')?'d':'f',x:(x0+2)*T,y:(g-5)*T}); for(let i=0;i<w;i++) put(x0+1+i,g-3,'o'); }
    else if(t==='mover'){ col(g); const n=ri(6,8); for(let i=0;i<n;i++) col(R); for(let i=0;i<3;i++) col(g); movers.push({x:(x0+1.5)*T,y:(g-1)*T,a:(x0+1.2)*T,b:(x0+n-1.2)*T,v:60+diff*40,w:T*2.6}); for(let i=2;i<n-1;i+=2) put(x0+i,g-3,'o'); star=[x0+Math.floor(n/2),g-6]; }
    else if(t==='tower'){ for(let i=0;i<3;i++) col(g); const g2=Math.max(4,g-ri(3,4)); for(let i=0;i<5;i++) col(g2); for(let i=0;i<3;i++) put(x0+1,g2-1-i,'o'); g=g2; star=[x0+4,g2-4]; }
    else if(t==='powerbox'){ const n=5; for(let i=0;i<n;i++) col(g); put(x0+1,g-4,'B'); put(x0+2,g-4,'P'); put(x0+3,g-4,'B'); powers++; }
    else if(t==='pillars'){ col(g); const n=ri(3,5); let lastH=g; for(let i=0;i<n;i++){ const h=Math.max(4,Math.min(11,g-ri(0,3)+ri(0,1))); const pw=ri(1,2); for(let k=0;k<pw;k++) col(h); put(x0+1+i*3,h-2,'o'); if(r()<.6) col(R); else col(h); lastH=h; } g=lastH; for(let i=0;i<2;i++) col(g); star=[x0+3,Math.max(1,g-6)]; }
    else if(t==='pyramid'){ for(let i=0;i<2;i++) col(g); const hgt=ri(3,4); for(let i=1;i<=hgt;i++){ col(Math.max(3,g-i)); put(cols.length-1,g-i-2,'o'); } col(Math.max(3,g-hgt)); for(let i=hgt;i>=1;i--) col(Math.max(3,g-i)); for(let i=0;i<2;i++) col(g); star=[x0+2+hgt,g-hgt-4]; }
    else if(t==='islands'){ col(g); const n=ri(3,4); let ih=g; for(let i=0;i<n;i++){ for(let k=0;k<2;k++) col(R); ih=Math.max(4,Math.min(10,g-ri(-1,3))); const w2=ri(2,3); for(let k=0;k<w2;k++){ const c=col(R); for(let y=ih;y<Math.min(R,ih+2);y++) c[y]='#'; } put(cols.length-2,ih-2,'o'); if(i===1&&r()<.5){ put(cols.length-1,ih-1,'S'); } }
      for(let k=0;k<2;k++) col(R); for(let i=0;i<3;i++) col(g); star=[x0+5,Math.max(1,ih-5)]; }
    else if(t==='cave'){ const n=ri(8,11), roof=Math.max(1,g-4); for(let i=0;i<n;i++){ const c=col(g); for(let y=0;y<=roof;y++) c[y]='#'; if(i%2) put(x0+i,g-2,'o'); }
      { let a=pickE(); if(a==='t'||a==='d'||a==='f') a='w'; ents.push({t:a,x:(x0+Math.floor(n/2))*T,y:(g-1)*T}); } if(r()<.5){ put(x0+3,roof,'B'); } star=null; }
    else if(t==='crumble'){ col(g); const n=ri(5,7); for(let i=0;i<n;i++){ const c=col(R); c[g]='x'; } for(let i=0;i<3;i++) col(g); for(let i=1;i<n;i+=2) put(x0+1+i,g-2,'o'); star=[x0+1+Math.floor(n/2),g-4]; }
    else if(t==='pool'){ col(g); const n=ri(3,4); for(let i=0;i<n;i++){ const c=col(g+1); c[g]='L'; } for(let i=0;i<3;i++) col(g); put(x0+1+Math.floor(n/2),g-4,'='); put(x0+Math.floor(n/2),g-4,'='); for(let i=0;i<n;i++) put(x0+1+i,g-3,'o'); }
    else if(t==='zigzag'){ col(g); const n=ri(4,5); let py=g-2; for(let i=0;i<n;i++){ col(g); col(g); py=Math.max(2,py-(i%2?1:2)); const xx=cols.length-2+(i%2); put(xx,py,'='); put(xx+ (i%2?-1:1),py,'='); put(xx,py-1,'o'); } for(let i=0;i<2;i++) col(g); star=[x0+n*2,Math.max(1,py-3)]; }
    else if(t==='turret'){ for(let i=0;i<3;i++) col(g); const c=col(g-2); for(let i=0;i<5;i++) col(g); ents.push({t:'t',x:(x0+3)*T,y:(g-3)*T}); put(x0+5,g-3,'o'); put(x0+6,g-3,'o'); }
    if(star) starAt.push(star);
    chunkLog.push(t);
    // keep ground from getting too low after drops
    if(r()<.25&&g<8){ g++; }
  }
  // top up enemies so every route has a lively mix
  { const want=Math.round(5+diff*9); const xs=[]; for(let x=10;x<cols.length-6;x++) xs.push(x); for(let i=xs.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [xs[i],xs[j]]=[xs[j],xs[i]]; }
    for(const x of xs){ if(ents.length>=want) break; if(ents.some(e=>Math.abs(e.x/T-x)<5)) continue; const c=cols[x], gy=gtop(c);
      if(gy<R&&gy>3&&gtop(cols[x-1])===gy&&gtop(cols[x+1])===gy&&c[gy-1]==='.'&&c[gy-2]==='.'&&c[gy-3]==='.'){ let a=pickE(); if(a==='f') a='w'; ents.push({t:a,x:x*T,y:(gy-(a==='d'?4:1))*T}); }
      else if(gy===R&&cols[x].slice(2,7).every(v=>v==='.')){ ents.push({t:W_.enemies.includes('d')&&r()<.5?'d':'f',x:x*T,y:4*T}); } } }
  // checkpoint in the middle on solid ground
  const mid=Math.floor(cols.length/2); for(let x=mid;x<cols.length&&!boss;x++){ const gy=gtop(cols[x]); if(gy>2&&gy<R&&cols[x-1]&&gtop(cols[x-1])===gy&&cols[x][gy-1]==='.'&&cols[x][gy-2]==='.'){ cols[x][gy-1]='C'; break; } }
  let arena=null; const routeEnd=cols.length;
  if(boss){ // a closed arena: flat floor, two floating power boxes, the exit door appears after the fight
    g=Math.max(8,Math.min(10,g)); for(let i=0;i<4;i++) col(g); const cpx=cols.length-2; cols[cpx][g-1]='C';
    for(let i=0;i<3;i++) col(g); const A=cols.length, AW=24; for(let i=0;i<AW;i++) col(g);
    put(A+4,g-4,'P'); put(A+AW-5,g-4,'P'); put(A+3,g-4,'='); put(A+5,g-4,'='); put(A+AW-6,g-4,'='); put(A+AW-4,g-4,'=');
    cols[A+AW-3][g-1]='f'; cols[A+AW-3][g-2]='f'; for(let i=0;i<2;i++) col(0); arena={a:A,b:A+AW,g};
  } else {
  // end: flat run with finish portal
  for(let i=0;i<9;i++) col(g); cols[cols.length-5][g-1]='F'; cols[cols.length-5][g-2]='F';
  for(let i=0;i<2;i++){ const c=col(0); } }
  // three stars: early / middle / late candidates
  const pick=[]; if(starAt.length){ const n=starAt.length; [0.15,0.5,0.85].forEach(f=>{ const s=starAt[Math.min(n-1,Math.floor(f*n))]; if(s&&!pick.includes(s)) pick.push(s); }); }
  for(let guard=0;pick.length<3&&guard<400;guard++){ const x=10+Math.floor(r()*(routeEnd-20)); const gy=gtop(cols[x]); if(gy>4&&gy<R&&cols[x][gy-4]==='.') pick.push([x,gy-4]); }
  pick.slice(0,3).forEach(([x,y],i)=>{ x=Math.max(8,Math.min(routeEnd-4,x)); y=Math.max(1,Math.min(R-2,y)); let k=0; while(cols[x][y]!=='.'&&k<12){ y=y>1?y-1:R-2; k++; } cols[x][y]='*'+i; });
  return {cols,ents,movers,coins,len:cols.length,arena};
}

function drawHero(c,x,y,face,t,st,sk,ch){ // x,y = feet centre in world units

function collideX(p){
  const y0=Math.floor((p.y-p.h+2)/T), y1=Math.floor((p.y-2)/T);
  if(p.vx>0){ const cx2=Math.floor((p.x+p.w/2)/T); for(let y=y0;y<=y1;y++) if(solidAt(cx2,y)){ p.x=cx2*T-p.w/2-.01; p.vx=0; break; } }
  else if(p.vx<0){ const cx2=Math.floor((p.x-p.w/2)/T); for(let y=y0;y<=y1;y++) if(solidAt(cx2,y)){ p.x=(cx2+1)*T+p.w/2+.01; p.vx=0; break; } }
  if(p.x<p.w/2) p.x=p.w/2;
}
function collideY(p,prevB){

  if(p.vy>0){ const cy2=Math.floor(p.y/T);
    for(let x=x0;x<=x1;x++){ const ch=cell(x,cy2); if(solidAt(x,cy2)||(ch==='='&&prevB<=cy2*T+2)){ p.y=cy2*T; p.vy=0; p.onG=true; return; } } }
  else if(p.vy<0){ const cy2=Math.floor((p.y-p.h)/T);
    for(let x=x0;x<=x1;x++) if(solidAt(x,cy2)){ p.y=(cy2+1)*T+p.h; p.vy=60;
      const c=G.cols[x]; if(c&&c[cy2]==='P'){ c[cy2]='b'; G.items.push({type:(x+G.l)%2?'ice':'fire',x:x*T+16,y:cy2*T,vx:70,vy:-380}); SFX.spring(); burst(x*T+16,cy2*T,10,['#c38bff','#fff','#ffd23f'],150); }
      else if(c&&c[cy2]==='B'){ c[cy2]='b'; G.coins+=1; SFX.coin(); G.pops.push({x:x*T+16,y:cy2*T-6,t:0,txt:'+1',coin:1}); burst(x*T+16,cy2*T,6,['#ffd23f','#c98c48'],120); } else SFX.bump();
      return; } }
}

    const nStars=g.stars.filter(Boolean).length, underPar=g.t<=g.par;
    let bonus=nStars*10+(underPar?20:0), gained=g.coins+bonus, newBest=false, msg='';
    if(g.daily){ const d=SAVE.daily[g.daily]||{}; newBest=!d.best||g.t<d.best; SAVE.daily[g.daily]={best:newBest?g.t:d.best,stars:Math.max(d.stars||0,nStars)}; touchStreak(); }
    else{ const k=key(g.w,g.l), pr=SAVE.prog[k]||{stars:[0,0,0]}; const st=pr.stars.map((s,i)=>s||g.stars[i]?1:0); newBest=!pr.best||g.t<pr.best; SAVE.prog[k]={stars:st,best:newBest?g.t:pr.best,done:1}; touchStreak();
      if(g.l===LEVELS-1&&g.w<WORLDS.length-1&&!SAVE.prog['u'+(g.w+1)]){ SAVE.prog['u'+(g.w+1)]=1; msg=`<span class="badge new">🎉 هُزم الزعيم! فُتح عالم جديد: ${WORLDS[g.w+1].name}</span>`; } }
    SAVE.coins+=gained; store();
    const shareTxt=g.daily?`جيتي – التحدي اليومي ${g.daily.split('-').reverse().join('.')}\n⏱ ${fmt(g.t)}  ${'⭐'.repeat(nStars)}${'☆'.repeat(3-nStars)}\nهل تستطيع هزيمتي؟ 🚀`:'';
    html=`<h3>${g.daily?'اكتمل التحدي اليومي!':'اجتزت المرحلة!'}</h3><span class="badge" style="background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--line)">${HM().n} · ${g.daily?'عادي (التحدي اليومي)':g.dm.n} · ${g.th.n}</span>
      <div class="bigstars">${g.stars.map(s=>s?'<b>★</b>':'★').join('')}</div>
      <div class="stats"><div><b>${fmt(g.t)}</b><span>الوقت</span></div><div><b>${fmt(g.par)}</b><span>الوقت المستهدف</span></div><div><b>+${gained}</b><span>عملات</span></div></div>
      ${newBest?'<span class="badge new">🏆 رقم قياسي شخصي جديد!</span>':''}${underPar?'<span class="badge">⏱ تحت الوقت المستهدف: +20 عملة</span>':''}${msg}
      ${g.daily?`<div class="share" id="shareTxt">${shareTxt}</div><div class="row"><button class="mid" id="eCopy">📋 نسخ</button><a class="mid" href="https://wa.me/?text=${encodeURIComponent(shareTxt)}" target="_blank" rel="noopener">💬 واتساب</a></div>`:''}
      ${!g.daily&&nextLevel()?'<button class="big" id="eNext">▶ المرحلة التالية</button>':''}
      <div class="row"><button class="mid" id="eRetry">↻ مجددًا</button><button class="mid" id="eMap">${g.daily?'🏠 القائمة':'🗺️ المستويات'}</button></div>`;
  }
  card.innerHTML=html; setMode('end');
  const on=(id,f)=>{ const b=$(id); if(b) b.onclick=f; };
  on('eRetry',()=>startLevel(g.w,g.l,g.daily)); on('eMap',()=>{ G=null; g.daily?setMode('title'):openMap(g.w); });
  on('eNext',()=>{ const n=nextLevel(); startLevel(n[0],n[1]); });
  on('eCopy',()=>{ const txt=$('shareTxt').textContent; (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('✓ تم النسخ – الصقه في محادثة')).catch(()=>{ const r=document.createRange(); r.selectNodeContents($('shareTxt')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('حدّد وانسخ'); }); });
}
function nextLevel(){ const g=G; if(!g||g.daily) return null; if(g.l<LEVELS-1) return [g.w,g.l+1]; if(g.w<WORLDS.length-1) return [g.w+1,0]; return null; }
function touchStreak(){ const d=today(), y=(()=>{ const t=new Date(Date.now()-864e5); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); })();
  if(SAVE.streak.last===d) return; SAVE.streak.n=SAVE.streak.last===y?SAVE.streak.n+1:1; SAVE.streak.last=d; if([3,7,14,30].includes(SAVE.streak.n)){ SAVE.coins+=SAVE.streak.n*10; toast(`🔥 ${SAVE.streak.n} أيام متتالية! +${SAVE.streak.n*10} عملات`); } }

/* ---------------- menus ---------------- */
let titleK=-1, titleLook=null, titlePrev=null, titleFade=0, TP=[];
let titleTheme=0, titleCam=0, mapWorld=0, shopTab='flame';
function setMode(m){ mode=m;
  $('sTitle').hidden=m!=='title'; $('sHero').hidden=m!=='hero'; $('sMap').hidden=m!=='map'; $('sShop').hidden=m!=='shop'; $('sPause').hidden=m!=='pause'; $('sEnd').hidden=m!=='end';
  $('hud').hidden=!(m==='play'||m==='pause'); $('pads').hidden=m!=='play';
  document.querySelectorAll('.wN').forEach(x=>x.textContent=SAVE.coins); $('tCoins').textContent=SAVE.coins;
  const st=SAVE.streak; const alive=st.last===today()||st.last===(()=>{ const t=new Date(Date.now()-864e5); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); })(); $('tStreak').textContent=alive?st.n:0;
  document.querySelectorAll('#diffSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===SAVE.mode)); $('heroName').textContent=HM().n;
  const dd=SAVE.daily[today()]; $('dailyTag').textContent=dd?('⏱ '+fmt(dd.best)):'جديد';
  if(m!=='play'){ keys.l=keys.r=keys.j=keys.f=0; lastPow='-'; document.querySelectorAll('.pad').forEach(p=>p.classList.remove('on')); }
}
function worldOpen(w){ return w===0||!!SAVE.prog['u'+w]; }
function levelOpen(w,l){ if(!worldOpen(w)) return false; return l===0||!!(SAVE.prog[key(w,l-1)]&&SAVE.prog[key(w,l-1)].done); }
function openMap(w){ mapWorld=w??mapWorld; setMode('map');
  $('worlds').innerHTML=WORLDS.map((W_,i)=>{ const st=Array.from({length:LEVELS},(_,l)=>((SAVE.prog[key(i,l)]||{}).stars||[]).filter(Boolean).length).reduce((a,b)=>a+b,0);
    return `<button data-w="${i}" aria-pressed="${i===mapWorld}"><span class="wi">${worldOpen(i)?W_.ic:'🔒'}</span>${W_.name}<br><small style="color:var(--jet)">★ ${st}/${LEVELS*3}</small></button>`; }).join('');
  const th=WORLDS[mapWorld];
  $('levels').innerHTML=Array.from({length:LEVELS},(_,l)=>{ const pr=SAVE.prog[key(mapWorld,l)]||{}, op=levelOpen(mapWorld,l), st=pr.stars||[0,0,0];
    const lk=lookFor(mapWorld,l);
    return `<button class="lv ${op?'':'lock'}" data-l="${l}" style="background:linear-gradient(180deg,${lk.sky[0]},${lk.sky[1]} 55%,${lk.top||th.top} 56%,${lk.body||th.body} 100%)"><span style="text-shadow:0 2px 6px rgba(0,0,0,.45)">${l===LEVELS-1?'👑':l+1}</span><small style="text-shadow:0 1px 4px rgba(0,0,0,.6)">${l===LEVELS-1?BOSSES[mapWorld].n:lk.n}</small><span class="st">${st.map(s=>s?'<b>★</b>':'★').join('')}</span><small>${pr.best?'⏱ '+fmt(pr.best):'&nbsp;'}</small></button>`; }).join('');
  document.querySelectorAll('#worlds button').forEach(b=>b.onclick=()=>{ const i=+b.dataset.w; if(!worldOpen(i)){ toast('🔒 أنهِ المرحلة 6 من العالم السابق'); return; } openMap(i); beep(600,.05,'triangle',.05); });
  document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{ const l=+b.dataset.l; if(!levelOpen(mapWorld,l)){ toast('🔒 أنهِ المرحلة السابقة'); return; } startLevel(mapWorld,l); });
}
function openShop(){ setMode('shop'); renderShop(); }
function renderShop(){ document.querySelectorAll('#shopTabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===shopTab));
  $('items').innerHTML=SHOP[shopTab].map(it=>{ const own=!!SAVE.own[it.id], eq=SAVE.eq[shopTab]===it.id; const bg=it.c==='rainbow'?'conic-gradient(#ff5d73,#ffd23f,#3fe0b0,#4f8bff,#c38bff,#ff5d73)':it.c;
    return `<button class="it ${eq?'eq':''}" data-id="${it.id}"><span class="sw" style="background:${bg}"></span>${it.n}<small>${eq?'✓ مستخدم':own?'تملكه':`<i class="coin" style="width:13px;height:13px"></i>${it.p}`}</small></button>`; }).join('');
  document.querySelectorAll('.it').forEach(b=>b.onclick=()=>{ const it=SHOP[shopTab].find(x=>x.id===b.dataset.id);
    if(!SAVE.own[it.id]){ if(SAVE.coins<it.p){ toast(`تحتاج ${it.p-SAVE.coins} عملات`); beep(200,.15,'square',.05); return; } SAVE.coins-=it.p; SAVE.own[it.id]=1; SFX.coin(); toast('✓ تم الشراء!'); }
    SAVE.eq[shopTab]=it.id; store(); document.querySelectorAll('.wN').forEach(x=>x.textContent=SAVE.coins); renderShop(); });
}
function drawShopPrev(t){ const c2=$('shopCv'); if($('sShop').hidden) return; const r=c2.getBoundingClientRect(); const d=Math.min(2,devicePixelRatio||1);
  if(c2.width!==Math.round(r.width*d)){ c2.width=Math.round(r.width*d); c2.height=Math.round(r.height*d); }
  const x=c2.getContext('2d'); x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,c2.width,c2.height); const s=c2.height/70; x.setTransform(s,0,0,s,c2.width/2,c2.height-10*d);
  const hover=Math.sin(t*2)*4-6; drawHero(x,0,hover,1,t,{run:false,air:true,flame:true},skin());
  x.setTransform(1,0,0,1,0,0); }

/* ---------------- input ---------------- */
function bindPad(el,k){ const on=e=>{ e.preventDefault(); ac(); el.setPointerCapture&&el.setPointerCapture(e.pointerId); if(k==='j'&&!keys.j) jPressed=true; if(k==='f') fPressed=true; keys[k]=1; el.classList.add('on'); };
  const off=e=>{ e.preventDefault(); keys[k]=0; el.classList.remove('on'); };
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off); el.addEventListener('lostpointercapture',off); el.addEventListener('contextmenu',e=>e.preventDefault()); }
bindPad($('padL'),'l'); bindPad($('padR'),'r'); bindPad($('padJ'),'j'); bindPad($('padF'),'f');
// tapping the right half of the screen also jumps (bonus for quick players)
cv.addEventListener('pointerdown',e=>{ if(mode!=='play') return; if(e.clientX>W*.55){ ac(); jPressed=true; keys.j=1; } });
cv.addEventListener('pointerup',()=>{ if(mode==='play') keys.j=0; });
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j',KeyX:'f',KeyF:'f',ShiftLeft:'f',ShiftRight:'f'};
addEventListener('keydown',e=>{ const k=KM[e.code]; if(e.code==='Escape'||e.code==='KeyP'){ if(mode==='play') setMode('pause'); else if(mode==='pause') setMode('play'); return; } if(!k||mode!=='play') return; e.preventDefault(); if(k==='j'&&!keys.j) jPressed=true; if(k==='f'&&!keys.f) fPressed=true; keys[k]=1; });
addEventListener('keyup',e=>{ const k=KM[e.code]; if(k) keys[k]=0; });
addEventListener('blur',()=>{ if(mode==='play') setMode('pause'); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&mode==='play') setMode('pause'); });

$('bPlay').onclick=()=>{ ac(); SFX.coin(); openMap(mapWorld); };
$('bDaily').onclick=()=>{ ac(); startLevel(0,0,today()); };
$('bShop').onclick=()=>{ ac(); openShop(); };
document.querySelectorAll('#diffSeg button').forEach(b=>b.onclick=()=>{ SAVE.mode=b.dataset.m; store(); setMode('title'); beep(660,.06,'triangle',.05); toast(`الصعوبة: ${DIFF[SAVE.mode].n} · ${DIFF[SAVE.mode].hearts} قلوب`); });
$('bHero').onclick=()=>{ ac(); setMode('hero'); renderHeroes(); };
function renderHeroes(){ $('heroes').innerHTML=Object.entries(HEROES).map(([id,h])=>`<button class="hero" data-h="${id}" aria-pressed="${SAVE.hero===id}"><canvas data-c="${id}"></canvas><div><b>${h.n}</b><span>${h.perk}</span><br><em>${SAVE.hero===id?'✓ مختار':h.price&&!SAVE.own['hero_'+id]?'🔒 '+h.price+' عملات':'اضغط للاختيار'}</em></div></button>`).join('');
  document.querySelectorAll('.hero').forEach(b=>b.onclick=()=>{ const id=b.dataset.h, h=HEROES[id]; if(h.price&&!SAVE.own['hero_'+id]){ if(SAVE.coins<h.price){ toast(`تحتاج ${h.price-SAVE.coins} عملات`); return; } SAVE.coins-=h.price; SAVE.own['hero_'+id]=1; toast('✓ '+h.n+' انضم!'); } SAVE.hero=id; store(); SFX.coin(); renderHeroes(); }); }
function drawHeroCards(t){ if($('sHero').hidden) return; document.querySelectorAll('.hero canvas').forEach(c2=>{ const d=Math.min(2,devicePixelRatio||1); if(c2.width!==110*d){ c2.width=110*d; c2.height=110*d; } const x=c2.getContext('2d'); x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,c2.width,c2.height); const s=1.75*d; x.setTransform(s,0,0,s,55*d,100*d); const id=c2.dataset.c, sel=SAVE.hero===id; drawHero(x,0,sel?Math.sin(t*3)*3-4:0,1,t,{run:!sel,air:sel,flame:sel},skin(),id); }); }
$('bSound').onclick=()=>{ SAVE.sound=!SAVE.sound; store(); $('soundIc').textContent=SAVE.sound?'🔊':'🔇'; $('bSound').setAttribute('aria-pressed',SAVE.sound); if(SAVE.sound){ ac(); SFX.coin(); } };
$('soundIc').textContent=SAVE.sound?'🔊':'🔇'; $('bSound').setAttribute('aria-pressed',SAVE.sound);
$('pauseBtn').onclick=()=>setMode('pause');
$('bResume').onclick=()=>setMode('play');
$('bRestart').onclick=()=>startLevel(G.w,G.l,G.daily);
$('bToMap').onclick=()=>{ const d=G.daily, w=G.w; G=null; d?setMode('title'):openMap(w); };
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>setMode('title'));
document.querySelectorAll('#shopTabs button').forEach(b=>b.onclick=()=>{ if(b.dataset.t==='hero'){ setMode('hero'); renderHeroes(); return; } shopTab=b.dataset.t; renderShop(); });

/* ---------------- loop ---------------- */
function resize(){ DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  const portrait=H>W*1.1; playH=portrait? H-Math.min(170,H*.2) : H;
  SC=portrait? Math.min(playH/(R*T), W/(8.5*T)) : playH/(R*T); }
addEventListener('resize',resize); resize();
let last=performance.now();
function frame(now){ const dt=Math.max(0,Math.min(.033,(now-last)/1000)); last=now; const t=now/1000;
  if(G&&mode==='play') update(dt);
  if(!G){ titleCam+=dt*40; const k=Math.floor(t/7); if(k!==titleK){ titleK=k; titlePrev=titleLook; titleLook=lookFor(k%WORLDS.length,(k*5)%6); titleFade=1; } titleFade=Math.max(0,titleFade-dt*1.2); titleTheme=titleLook.wi; }
  render(t);
  drawShopPrev(t); drawHeroCards(t);
  if(mode==='title'){ const c2=$('heroMini'), d=Math.min(2,devicePixelRatio||1); if(c2.width!==46*d){ c2.width=46*d; c2.height=46*d; } const x=c2.getContext('2d'); x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,c2.width,c2.height); x.setTransform(.9*d,0,0,.9*d,23*d,46*d); drawHero(x,0,Math.sin(t*3)*1.5-1,1,t,{run:false,air:false,flame:false},skin()); }
  requestAnimationFrame(frame); }
setMode('title');
requestAnimationFrame(frame);
window.__jeti={get G(){return G}, startLevel, keys, press:()=>{jPressed=true}, fire:()=>{fPressed=true}, SAVE, genLevel};
})();
</script>
