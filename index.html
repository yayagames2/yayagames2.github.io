<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="lib/i18n.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0b24">
<title>Offline Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Offline Arcade">
<style>
@font-face{font-family:"Rubik";src:url("fonts/rubik.woff") format("woff");font-weight:300 900;font-display:swap}
:root{
  --bg:#0a0b24; --ink:#f5f3ff; --muted:#a9a6d6; --line:rgba(255,255,255,.12); --glass:rgba(22,20,62,.55);
  --gold:#ffc94a; --coral:#ff6b6b; --pink:#ff5fa2; --sky:#5fd4ff; --mint:#3ee8a8; --violet:#8b6cff;
  --r:22px; --ease:cubic-bezier(.2,.8,.2,1);
  --bg2:#121b44; --card:#17214f; --txt:#f3f6ff; --green:#45e09a; --red:#ff5a6a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
body{background:#0a0b24}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.screen{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* ================= HOME ================= */
#home{padding:max(14px,env(safe-area-inset-top)) 0 max(28px,env(safe-area-inset-bottom));max-width:620px;margin:0 auto;width:100%}
.top{display:flex;align-items:center;gap:10px;padding:0 16px}
.mark{width:40px;height:40px;border-radius:12px;flex:none;box-shadow:0 6px 18px rgba(255,95,162,.35)}
.top .sp{flex:1}
.lang{display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lang{align-items:center;gap:4px;padding:7px 12px;font-size:14px;font-weight:800;color:#fff}.lang b{font-size:13px;letter-spacing:.5px}
#langSheet{position:fixed;inset:0;z-index:61;background:rgba(5,8,25,.6);display:grid;place-items:center;padding:16px}#langSheet[hidden]{display:none}
#langSheet .c{width:min(380px,100%);max-height:86vh;overflow:auto;background:#fff;color:#1c2240;border-radius:26px;padding:18px 14px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
#langSheet h3{margin:2px 0 12px;text-align:center;font-size:21px}#langSheet .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#langSheet .g button{height:48px;border-radius:14px;background:#eef1fb;color:#1c2240;font:inherit;font-weight:800;font-size:15px;border:2px solid transparent}
#langSheet .g button.on{background:#fff4e0;border-color:#ff9a3c}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:17px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.brand{padding:26px 20px 6px;text-align:center}
.logo{margin:0;line-height:.86;font-weight:900;letter-spacing:-.5px;direction:ltr}
.logo .l1{display:block;font-size:clamp(46px,14vw,78px);color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.9);letter-spacing:2px}
.logo .l2{display:block;font-size:clamp(54px,16.5vw,92px);background:linear-gradient(90deg,#ffd35a,#ff8a5c 40%,#ff5fa2 75%,#b06cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 22px rgba(255,110,140,.45))}
.tagline{margin:14px auto 0;max-width:340px;color:#d8d4ff;font-size:15.5px;line-height:1.45}
.apm{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 14px 7px 12px;border-radius:999px;background:rgba(62,232,168,.12);border:1px solid rgba(62,232,168,.4);color:#a6f7d6;font-size:13px;font-weight:700}
.apm .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(62,232,168,.7);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(62,232,168,0)}100%{box-shadow:0 0 0 0 rgba(62,232,168,0)}}

.sect{display:flex;align-items:baseline;gap:10px;margin:28px 20px 12px}
.sect h2{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px}
.sect span{color:var(--muted);font-size:13px}

/* featured carousel */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 8px;scrollbar-width:none;scroll-padding-inline:20px}
.rail::-webkit-scrollbar{display:none}
.feat{position:relative;flex:0 0 86%;max-width:520px;aspect-ratio:16/11;border-radius:26px;overflow:hidden;scroll-snap-align:start;text-align:start;
  background:#141238 center/cover no-repeat;box-shadow:0 22px 50px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.14);transition:transform .25s var(--ease)}
.feat:active{transform:scale(.975)}
.feat .art{position:absolute;inset:0;background:inherit;background-size:cover;background-position:center;transform:scale(1.04);transition:transform 6s ease-out}
.feat:hover .art{transform:scale(1.1)}
.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,36,0) 30%,rgba(10,8,36,.55) 58%,rgba(10,8,36,.95))}
.feat .body{position:absolute;inset-inline:18px;bottom:16px;z-index:2;display:flex;align-items:flex-end;gap:12px}
.feat .txt{flex:1;min-width:0}
.feat .kick{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.feat b{display:block;font-size:25px;font-weight:900;line-height:1.05;letter-spacing:-.2px}
.feat small{display:block;margin-top:6px;color:#dcd8ff;font-size:13.5px;line-height:1.4;max-width:92%}
.play{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#1a1640;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.play svg{width:22px;height:22px;margin-left:3px}
.chip{position:absolute;top:14px;inset-inline-start:14px;z-index:2;display:flex;gap:6px}
.chip i{font-style:normal;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:rgba(10,8,36,.55);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip i.new{background:linear-gradient(90deg,#ff5f7a,#ff3d9a);border-color:transparent;box-shadow:0 4px 14px rgba(255,61,154,.5)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:6px}
.dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.25);transition:.3s var(--ease)}
.dots i.on{width:22px;background:#fff}

/* classics */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.tile{position:relative;text-align:start;border-radius:var(--r);padding:14px;min-height:172px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 14px 30px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.tile:active{transform:scale(.96)}
.tile .glow{position:absolute;width:150px;height:150px;border-radius:50%;top:-50px;inset-inline-end:-40px;filter:blur(30px);opacity:.55}
.tile .ill{position:absolute;top:14px;inset-inline-end:14px;width:76px;height:76px}
.tile b{position:relative;font-size:18px;font-weight:800}
.tile small{position:relative;display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.35}
.tile .best{position:absolute;top:14px;inset-inline-start:14px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.1)}

/* coming soon */
.soon{position:relative;margin:16px 20px 0;padding:18px;border-radius:var(--r);overflow:hidden;display:flex;align-items:center;gap:14px;
  background:linear-gradient(120deg,rgba(255,201,74,.16),rgba(176,108,255,.16));border:1px dashed rgba(255,214,120,.45)}
.soon::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);transform:translateX(-100%);animation:shine 4s infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.soon .lk{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(255,201,74,.2)}
.soon b{display:block;font-size:16px}
.soon small{color:#d9cfff;font-size:13px}

.foot{margin:26px 20px 0;display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.foot a.priv{font-size:12.5px;color:#cfcaf5;padding:7px 12px;border-radius:999px;text-decoration:none;border:1px solid var(--line)}
.foot span{font-size:12.5px;color:#cfcaf5;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.install{display:none;margin:16px auto 0;padding:12px 20px;border-radius:999px;background:#fff;color:#1a1640;font-weight:800}

/* entrance */
.rise{opacity:0;transform:translateY(18px);animation:rise .7s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}.apm .dot,.soon::before{animation:none}}

/* ================= GAME SCREEN (classics) ================= */
#game{max-width:560px;margin:0 auto;width:100%;padding:max(10px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.gbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;flex:none}
.gbar h2{margin:0;font-size:20px;flex:1;font-weight:800}
.pill{padding:6px 11px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);text-align:center;min-width:64px;backdrop-filter:blur(8px)}
.pill small{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
.pill b{font-size:17px;font-variant-numeric:tabular-nums}
#gbody{flex:1;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-weight:700;font-size:15px}
.btn.pri{background:var(--gold);color:#2b1d00;border-color:transparent}
.seg{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 10px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.16);color:#fff}
.msg{min-height:22px;text-align:center;font-weight:800;color:var(--gold)}
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,6,24,.72);backdrop-filter:blur(6px);padding:20px}
.ov .box{background:linear-gradient(160deg,#2a2370,#15123f);border:1px solid var(--line);border-radius:26px;padding:24px 20px;text-align:center;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s ease-out}
.ov .big{font-size:58px}
.ov h3{margin:6px 0 4px;font-size:24px}
.ov p{margin:0 0 16px;color:#d8d4ff}
@keyframes pop{from{transform:scale(.85);opacity:0}}
/* ---------- 2048 ---------- */
.b2048{direction:ltr;position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:1;background:#3a2f5c;border-radius:16px;padding:8px;touch-action:none;user-select:none}
.b2048 .cells,.b2048 .tiles{position:absolute;inset:8px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px}
.b2048 .cells i{background:rgba(255,255,255,.08);border-radius:10px}
.t{position:absolute;display:grid;place-items:center;border-radius:10px;font-weight:900;color:#fff;transition:transform .11s ease-in-out;will-change:transform}
.t span{display:grid;place-items:center;width:100%;height:100%;border-radius:10px}
.t.new span{animation:tnew .18s ease-out}
.t.merged span{animation:tmerge .2s ease-out}
@keyframes tnew{from{transform:scale(0)}}
@keyframes tmerge{50%{transform:scale(1.18)}}
/* ---------- sudoku ---------- */
.sud{direction:ltr;display:grid;grid-template-columns:repeat(9,1fr);width:100%;max-width:440px;margin:0 auto;aspect-ratio:1;background:#0f1640;border:3px solid #8fa6ff;border-radius:12px;overflow:hidden;user-select:none}
.sud div{display:grid;place-items:center;font-size:clamp(17px,5.4vw,26px);font-weight:700;border-right:1px solid rgba(143,166,255,.25);border-bottom:1px solid rgba(143,166,255,.25);color:#9fd0ff;cursor:pointer}
.sud div.g{color:#fff}
.sud div.c3{border-right:2px solid #8fa6ff}
.sud div.r3{border-bottom:2px solid #8fa6ff}
.sud div.hl{background:rgba(92,200,255,.1)}
.sud div.same{background:rgba(255,207,74,.22)}
.sud div.sel{background:rgba(92,200,255,.4)}
.sud div.bad{color:var(--red)!important;background:rgba(255,90,106,.18)}
.sud div.win{animation:swin .5s ease-out both}
@keyframes swin{50%{background:rgba(69,224,154,.6)}}
.npad{direction:ltr;display:grid;grid-template-columns:repeat(9,1fr);gap:5px;max-width:440px;margin:0 auto;width:100%}
.npad button{aspect-ratio:.8;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:22px;font-weight:800}
.npad button.done{opacity:.25}
/* ---------- memory ---------- */
.mem{direction:ltr;display:grid;gap:9px;width:100%;max-width:440px;margin:0 auto}
.mc{aspect-ratio:.82;perspective:600px}
.mc .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.up .in,.mc.ok .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:13px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.mc .b{background:linear-gradient(135deg,#7a3cf0,#4a1fa8);border:2px solid rgba(255,255,255,.25);box-shadow:0 6px 14px rgba(0,0,0,.3)}
.mc .b::after{content:"✈️";font-size:22px;opacity:.55}
.mc .f{background:#fff;transform:rotateY(180deg);font-size:clamp(28px,9vw,44px);box-shadow:0 6px 14px rgba(0,0,0,.3)}
.mc.ok .f{background:#d9ffe9;animation:mok .4s ease-out}
@keyframes mok{50%{transform:rotateY(180deg) scale(1.1)}}
/* ---------- connect four ---------- */
.c4{direction:ltr;position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:7/6.4;background:linear-gradient(180deg,#1f6fe8,#1446b0);border-radius:18px;padding:8px;box-shadow:0 14px 30px rgba(0,0,0,.4),inset 0 -6px 0 rgba(0,0,0,.2)}
.c4 .g{position:absolute;inset:8px;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr)}
.c4 .h{border-radius:50%;margin:9%;background:#0b1230;box-shadow:inset 0 4px 6px rgba(0,0,0,.55)}
.c4 .d{border-radius:50%;margin:9%;position:relative;z-index:1}
.c4 .d.p1{background:radial-gradient(circle at 35% 30%,#ffe58a,#ffbf1f 55%,#c98a00)}
.c4 .d.p2{background:radial-gradient(circle at 35% 30%,#ff9aa6,#ff3d55 55%,#b3132a)}
.c4 .d.drop{animation:drop .36s cubic-bezier(.4,0,1,1)}
.c4 .d.w{animation:glow .6s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 4px #fff,0 0 20px #fff}}
@keyframes drop{from{transform:translateY(var(--dy))}}
.c4 .cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);z-index:2}
.c4 .cols button:active{background:rgba(255,255,255,.08)}
.turn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800}
.turn i{width:18px;height:18px;border-radius:50%;display:inline-block}
/* ---------- frame ---------- */
#jetiWrap{position:fixed;inset:0;z-index:40;background:#000}
#gLoad{position:fixed;inset:0;z-index:46;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2a2440,#07070d 70%);transition:opacity .35s}#gLoad.out{opacity:0}
.gl-in{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px}
.gl-in img{width:min(88vw,540px);aspect-ratio:16/10;object-fit:cover;border-radius:16px;box-shadow:0 0 0 2px rgba(255,255,255,.12),0 20px 60px rgba(0,0,0,.7),0 0 80px rgba(120,90,255,.35);animation:glPop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes glPop{from{transform:scale(.85);opacity:0}}
.gl-in b{color:#fff;font-size:18px;font-weight:800;opacity:.85;direction:ltr}
.gl-sp{width:46px;height:46px;border-radius:50%;border:5px solid rgba(255,255,255,.18);border-top-color:#e50914;animation:glS 0.9s linear infinite}@keyframes glS{to{transform:rotate(360deg)}}
.nf-c.post b,.post b{opacity:0}.nf-c.post .sh{background:linear-gradient(0deg,rgba(0,0,0,.35),rgba(0,0,0,0) 40%)}
#jetiWrap iframe{width:100%;height:100%;border:0;display:block}
#jetiBack{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:2;height:32px;padding:0 12px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.g2048 .glow{background:#ffb13c}.gsud .glow{background:#3c8bff}.gmem .glow{background:#b05cff}.gfour .glow{background:#1fc8a0}
.apm{cursor:pointer;font-family:inherit}
.apm.on{background:rgba(95,212,255,.14);border-color:rgba(95,212,255,.55);color:#c8efff}
#apSheet{position:fixed;inset:0;z-index:60;background:rgba(5,8,25,.6);display:grid;place-items:center;padding:16px}
#apSheet[hidden]{display:none}
#apSheet .c{width:min(380px,100%);background:#fff;color:#1c2240;border-radius:26px;padding:22px 18px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.4)}
#apSheet h3{margin:0 0 6px;font-size:23px}#apSheet p{margin:6px 0;color:#4a5478;font-weight:700;font-size:14.5px;line-height:1.5}
#apSheet .st{background:#eef4ff;border-radius:16px;padding:10px 12px;margin:10px 0;text-align:start;font-weight:700;font-size:14px;color:#2a3a6a;line-height:1.55}
#apSheet button{height:48px;padding:0 20px;border-radius:999px;font:inherit;font-weight:800;font-size:16px;border:0;margin:4px}
#apGo{background:linear-gradient(180deg,#5fd4ff,#2a8aff);color:#fff;box-shadow:0 5px 0 #1a5abf}
#apX{background:#eef2fb;color:#1c2240}

/* ================= NETFLIX-STYLE HOME ================= */
body{background:#0b0b12}
#sky{opacity:.28}
#home{padding:0 0 max(28px,env(safe-area-inset-bottom));max-width:none;width:100%;background:transparent}
.nf-nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0));transition:background .3s}
.nf-nav.solid{background:rgba(11,11,18,.96);box-shadow:0 4px 20px rgba(0,0,0,.5)}
.nf-nav .sp{flex:1}
.nf-logo{direction:ltr;display:flex;flex-direction:column;line-height:.82;font-weight:900;letter-spacing:1px}
.nf-logo span{font-size:12px;color:#ffd35a;letter-spacing:4px}.nf-logo b{font-size:24px;background:linear-gradient(90deg,#ff3b5c,#ff8a3a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.nf-ap{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:700;color:#cfefff;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nf-ap .dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--mint);animation:ping 2s infinite}
.nf-ap.on .dot{background:#5fd4ff}
.nf-hero{position:relative;height:min(74vh,640px);min-height:440px;overflow:hidden}
.nf-hbg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.04);transition:opacity .6s;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.14) translateX(-2%)}}
.nf-hshade{position:absolute;inset:0;background:linear-gradient(0deg,#0b0b12 4%,rgba(11,11,18,.6) 38%,rgba(11,11,18,0) 66%),linear-gradient(90deg,rgba(11,11,18,.0),rgba(11,11,18,0))}
[dir=rtl] .nf-hshade{background:linear-gradient(0deg,#0b0b12 4%,rgba(11,11,18,.62) 40%,rgba(11,11,18,0) 68%)}

function showHelp(id,first){ const H=HELP[id]; if(!H) return; const o=document.createElement('div'); o.className='solHelp'; o.innerHTML=`<div class="solHelpBox hb2" dir="${RTL?'rtl':'ltr'}"><div style="font-size:46px;text-align:center;line-height:1">${H[0]}</div><h3>${H[1]}</h3>${H[2].map(r=>`<p><b>${r[0]} ${r[1]}:</b> ${r[2]}</p>`).join('')}<button class="btn pri" style="width:100%">${L('הבנתי, בוא נשחק!','Got it, let’s play!')}</button></div>`; o.onclick=e=>{ if(e.target===o||e.target.tagName==='BUTTON'){ o.remove(); S['help_'+id]=1; save(); } }; document.body.appendChild(o); }

/* =====================================================================
   2048
   ===================================================================== */
const G2048={ id:'2048', name:'2048', ic:'🔢', cls:'c-2048', desc:L('מחליקים ומחברים מספרים עד 2048','Swipe and merge numbers up to 2048'), tag:L('חשיבה','Brain'),
  bestTxt:()=>S.b_2048?'🏆 '+S.b_2048:'',
  mount(el){ pills([[L('ניקוד','Score'),'s2048',0],[L('שיא','Best'),'b2048',S.b_2048||0]]);
    el.innerHTML=`<div class="b2048" id="bd"><div class="cells">${'<i></i>'.repeat(16)}</div><div class="tiles" id="tl" style="display:block"></div></div>
      <div class="msg" id="m2048">${L('מחליקים עם האצבע לכל כיוון','Swipe in any direction')}</div><div class="row"><button class="btn" id="undo">↶ ${L('ביטול מהלך','Undo')}</button><button class="btn pri" id="new">${L('משחק חדש','New game')}</button></div>`;
    const tl=el.querySelector('#tl'), bd=el.querySelector('#bd'); let grid, score, won, id=0, tiles, prev=null, keepGoing=false;
    const COL={2:'#7c6cff',4:'#5f8bff',8:'#31b7ff',16:'#22d3a8',32:'#56d14a',64:'#b7d12a',128:'#ffcf4a',256:'#ffa83a',512:'#ff7a3d',1024:'#ff4f6a',2048:'#ff2fa0'};
    const geo=()=>{ const w=tl.clientWidth, gap=8, c=(w-gap*3)/4; return {c,gap}; };
    function place(t,isNew,merged){ const {c,gap}=geo(); let e=t.el; if(!e){ e=document.createElement('div'); e.className='t'; e.innerHTML='<span></span>'; tl.appendChild(e); t.el=e; }
      e.style.width=e.style.height=c+'px'; e.style.transform=`translate(${t.x*(c+gap)}px,${t.y*(c+gap)}px)`; const sp=e.firstChild; sp.textContent=t.v;
      sp.style.background=COL[t.v]||'#222'; sp.style.fontSize=(t.v<100?c*.45:t.v<1000?c*.38:c*.3)+'px'; sp.style.boxShadow=t.v>=128?`0 0 ${Math.min(24,t.v/40)}px ${COL[t.v]||'#fff'}`:'none';
      e.classList.toggle('new',!!isNew); e.classList.toggle('merged',!!merged); if(isNew||merged){ void e.offsetWidth; } }
    function add(){ const free=[]; for(let y=0;y<4;y++) for(let x=0;x<4;x++) if(!grid[y][x]) free.push([x,y]); if(!free.length) return; const [x,y]=free[Math.random()*free.length|0];
      const t={id:++id,v:Math.random()<.9?2:4,x,y}; grid[y][x]=t; tiles.push(t); place(t,true); }
    function setScore(){ el.ownerDocument.getElementById('s2048').textContent=score; if(best('2048',score)) $('b2048').textContent=score; }
    function start(){ tl.innerHTML=''; grid=[...Array(4)].map(()=>Array(4).fill(null)); tiles=[]; score=0; won=false; keepGoing=false; prev=null; add(); add(); setScore(); $('m2048').textContent=L('מחליקים עם האצבע לכל כיוון','Swipe in any direction'); }
    function snapshot(){ return {g:grid.map(r=>r.map(t=>t?t.v:0)),score}; }
    function restore(sn){ tl.innerHTML=''; tiles=[]; grid=[...Array(4)].map(()=>Array(4).fill(null)); sn.g.forEach((r,y)=>r.forEach((v,x)=>{ if(v){ const t={id:++id,v,x,y}; grid[y][x]=t; tiles.push(t); place(t); } })); score=sn.score; setScore(); }
    function canMove(){ for(let y=0;y<4;y++) for(let x=0;x<4;x++){ const t=grid[y][x]; if(!t) return true; if(x<3&&grid[y][x+1]&&grid[y][x+1].v===t.v) return true; if(y<3&&grid[y+1][x]&&grid[y+1][x].v===t.v) return true; } return false; }
    function move(dx,dy){ const snap=snapshot(); let moved=false, gain=0; const order=[0,1,2,3]; const xs=dx>0?[...order].reverse():order, ys=dy>0?[...order].reverse():order; const mergedSet=new Set(), gone=[];
      for(const y of ys) for(const x of xs){ const t=grid[y][x]; if(!t) continue; let nx=x, ny=y;
        while(true){ const tx=nx+dx, ty=ny+dy; if(tx<0||tx>3||ty<0||ty>3) break; const o=grid[ty][tx]; if(!o){ nx=tx; ny=ty; continue; }
          if(o.v===t.v&&!mergedSet.has(o.id)){ nx=tx; ny=ty; } break; }
        if(nx===x&&ny===y) continue; moved=true; grid[y][x]=null; const o=grid[ny][nx];
        if(o){ o.v*=2; gain+=o.v; mergedSet.add(o.id); t.x=nx; t.y=ny; place(t); gone.push([t,o]); } else { grid[ny][nx]=t; t.x=nx; t.y=ny; place(t); } }
      if(!moved){ return; } prev=snap; SND.move();
      setTimeout(()=>{ gone.forEach(([t,o])=>{ t.el.remove(); tiles=tiles.filter(z=>z!==t); place(o,false,true); }); if(gain){ score+=gain; setScore(); if(gain>=128) tone(700+Math.log2(gain)*40,.12,'triangle',.08); }
        add(); if(!won&&!keepGoing&&tiles.some(t=>t.v>=2048)){ won=true; SND.win(); popup('🏆',L('הגעת ל־2048!','You reached 2048!'),L('אלוף! אפשר להמשיך לשחק ולשבור שיאים.','Champion! Keep playing and break records.'),[{t:L('להמשיך','Keep going'),pri:1,f:()=>{keepGoing=true}},{t:L('משחק חדש','New game'),f:start}]); }
        else if(!canMove()){ SND.bad(); popup('😮',L('אין יותר מהלכים','No more moves'),`${L('הניקוד שלך:','Your score:')} ${score}`,[{t:L('משחק חדש','New game'),pri:1,f:start},{t:L('ביטול מהלך','Undo'),f:undo}]); } },115); }
    function undo(){ if(!prev) return; restore(prev); prev=null; SND.tap(); }
    el.querySelector('#new').onclick=()=>{ SND.tap(); start(); }; el.querySelector('#undo').onclick=undo;
    let sx=0, sy=0, act=false;
    bd.addEventListener('pointerdown',e=>{ act=true; sx=e.clientX; sy=e.clientY; ac(); });
    bd.addEventListener('pointerup',e=>{ if(!act) return; act=false; const dx=e.clientX-sx, dy=e.clientY-sy; if(Math.max(Math.abs(dx),Math.abs(dy))<24) return; if(Math.abs(dx)>Math.abs(dy)) move(dx>0?1:-1,0); else move(0,dy>0?1:-1); });
    const key=e=>{ const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key]; if(m){ e.preventDefault(); move(...m); } };
    document.addEventListener('keydown',key); const rs=()=>tiles.forEach(t=>place(t)); addEventListener('resize',rs);
    this.cleanup=()=>{ document.removeEventListener('keydown',key); removeEventListener('resize',rs); };
    requestAnimationFrame(start); },
  unmount(){ this.cleanup&&this.cleanup(); } };

const GSUD={ id:'sudoku', name:L('סודוקו','Sudoku'), ic:'🧩', cls:'c-sudoku', desc:L('שלוש רמות קושי, לוח חדש בכל פעם','Three levels, a fresh board every time'), tag:L('חשיבה','Brain'),
  bestTxt:()=>S.b_sud_e?'🏆 '+fmtT(S.b_sud_e):'',
  mount(el){ pills([[L('זמן','Time'),'sT','0:00'],[L('טעויות','Mistakes'),'sM','0/3']]);
    const lvl=S.sudLvl||'e';
    el.innerHTML=`<div class="seg" id="lv"><button data-l="e">${L('קל','Easy')}</button><button data-l="m">${L('בינוני','Medium')}</button><button data-l="h">${L('קשה','Hard')}</button></div>
      <div class="sud" id="sb"></div><div class="npad" id="np"></div><div class="row"><button class="btn" id="er">⌫ ${L('מחק','Erase')}</button><button class="btn" id="hint">💡 ${L('רמז','Hint')}</button><button class="btn pri" id="nw">${L('לוח חדש','New board')}</button></div>`;
    const sb=el.querySelector('#sb'), np=el.querySelector('#np'); let sol, puz, cur, sel=-1, mist=0, t0=0, timer=0, done=false, level=lvl;
    function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
    const ok=(g,i,n)=>{ const r=i/9|0, c=i%9, br=r-r%3, bc=c-c%3; for(let k=0;k<9;k++){ if(g[r*9+k]===n||g[k*9+c]===n) return false; const rr=br+(k/3|0), cc=bc+k%3; if(g[rr*9+cc]===n) return false; } return true; };
    function fill(g){ const i=g.indexOf(0); if(i<0) return true; for(const n of shuffle([1,2,3,4,5,6,7,8,9])){ if(ok(g,i,n)){ g[i]=n; if(fill(g)) return true; g[i]=0; } } return false; }
    function count(g,lim){ let best=-1, bc=10; for(let i=0;i<81;i++) if(!g[i]){ let c=0; for(let n=1;n<=9;n++) if(ok(g,i,n)) c++; if(c<bc){ bc=c; best=i; if(c<2) break; } } if(best<0) return 1; let tot=0;
      for(let n=1;n<=9&&tot<lim;n++) if(ok(g,best,n)){ g[best]=n; tot+=count(g,lim-tot); g[best]=0; } return tot; }
    function gen(l){ const g=Array(81).fill(0); fill(g); sol=g.slice(); const target={e:38,m:48,h:55}[l]; const p=g.slice(); let removed=0;
      for(const i of shuffle([...Array(81).keys()])){ if(removed>=target) break; const v=p[i]; p[i]=0; if(count(p.slice(),2)!==1) p[i]=v; else removed++; } return p; }
    function render(){ const sv=sel>=0?cur[sel]:0; let html=''; for(let i=0;i<81;i++){ const r=i/9|0, c=i%9; const cls=[];
        if(puz[i]) cls.push('g'); if(c%3===2&&c<8) cls.push('c3'); if(r%3===2&&r<8) cls.push('r3');

    // ---- AI (minimax + alpha-beta)

function renderChips(){ const F=[['all',L('הכל','All')],['little',L('🧒 קטנטנים 3–6','🧒 Little kids 3–6')],['kids',L('🧑 ילדים 7–12','🧑 Kids 7–12')],['big',L('🧔 נוער ומבוגרים','🧔 Teens & adults')],['fav',L('❤️ מועדפים','❤️ Favorites')],['board',L('🎲 משחקי קופסה','🎲 Board games')]];

function gameText(g){ const n=typeof g.name==='string'?g.name:''; return (n+' '+(g.sub||'')+' '+(g.kick||'')+' '+(g.desc||'')+' '+g.id).toLowerCase(); }

  if(fState.age==='fav') list=(S.fav||[]).map(gOf).filter(Boolean); else if(fState.age==='board') list=['backgammon','checkers','dominoes','snakes','four','memory','solitaire','sudoku'].map(gOf).filter(Boolean); else if(fState.age!=='all') list=AGE[fState.age].map(gOf).filter(Boolean);
  if(q) list=list.filter(g=>gameText(g).includes(q));
  const ttl=fState.age==='fav'?L('❤️ המועדפים שלי','❤️ My favorites'):q?L(`תוצאות עבור "${fState.q.trim()}"`,`Results for "${fState.q.trim()}"`):($('fchips').querySelector('.on')||{}).textContent||'';
  $('results').innerHTML=`<h2>${ttl} <small style="color:#9a98b0;font-size:13px">(${list.length})</small></h2>`+(list.length?`<div class="nf-grid">${list.map(g=>cardHTML(g)).join('')}</div>`:`<div class="nf-empty">${fState.age==='fav'?L('עוד אין מועדפים – לחצו על ♡ בפינה של משחק שאתם אוהבים','No favorites yet – tap ♡ on a game you love'):L('לא מצאנו משחק כזה 🤔 נסו מילה אחרת','No game found 🤔 try another word')}</div>`); }
function applyFilter(){ const on=fState.on(); $('results').hidden=!on; $('rows').hidden=on; $('qx').hidden=!fState.q; renderChips(); if(on) renderResults(); }
$('fchips').addEventListener('click',e=>{ const b=e.target.closest('[data-age]'); if(!b) return; fState.age=b.dataset.age; try{ SND.tap(); }catch(err){} applyFilter(); const r=$('filt').getBoundingClientRect(); if(r.top>80) scrollTo({top:scrollY+r.top-60,behavior:'smooth'}); });
$('q').addEventListener('input',()=>{ fState.q=$('q').value; if(fState.q) fState.age='all'; applyFilter(); });

let offTries=0;
const NG=()=>{const n=GAMES.length,r=Math.floor(n/10)*10;return r===n?String(n):r+'+';};
async function offReady(){ const el=$('offStrip'); const n=NG(); let ok=false, sw=false;
  try{ sw=!!(navigator.serviceWorker&&navigator.serviceWorker.controller); if('caches' in window){ const ks=(await caches.keys()).filter(k=>/^offline-arcade-v\d+$/.test(k)).sort((a,b)=>+a.split('-v')[1]-+b.split('-v')[1]); const k=ks.pop(); if(k){ const c=await caches.open(k); ok=(await c.keys()).length>150; } } }catch(e){}
  const can='serviceWorker' in navigator&&location.protocol.startsWith('http')&&!/claude/.test(location.hostname);
  el.innerHTML=ok?`✈️ <b>${n}</b> ${L('משחקים','games')} · <span class="ok">✓ ${L('כולם שמורים במכשיר – מוכן לטיסה','all saved on this device – ready for takeoff')}</span>`
    : can&&navigator.onLine?`✈️ <b>${n}</b> ${L('משחקים','games')} · <span class="wait">⏳ ${L('שומרים את המשחקים במכשיר…','saving the games to this device…')}</span>`
    : `🎮 <b>${n}</b> ${L('משחקים בחינם · בלי פרסומות · בלי אינטרנט','free games · no ads · no internet needed')}`;
  if(!ok&&can&&offTries++<40) setTimeout(offReady,3000); }
function showLoad(g){ const l=$('gLoad'); l.querySelector('img').src=POSTER(g.id); l.querySelector('b').textContent=g.name; l.hidden=false; l.classList.remove('out'); }

/* ---------- animated sky ---------- */
const sky=(()=>{ const c=$('sky'), x=c.getContext('2d'); let W=0,H=0,DPR=1,stars=[],clouds=[],shoot=null,raf=0,run=true,t0=performance.now();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; c.width=W*DPR; c.height=H*DPR; x.setTransform(DPR,0,0,DPR,0,0);
    stars=[...Array(Math.round(W*H/5200))].map(()=>({x:Math.random()*W,y:Math.random()*H*.75,r:Math.random()*1.3+.3,p:Math.random()*6.28,s:.6+Math.random()*1.6}));
    clouds=[...Array(9)].map((_,i)=>({x:Math.random()*W,y:H*(.68+Math.random()*.3),w:160+Math.random()*260,h:40+Math.random()*50,v:(6+Math.random()*12)*(i%2?1:.6),a:.05+Math.random()*.08})); }
  function frame(now){ const t=(now-t0)/1000;
    const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0a0b24'); g.addColorStop(.45,'#1d1452'); g.addColorStop(.78,'#4a1f6b'); g.addColorStop(1,'#a8406d'); x.fillStyle=g; x.fillRect(0,0,W,H);
    const sun=x.createRadialGradient(W*.5,H*1.02,0,W*.5,H*1.02,H*.6); sun.addColorStop(0,'rgba(255,170,90,.55)'); sun.addColorStop(.5,'rgba(255,90,130,.12)'); sun.addColorStop(1,'rgba(255,90,130,0)'); x.fillStyle=sun; x.fillRect(0,0,W,H);
    for(const s of stars){ const a=.35+.65*Math.abs(Math.sin(s.p+t*s.s)); x.globalAlpha=a*(1-s.y/(H*.8)); x.fillStyle='#fff'; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.28); x.fill(); }
    x.globalAlpha=1;
    if(!reduce){ if(!shoot&&Math.random()<.004) shoot={x:Math.random()*W*.8+W*.2,y:Math.random()*H*.35,l:0};
      if(shoot){ shoot.l+=1/60; const k=shoot.l/0.9, sx=shoot.x-k*W*.35, sy=shoot.y+k*H*.18; const gr=x.createLinearGradient(sx,sy,sx+90,sy-46); gr.addColorStop(0,'rgba(255,255,255,'+(1-k)+')'); gr.addColorStop(1,'rgba(255,255,255,0)');
        x.strokeStyle=gr; x.lineWidth=2; x.beginPath(); x.moveTo(sx,sy); x.lineTo(sx+90,sy-46); x.stroke(); if(k>=1) shoot=null; } }
    for(const cl of clouds){ const cx=((cl.x+(reduce?0:t*cl.v))%(W+cl.w*2))-cl.w; x.fillStyle='rgba(255,210,235,'+cl.a+')';
      for(const [ox,oy,rw,rh] of [[0,0,.5,.5],[-.28,.12,.32,.38],[.3,.08,.3,.42]]){ x.beginPath(); x.ellipse(cx+cl.w*ox,cl.y+cl.h*oy,cl.w*rw,cl.h*rh,0,0,6.28); x.fill(); } }
    if(run&&!reduce) raf=requestAnimationFrame(frame); }
  size(); addEventListener('resize',()=>{ size(); if(reduce||!run) frame(performance.now()); }); frame(performance.now());
  return { pause(){ run=false; cancelAnimationFrame(raf); }, resume(){ if(!run){ run=true; if(!reduce) raf=requestAnimationFrame(frame); } } };
})();
document.addEventListener('visibilitychange',()=>{ document.hidden?sky.pause():($('jetiWrap').hidden&&sky.resume()); });

(()=>{ const el=$('intro'); let seen=false; try{ seen=sessionStorage.getItem('oa-intro')==='1'; sessionStorage.setItem('oa-intro','1'); }catch(e){}

  $('introSub').textContent=L('משחקים בלי אינטרנט','GAMES WITHOUT INTERNET'); $('introSkip').textContent=L('לחצו לדילוג','Tap to skip');
  try{ const a=new (window.AudioContext||window.webkitAudioContext)(); if(a.state==='running'&&!S.mute){ const t=a.currentTime; [[392,.15],[523,.27],[659,.39],[784,.51]].forEach(([f,d])=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.12,t+d+.02); g.gain.exponentialRampToValueAtTime(.001,t+d+.5); o.connect(g).connect(a.destination); o.start(t+d); o.stop(t+d+.6); }); } }catch(e){}
  const done=()=>{ el.remove(); }; el.addEventListener('animationend',e=>{ if(e.target===el) done(); }); el.onclick=()=>{ el.style.animation='inOut .3s ease forwards'; };
  setTimeout(()=>{ if(document.body.contains(el)) done(); },4500); })();
